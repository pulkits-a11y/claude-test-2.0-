    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* the picture (all shots): the camera-shake target at the logo slam; captions sit outside it */
      #b01-cam, .b01-shot, .b01-wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .b01-full { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      /* shot 1 (lightbar): static framing of the working clip (LOOP_FRAME.json "scale"/"origin"; U3: no punch-in) */
      #b01-s1-frame { transform-origin: 50% 50%; transform: scale(1); }
      /* shot B (second GTA VI angle, U3): static 112% about (400, 1080) keeps the trailer's own wanted-star HUD
         (x 1760-1880, y 32-100) out of frame: visible source x 43-1757, y 116-1080 */
      #b01-sB-frame { transform-origin: 400px 1080px; transform: scale(1.12); }
      /* grid year labels: the kit's .fx-year (Coolvetica 60 px, bottom-left; B14 uses the same class); the growing GTA VI
         cell covers them on purpose (55-61): data-layout-allow-occlusion */
      /* "every GTA," on a 60%-black pill (doc beat 2); padding offset so the ink stays where the kit centres it */
      .b01-pill .rc-lk__box { background: rgba(0, 0, 0, 0.6); border-radius: 48px; padding: 30px 60px 34px;
        margin-top: calc(var(--rc-y, 540px) - var(--rc-lk-c, 0px) - 30px); }
      /* the GTA VI logo (v04 cut-out, 848 x 660 -> 462.5 x 360), centred on (960, 540) */
      #b01-logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
      #b01-logo-box { position: absolute; left: 728.75px; top: 360px; width: 462.5px; height: 360px; }
      #b01-logo-pop { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #b01-logo-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.55)); }
      /* "from the cops?" sits low over the sunlit road: a dark halo under the kit drop shadow (check: 2.3-2.9:1 without it) */
      .b01-halo { text-shadow: var(--text-drop), 0 0 16px rgba(0, 0, 0, 0.6), 0 0 38px rgba(0, 0, 0, 0.45); }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // a hard cut on frame n (the kit's own pattern: a half-frame steps(1) tween just before the frame)
      const hard = (sel, from, to, n) => tl.fromTo(sel, from, Object.assign({ duration: 0.5 / 30, ease: 'steps(1)', immediateRender: false }, to), (n - 0.75) / 30);

      const FX = RCK.fx;
      // ---- captions (kit v05, U2): words appear on their frame, white; "Why" and "cops?" pop + blur in
      T.lockupsWire(tl);

      // ---- 1-frame 70% white flash on beat f1 (local 7): frame 0 stays the clean, bright light-bar image (the doc's QA
      // "frame 0 ... readable as a still thumbnail"; B18's loop cross lands on it); siren_whoop + sub_hit stay on f0
      FX.flash(tl, '#b01-flash', L(7), { opacity: 0.7 });

      // ---- grid (cut on "every", local 26): complete on its first frame; tiles slam TL->BR on a 2f stagger: each tile's
      // picture 108 -> 100% over 4f (power3.out) + a short tile flash (kit glow flash, no outer glow: 6 px gutters)
      ['#b01-c1', '#b01-c2', '#b01-c3', '#b01-c4', '#b01-c5', '#b01-c6'].forEach((c, i) => {
        const f = 26 + 2 * i, m = c + ' .rc-l3__media';
        gsap.set(m, { scale: 1.08, transformOrigin: '50% 50%' });
        tl.fromTo(m, { scale: 1.08 }, { scale: 1, duration: L(4), ease: 'power3.out', immediateRender: false }, L(f));
        S.glowFlash(tl, c, L(f), { inF: 1, outF: 5, peak: 0.55, glow: 0 });
      });
      // cell 6 grows to full frame on "even" (55-61, v04 S01 gta6_cell_full), then the shot pushes 100 -> 104% to the cut
      S.gridGrow(tl, '#b01-grow', L(55), { durF: 6 });
      C.push(tl, '#b01-sA', L(61), { until: L(96), from: 1, to: 1.04 });

      // ---- the GTA VI logo slam on "GTA" (local 69): the kit's logoSlam, the SAME call as B13 / B17 (from 150): visible on
      // 69 at 150%, slams to 94% by 73 (power2.in), 100% by 75; impact 73: 85% white flash, flash-star, 9 px shake 6f
      FX.logoSlam(tl, '#b01-logo-pop', L(69), { from: 150, flash: '#b01-flash', star: '#b01-star', shakeTarget: '#b01-cam', shakePx: 9, shakeF: 6 });
      // 1.2% overscan on the picture while it shakes (73-79: 11.5 px each side >= 9 px), so no frame edge ever shows
      hard('#b01-cam', { scale: 1 }, { scale: 1.012 }, 73);
      hard('#b01-cam', { scale: 1.012 }, { scale: 1 }, 79);

      // ---- SUV flip: push 100 -> 104% (114 -> 140, sine.inOut), held through the tail handle; B2's hand-off copy continues
      // it: scale(m) = 1 + 0.04 sineInOut((m - 114) / 26)
      C.push(tl, '#b01-sC', L(114), { until: L(140), from: 1, to: 1.04 });

      // ---- M1 stars from "have" (93), v04; X9 siren wash on "cops?" (125), v04
      M.starsPopIn(tl, '#b01-stars', L(93), { stepF: 3, durF: 3 });
      X.sirenWash(tl, '#b01-x9', L(125));

      tl.set({}, {}, L(146));
      window.__timelines["b01-hook"] = tl;
    </script>
