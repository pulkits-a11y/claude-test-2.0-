      /* v03 L4 (note 8): the kit's ink variant (.rc-l4--ink, screens.css v03): the frosted (gaussian-blur) tiles are DARK
         tiles in the dark-card ink (--card-bg #0A0A0A, not pure black) with the faint 1 px grid line; a cleared tile
         (opacity 1 -> 0) shows the sharp footage. No frosted copy any more. */
      /* v04 (review #5): the GTA VI logo lockup. Logo 462.5 x 360 px (the 848 x 660 cut-out downscaled), centred on (960, 540);
         small words (Coolvetica 60 px, the kit's lockup size) on one line each side, 40 px from the logo's ink, their cap
         centre on y 540 (row top = 540 - 0.195 em - 0.336 em). Left row right-aligned (ends x 690), right row from x 1230. */
      .b01-vi { display: block; }
      .b01-vi__left, .b01-vi__right { position: absolute; top: 508.1px; font-size: 60px; line-height: 60px; height: 60px;

           and the sunlit street of the GTA 6 shot (check measured 1.9-2.5:1 with the kit glow alone) */

      .b01-vi__right { left: 1230px; }
      .b01-vi__logo { position: absolute; left: 728.7px; top: 360px; width: 462.5px; height: 360px; }

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // words.json comp_t (v02, seconds on this composition's clock)
      const W = { Why: 0.233, does: 0.487, every: 0.864, even: 1.829, have: 3.092, from: 3.8, cops: 4.163 };

      // v03 captions: every .rc-lk above; plain words hard-cut on their data-rc-f frame, the starred "cops?" pops + blurs in.
      T.lockupsWire(tl);
      // v04 (review #5): the GTA VI logo pops + blurs in on "GTA" (local 69) with the kit's starred-word pop (POP3: full
      // opacity on its frame, blur 20 px -> 0, 92 -> 100%, 6f expo.out); it holds to the hard cut on "from" (114).
      T.wordPops(tl, '#b01-vi-logo', null);

      // L4 (local 0-26), v03 (note 8): all 12 tiles are dark (dark-card ink); the two centre tiles clear from dark to the
      // footage, one per spoken word, 3f each (power2.out), seeded order ("Why" 7, "does" 15): seed 2 = tiles 5 then 6
      // (row 2, columns 2-3: the two police cars). The other 10 never clear (the cut to L3 comes on "every").
      S.frostClear(tl, '#b01-frost', [W.Why, W.does], { seed: 2 });
      // v03 (note 13): v01's slow push on the shot is back, 100 -> 104% (sine.inOut, never linear), from the head handle to
      // the cut on "every" (local 26); the v02 zoom-out is gone. The grid lines (tiles) stay still.
      C.push(tl, '#b01-frost .rc-l4__plate', 0, { until: L(26), from: 1, to: 1.04 });

      // L3 (cut on "every", local 26): cells pop L->R, T->B, 3f apart (4f each: 96 -> 100% power3.out + fade power2.out).
      // v03 (note 13): no punch-in on the cut (the grid build is not pushed, as v01).
      S.gridBuild(tl, '#b01-grid', L(26), { stepF: 3 });
      // On "even" (local 55): cell 6 switches to R1.2 (police truck shot) and scales to full frame over 6f, power3.out
      // (full on local 61 = beat f55, S01 `gta6_cell_full`).
      S.gridGrow(tl, '#b01-grow', L(55), { durF: 6 });
      // Held full-frame GTA 6, v03 (note 13: v01's slow push, eased): push 100% (local 61) -> 104% on the boundary (local
      // 140), easeInOutSine, then held at 104% through the tail handle (B2's hand-off copy continues exactly this curve:
      // scale(m) = 1 + 0.04 sineInOut((m-61)/79)).
      C.push(tl, '#b01-grow', L(61), { until: L(140), from: 1, to: 1.04 });

      // M1 row centred on (1640, 80) (CONFLICTS C35: clears the trailer's own HUD); five stars pop 3f apart from "have"
      // (local 93, 96, 99, 102, 105; 3f power3.out each, all landed 108).
      M.starsPopIn(tl, '#b01-stars', W.have, { stepF: 3, durF: 3 });

      // v03 (note 13): no key punch on "cops?" any more (the X9 wash below is the plan's own accent).
      // X9 on "cops?" (local 125): red 35% Overlay 2f, blue 2f, gone 129 (hard frames: a cut pattern, not a move).
      X.sirenWash(tl, '#b01-x9', L(125));

      tl.set({}, {}, L(146));                         // timeline spans the whole composition
      window.__timelines["b01-hook"] = tl;
    </script>
