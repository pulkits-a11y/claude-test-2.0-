    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // words.json comp_t (seconds on this composition's clock)
      const W = { Why: 0.235, does: 0.506, every: 0.907, even: 1.935, have: 3.279, from: 4.033, cops: 4.42 };

      // L4 (beat f0-21): one tile clears per spoken word, 3f each, seeded random order ("Why" local 7, "does" local 15);
      // seed 2 = tiles 5 then 6 first (row 2, columns 2-3: the two police cars), then 0, 10, 1, ...
      // both plates (sharp picture + frosted copy) push 100 -> 104% across the shot, from the head handle to the cut.
      S.frostClear(tl, '#b01-frost', [W.Why, W.does], { seed: 2 });
      S.push(tl, '#b01-frost .rc-l4__plate', 0, { until: L(27) });

      // L3 (cut on "every", local 27): cells pop L->R, T->B, 3f apart (4f each, 96 -> 100% + fade).
      S.gridBuild(tl, '#b01-grid', L(27), { stepF: 3 });
      // On "even" (local 58): cell 6 switches to R1.2 (police truck shot) and scales to full frame over 6f, ease out (full on local 64 = beat f58, S01).
      S.gridGrow(tl, '#b01-grow', L(58), { durF: 6 });
      // Held full-frame GTA 6: push 100% (local 64) -> 104% at the beat end (local 149), same rate on through the tail handle.
      S.push(tl, '#b01-grow', L(64), { until: L(155), from: 1, to: 1 + 0.04 * 91 / 85 });

      // M1 row centred on (1640, 80): the plan's (1700, 80) moved 60 px left so the 5th star clears the trailer's own HUD
      // icons (top-right of R1.2); same y, same size.
      // M1: five stars pop 3f apart from "have" (local 98, 101, 104, 107, 110; all landed local 113).
      M.starsPopIn(tl, '#b01-stars', W.have, { stepF: 3, durF: 3 });

      // T2: keyword "cops?" 6f blur-in on its spoken frame (local 133); pair fades over 4f from local 145 (gone local 149).
      T.punchPair(tl, '#b01-t2', W.cops, { outAt: L(145) });

      // X9 on "cops" (local 133): red 35% Overlay 2f, blue 2f, gone local 137.
      X.sirenWash(tl, '#b01-x9', L(133));

      tl.set({}, {}, L(155));                         // timeline spans the whole composition
      window.__timelines["b01-hook"] = tl;
    </script>
