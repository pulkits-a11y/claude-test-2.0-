      <!-- ===== T2 punch pair, word by word: "from" (lead, local 114) / "the" (lead, 120) + keyword "cops?" (blur punch 30 -> 0 px,
           108 -> 100%, 6f expo.out, on its onset 125); the last group exits in 3f (power2.in) ending on the boundary (140) ===== -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // words.json comp_t (v02, seconds on this composition's clock)
      const W = { Why: 0.233, does: 0.487, every: 0.864, even: 1.829, have: 3.092, from: 3.8, cops: 4.163 };

      // captions (rule A): every .rc-cap above, each word pops on its own onset frame; groups hard-cut, the T2 pair's last
      // group exits in 3f (data-rc-exit-f) ending on the boundary (local 140).
      T.captionPops(tl);

      // L4 (local 0-26): one tile clears per spoken word, 3f each (power2.out), seeded order ("Why" 7, "does" 15);
      // seed 2 = tiles 5 then 6 first (row 2, columns 2-3: the two police cars).
      S.frostClear(tl, '#b01-frost', [W.Why, W.does], { seed: 2 });
      // both plates (sharp picture + frosted copy) zoom OUT 110 -> 100% across the shot (rule D alternates push-ins with
      // zoom-outs; sine.inOut), from the head handle to the cut on "every" (local 26).
      C.zoomOut(tl, '#b01-frost .rc-l4__plate', 0, { until: L(26) });

      // L3 (cut on "every", local 26): cells pop L->R, T->B, 3f apart (4f each: 96 -> 100% power3.out + fade power2.out),
      // while the whole grid punches in on the cut: 112 -> 100% over 10f, expo.out (rule D "cuts into a new shot").
      S.gridBuild(tl, '#b01-grid', L(26), { stepF: 3 });
      C.punchIn(tl, '#b01-gcam', L(26), { from: 1.12, frames: 10 });
      // On "even" (local 55): cell 6 switches to R1.2 (police truck shot) and scales to full frame over 6f, power3.out
      // (full on local 61 = beat f55, S01 `gta6_cell_full`).
      S.gridGrow(tl, '#b01-grow', L(55), { durF: 6 });
      // Held full-frame GTA 6: push 100% (local 61) -> 108% on the boundary (local 140), easeInOutSine, then held at 108%
      // through the tail handle (B2's hand-off copy continues exactly this curve: scale(m) = 1 + 0.08 sineInOut((m-61)/79)).
      C.push(tl, '#b01-grow', L(61), { until: L(140), from: 1, to: 1.08 });

      // M1 row centred on (1640, 80) (CONFLICTS C35: clears the trailer's own HUD); five stars pop 3f apart from "have"
      // (local 93, 96, 99, 102, 105; 3f power3.out each, all landed 108).
      M.starsPopIn(tl, '#b01-stars', W.have, { stepF: 3, durF: 3 });

      // "cops?" (local 125): picture key punch on the outer camera, 100 -> 106% in 3f (expo.out, from 124) and back over
      // 7f (sine.inOut), at rest again on 134 = B2's first head-handle frame (so the B1 -> B2 handles match).
      C.keyPunch(tl, '#b01-cam', W.cops, { outF: 7 });
      // X9 on "cops?" (local 125): red 35% Overlay 2f, blue 2f, gone 129 (hard frames: a cut pattern, not a move).
      X.sirenWash(tl, '#b01-x9', L(125));

      tl.set({}, {}, L(146));                         // timeline spans the whole composition
      window.__timelines["b01-hook"] = tl;
    </script>
