         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 2.1000s.
         Word timings: words.json (comp_t). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/.

         Plan p.24 (B10 build), STORYBOARD.md B10. Local frame = beat frame + 6.
         beat     local    what
         -6..0    0..6     head handle: B9's three L3 strips (R9.1 ram = SUBSTITUTE for R9.2 / R9.3 / R9.5) continue with their T4 phrases
                           (B9's closing state continued backward; continuous source time and push with b09-throughyou)
         0        6        X1 (B9 -> B10 boundary, same picture). T4 phrases fade out over 4f (local 6-10).
                           T2 lead-in "And suddenly, it's" hard cuts in on "And" (Inter SemiBold 42, centred group at y 540)
         35-41    41-48    X3 white flash centred on "fun": 0% local 41, 50% 42, 100% 43-44, 75/50/25% 45-47, 0 at 48 (silent)
         37       43       "fun" = the flash's 100% frame = S09 + the MU5 music drop (cues.json fun = 37). Hard cut under
                           the white: the strips end; from here this composition is transparent except the T2 pair and the
                           fading flash: Tesseract L1 R10.1 (GTA 1 kill frenzy, full colour +10% sat, full speed) shows under it.
                           T2 keyword "fun." (Instrument Serif Italic 140) blurs in 30 -> 0 px while scaling 108 -> 100%, 6f,
                           power3.out (lands local 49)
         53-57    59-63    T2 out: the pair fades 1 -> 0 over 4f, gone on the beat's last frame boundary (local 63)
         57..63   63..69   tail handle: transparent (closing state = Tesseract footage only) -->

      <!-- ===== T2 punch pair (plan On screen: "T2: And suddenly, it's fun." with "fun." in the serif). Lead-in hard cut on
           "And" (beat f0); keyword "fun." on "fun" (beat f37 = the flash's 100% frame); out = 4f fade ending on the beat's
           end (local 63). White + soft shadow (text on footage). Under the X3 flash, so the flash covers it. ===== -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions;
      const f = (n) => n / 30;            // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets (words.json comp_t snapped to the nearest frame, local): And 6, suddenly, 11, it's 35, fun. 43.
      const W = { And: 6, fun: 43 };
      const END_BEAT = 63;                // beat f57

      // ---------------- B9's strips, continued ----------------
      // Landed state (no pops). Their footage keeps b09's slow push (rule 7): 115% -> 115% x 1.04, linear, from each strip's
      // punch landing (b09 local 137 / 161 / 188) to the "fun" cut (b09 local 258 = this local 43). This local L = b09 local L + 215.
      const B9 = 215, FUN_B9 = 258, LAND_B9 = [137, 161, 188];
      const pushAt = (land, x) => 1.15 * (1 + 0.04 * (x - land) / (FUN_B9 - land));
      LAND_B9.forEach((land, i) => {
        const m = '#b10-s' + (i + 1) + ' .rc-l3__media';
        gsap.set(m, { scale: pushAt(land, B9), transformOrigin: '50% 50%' });
        tl.fromTo(m, { scale: pushAt(land, B9) },
          { scale: pushAt(land, B9 + W.fun), duration: f(W.fun), ease: 'none', immediateRender: false }, 0);
      });

      // ---------------- T4 phrases leave together: 4f fade from beat f0 (kit T.spreadOut) ----------------
      T.spreadOut(tl, '#b10-t4', f(W.And));

      // ---------------- X3 white flash centred on "fun": 100% on local 43 (beat f37) and 44 ----------------
      X.flash(tl, '#b10-x3', f(W.fun));

      // ---------------- T2: lead-in from "And" (clip start), keyword "fun." blur-in on "fun", 4f fade-out to the beat end ----
      T.punchPair(tl, '#b10-t2', f(W.fun), { outAt: f(END_BEAT - 4) });

      // keep the timeline as long as the composition (the tail handle is transparent)
      tl.set({}, {}, f(69));
      window.__timelines["b10-fun"] = tl;
    </script>
