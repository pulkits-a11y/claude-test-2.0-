    <!-- B10 b10-fun v03 (REVISION_v03: caption lockup, no v02 zooms; else as v02): beat 54f (1.800s) + 6f handle each end = 66f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 2.0000s (local frames 6 .. 60).
         Word timings: words.json (v02 beat map, VO 115%). Spec: ../../PRODUCTION_SPEC.md, ../../REVISION_v02.md. Plan: ../../00_Brief/.

         Plan p.24 (B10 build), STORYBOARD.md B10. Local frame = beat frame + 6.
         beat     local    what
         -6..0    0..6     head handle: B9's three L3 strips (R9.1 ram = SUBSTITUTE for R9.2 / R9.3 / R9.5) continue
                           (continuous source time and the same eased push as b09-throughyou); B9's last caption lockup
                           "They don't [let go.]" held as b09 shows it, hard cut out on local 6
         1        7        v03 caption lockup "And suddenly, | it's [fun.]*" (kit RCK.type.lockups, ref 1, centred): And 7,
         28       34       suddenly, 11, it's 34 hard-cut in; "fun." 41 pops + blurs in (full opacity on its frame, blur
                           20 -> 0 px + 92 -> 100%, 6f expo.out)
         32-40    38-46    X3 white flash centred on "fun" (kit X.flash, eased): 0 local 38, ramp easeInQuad, 100% local 41,
                           fade easeOutQuad 64/36/16/4%, 0 on 46 (silent)
         35       41       "fun" (edit frame 1231, 41.040 s) = the flash's 100% frame = S09 + the MU5 music drop
                           (cues.json fun = 35). Hard cut under the white: the strips end; from here this composition is
                           transparent except the caption lockup and the fading flash: Tesseract L1 R10.1 (GTA 1 kill frenzy, full
                           colour +10% sat, v03 framing = v01's static 100%: no punch out of the flash, note 13) shows under it.
         54       60       the lockup hard-cuts out on the beat end (local 60; v03: no exit animation)
         54..60   60..66   tail handle: transparent (Tesseract footage only) -->

           flash, as v02. Holds to the beat end (local 60), hard cut (B11 opens with X1). Generated with

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions;
      const f = (n) => n / 30;            // local frame -> seconds (local frame = beat frame + 6)

      // v02 word onsets (words.json comp_t snapped to the nearest frame, local): And 7, suddenly, 11, it's 34, fun. 41.
      const FUN = 41;                     // beat f35 = edit frame 1231: flash 100% = S09 = MU5 drop (cues.json "fun")
      const END = 66;                     // composition end

      // ---------------- B9's strips, continued ----------------
      // b09-throughyou pushes each strip's footage 115% -> 115% x 1.04 (v03 = v01's held-shot push, eased; REVISION_v03
      // note 13 removed v02's x 1.06) along ONE easeInOutSine curve from its punch
      // landing (b09 local 130 / 153 / 178) to the "fun" cut (b09 local 243 = this local 41). This composition plays the
      // rest of that curve from its local 0 (= b09 local 202): same function of the edit frame, so B9's last frame and
      // B10's first frame match.
      const B9 = 202, FUN_B9 = 243, LAND_B9 = [130, 153, 178];
      const IO = RCK.ease.fn('easeInOutSine');
      const part = (u0, u1) => (p) => (IO(u0 + (u1 - u0) * p) - IO(u0)) / (IO(u1) - IO(u0));
      const PUSH = 0.04;                  // = b09-throughyou's PUSH (v01 held-shot push x 1.04)
      const pushAt = (land, x) => 1.15 * (1 + PUSH * IO((x - land) / (FUN_B9 - land)));
      LAND_B9.forEach((land, i) => {
        const m = '#b10-s' + (i + 1) + ' .rc-l3__media', u0 = (B9 - land) / (FUN_B9 - land);
        gsap.set(m, { scale: pushAt(land, B9), transformOrigin: '50% 50%' });
        tl.fromTo(m, { scale: pushAt(land, B9) },
          { scale: pushAt(land, FUN_B9), duration: f(FUN), ease: part(u0, 1), immediateRender: false }, 0);
      });

      // ---------------- v03 caption lockups: B9's held lockup in the head handle, then the T2 lockup: plain words hard-cut
      //                  in on their frames, the starred "fun." pops + blurs in on local 41 (kit RCK.type.lockupsWire) ----
      T.lockupsWire(tl);

      // ---------------- X3 white flash centred on "fun": 100% on local 41 (beat f35) ----------------
      X.flash(tl, '#b10-x3', f(FUN));

      // keep the timeline as long as the composition (the tail handle is transparent)
      tl.set({}, {}, f(END));
      window.__timelines["b10-fun"] = tl;
    </script>
