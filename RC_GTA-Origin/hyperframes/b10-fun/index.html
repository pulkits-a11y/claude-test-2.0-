    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions;
      const f = (n) => n / 30;            // local frame -> seconds (local frame = beat frame + 6)

      // v02 word onsets (words.json comp_t snapped to the nearest frame, local): And 7, suddenly, 11, it's 34, fun. 41.
      const FUN = 41;                     // beat f35 = edit frame 1231: flash 100% = S09 = MU5 drop (cues.json "fun")
      const END = 66;                     // composition end

      // ---------------- B9's strips, continued ----------------
      // b09-throughyou pushes each strip's footage 115% -> 115% x 1.08 (v05: the grid shot runs b09 local 174 -> this 41,
      // 2.3 s, so the doc's pacing rule 3 wants >= 8%) along ONE easeInOutSine curve from its punch landing (b09 local
      // 178 / 180 / 182) to the "fun" cut (b09 local 243 = this local 41). This composition plays the rest of that curve
      // from its local 0 (= b09 local 202): same function of the edit frame, so B9's last frame and B10's first frame match.
      const B9 = 202, FUN_B9 = 243, LAND_B9 = [178, 180, 182];   // v05: b09 strips pop 174 / 176 / 178 (+4 f punch)
      const IO = RCK.ease.fn('easeInOutSine');
      const part = (u0, u1) => (p) => (IO(u0 + (u1 - u0) * p) - IO(u0)) / (IO(u1) - IO(u0));
      const PUSH = 0.08;                  // = b09-throughyou's PUSH (v05: the grid holds 2.3 s across B9/B10 -> >= 8%)
      const pushAt = (land, x) => 1.15 * (1 + PUSH * IO((x - land) / (FUN_B9 - land)));
      LAND_B9.forEach((land, i) => {
        const m = '#b10-s' + (i + 1) + ' .rc-l3__media', u0 = (B9 - land) / (FUN_B9 - land);
        gsap.set(m, { scale: pushAt(land, B9), transformOrigin: '50% 50%' });
        tl.fromTo(m, { scale: pushAt(land, B9) },
          { scale: pushAt(land, FUN_B9), duration: f(FUN), ease: part(u0, 1), immediateRender: false }, 0);
      });

      // ---------------- v03 caption lockups: B9's held lockup in the head handle, then the T2 lockup: plain words hard-cut
      //                  in on their frames, the starred "fun." pops + blurs in on local 41 (kit RCK.type.lockupsWire) ----
      T.lockupsWire(tl);

      // ---------------- v05 (doc 41.0): on "fun." (local 41): 1-frame white flash + flash-star burst behind the hero ----
      const FX = RCK.fx;
      FX.flash(tl, '#b10-flash', f(FUN));
      FX.flashStar(tl, '#b10-star', f(FUN), { size: 1000 });

      // keep the timeline as long as the composition (the tail handle is transparent)
      tl.set({}, {}, f(END));
      window.__timelines["b10-fun"] = tl;
    </script>
