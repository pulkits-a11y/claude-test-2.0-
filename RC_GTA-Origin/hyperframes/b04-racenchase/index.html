    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* B4 framing of the R4.5 title page (1700 x 2200 scan render).
         The <img> is a frame-sized element (object-fit: cover = page width 1920 px, scale 1.1294, top of the page) so the
         media treatment's vignette sits on the frame; this static wrapper zooms it to 1.4 x page px so the scanned paper
         fills the frame with no white PDF margin, and puts the boxed title centre (page 878, 307.5) on screen (960, 400).
         scale = 1.4 / (1920 / 1700) = 1.2395833, origin from (960, 400) = O + k (e - O). Static: GSAP never touches it;
         the L7 push (100% -> 118%) is on the parent .rc-l7. */
      #b04-docframe {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 1123.58px 127.27px; transform: scale(1.2395833);
      }
      #b04-hl-clip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <!-- B4 b04-racenchase: beat 108f (3.600s) + 6f handle each end = 120f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 3.8000s (local frame = beat frame + 6).
         Word timings: words.json (comp_t). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B4 p.21).

         Beat f0-44   (local 0-50, incl. head handle): L7 spotlight on the REAL R4.5 design-document title page (still,
                      44f on screen = 1.47 s < 1.5 s, CONFLICTS C16), dimmed to 35% except a rounded spotlight on the
                      title, push 100% -> 118% toward it; T9 highlight swipes across "Race'n'Chase" on "Race" (f18, 8f).
         Beat f44-108 (local 50-120, incl. tail handle): hard cut (X1) in the pause after "Chase," to the L9 / M3 calendar
                      on the gray card: 18 empty slots, 18 squares fill left to right 2f apart from f46 (18th on f80),
                      no dates; T2 above the grid: lead-in "planned to take" on "planned" (f57), keyword "18 months." on
                      "eighteen" (f81, 6f blur-in), 4f fade-out f104-108. Slow push 100% -> 104% on the card content.
         No SFX in B4 (plan p.38: silence by design). Tesseract owns all audio. -->
    <div data-hf-id="hf-yp6j" id="root" data-composition-id="b04-racenchase" data-start="0" data-duration="4.0000000" data-width="1920" data-height="1080">

      <!-- ============ L7 spotlight on the 1995 design-document title page (R4.5, real still) ============ -->
      <div data-hf-id="hf-bbw1" id="b04-l7" class="rc-l7" style="z-index: 1">
        <div data-hf-id="hf-1rj7" id="b04-docframe">
          <img data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0,&quot;contrast&quot;:0,&quot;highlights&quot;:0,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:-0.2},&quot;details&quot;:{&quot;vignette&quot;:0.12,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0.08,&quot;grainSize&quot;:0.2,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;,&quot;wheels&quot;:{&quot;shadows&quot;:{&quot;hue&quot;:35,&quot;amount&quot;:0.1,&quot;level&quot;:0.04},&quot;midtones&quot;:{&quot;hue&quot;:0,&quot;amount&quot;:0,&quot;level&quot;:0},&quot;highlights&quot;:{&quot;hue&quot;:0,&quot;amount&quot;:0,&quot;level&quot;:0}}}" data-hf-id="hf-o9g5" id="b04-doc" class="clip rc-l7__media" src="assets/footage/R4.5.png" data-start="0.0000" data-duration="1.6666" data-track-index="1" alt="Race'n'Chase Game Design, 1995 design document title page" style="--rc-pos: 50% 0%">
          <!-- T9 highlight over "Race'n'Chase" (page px 753-1004 x 263-296 + padding), in the page layer so it pushes with
               the page; multiply blend: paper turns highlighter yellow, the printed letters stay dark (= behind the text) -->
          <div data-hf-id="hf-hjze" id="b04-hl-clip" class="clip" data-start="0.0000" data-duration="1.6666" data-track-index="2" data-layout-ignore="">
            <div data-hf-id="hf-9jci" id="b04-hl" class="rc-t9-hl" style="left: 842.4px; top: 290.8px; width: 299.3px; height: 50px"></div>
          </div>
        </div>
        <!-- dim: #0A0A0A at 65% (the page shows at 35%) with a rounded, 20 px feathered hole on the boxed title
             (both title lines "Race'n'Chase / Game Design", screen px at push 100%) -->
        <div data-hf-id="hf-n5u3" id="b04-dim" class="clip rc-l7__dim" data-hole="715,296,488,212" data-radius="16" data-feather="20" data-start="0.0000" data-duration="1.6666" data-track-index="3"></div>
      </div>

      <!-- ============ L9 / M3 calendar on the gray card (hard cut at beat f44 = local 50) ============ -->
      <div data-hf-id="hf-7ix9" id="b04-card" class="clip rc-card rc-full" data-start="1.6666" data-duration="2.3334" data-track-index="4" style="z-index: 2"></div>
      <!-- untimed camera: the calendar + T2 push 100% -> 104% together (rule 7); the uniform gray ground stays still -->
      <div data-hf-id="hf-onvd" id="b04-cam" class="rc-full" style="z-index: 3">
        <!-- the M3 component; B12 reuses it with identical geometry (grid top-left 748, 520; 64 px squares, 8 px gaps,
             6 columns). No dates, month names or years on it (plan p.21 Watch out). -->
        <div data-hf-id="hf-211p" id="b04-cal" class="clip m3-cal" data-start="1.6666" data-duration="2.3334" data-track-index="5"></div>
        <!-- T2 punch pair, card ink on the gray card: lead-in on "planned", keyword "18 months." on "eighteen" -->
        <div data-hf-id="hf-a0jz" id="b04-t2" class="clip rc-t2 rc-on-card" data-start="2.1000" data-duration="1.7000" data-track-index="6" style="--rc-y: 390px">
          <div data-hf-id="hf-15le" class="rc-t2__row"><span data-hf-id="hf-8rzv" class="rc-t2__lead">planned to take</span><span data-hf-id="hf-aow4" class="rc-t2__key">18 months.</span></div>
        </div>
      </div>
    </div>

    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, M = RCK.motifs;
      const B = (n) => (n + 6) / 30;                 // beat frame -> composition seconds (6f head handle)
      // words.json comp_t (composition seconds); every helper snaps to the nearest frame
      const W = { Race: 0.813, and2: 1.737, planned: 2.097, eighteen: 2.888 };   // beat f18, f46, f57, f81

      // L7 push toward the title: 100% on beat f0 -> 118% on the cut (beat f44), linear, about the hole centre.
      // Head handle (beat f-6..f-1) holds the opening state (100%): the push may never go below 100%, or the 1920 x 1080
      // dim layer (scaled with the page) would stop covering the frame edges (seen at 97.5% in review).
      S.spotPush(tl, '#b04-l7', B(0), { until: B(44), from: 1, to: 1.18 });
      // T9: highlight swipes left to right over 8f, ease out, on "Race" (beat f18)
      T.highlight(tl, '#b04-hl', W.Race);

      // L9 / M3: 18 empty slots appear with the card (f44), squares fill 2f apart from "and" (f46) -> 18th on f80
      M.calendarFill(tl, '#b04-cal', B(46), { slots: 18, filled: 0 });
      // T2: lead-in hard cut = clip start (f57 "planned"); keyword 6f blur-in on "eighteen" (f81); out = 4f fade f104-108
      T.punchPair(tl, '#b04-t2', W.eighteen, { outAt: B(104) });
      // rule 7 push on the card content: 100% at the cut (f44) -> 104% at the beat end (f108), same rate into the tail handle
      S.push(tl, '#b04-cam', B(44), { until: 120 / 30, from: 1, to: 1 + (0.04 * 70) / 64, origin: '960px 540px' });

      tl.to({}, { duration: 4.0 }, 0);
      window.__timelines["b04-racenchase"] = tl;
    </script>
  </body>
</html>
