    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* B4 framing of the R4.5 title page (1700 x 2200 scan render).
         The <img> is a frame-sized element (object-fit: cover = page width 1920 px, scale 1.1294, top of the page) so the
         media treatment's vignette sits on the frame; this static wrapper zooms it to 1.4 x page px so the scanned paper
         fills the frame with no white PDF margin, and puts the boxed title centre (page 878, 307.5) on screen (960, 400).
         scale = 1.4 / (1920 / 1700) = 1.2395833, origin from (960, 400) = O + k (e - O). Static: GSAP never touches it;
         the L7 push (100% -> 118%) is on the parent .rc-l7. */
      #b04-docframe {
        position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
        transform-origin: 1123.58px 127.27px; transform: scale(1.2395833);
      }
      #b04-hl-clip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    </style>

    <!-- B4 b04-racenchase v02: beat 100f (3.333s) + 6f handle each end = 112f (REVISION_v02: VO 115%, rules A C D E).
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 3.5333s (local frame = beat frame + 6).
         Word timings: words.json (comp_t, v02). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B4 p.21).

         Local 0-46   (incl. head handle): L7 spotlight on the REAL R4.5 design-document title page (still, beat f0-40 on
                      screen = 1.33 s < 1.5 s, CONFLICTS C16), dimmed to 35% except a rounded spotlight on the title, push
                      100% -> 118% toward it (local 6 -> 46, easeInOutSine); T9 highlight swipes across "Race'n'Chase" on
                      "Race" (local 23, 8f power3.out).
         Local 46-112 (incl. tail handle): hard cut (X1) in the pause after "Chase," to the L9 / M3 calendar on the gray card:
                      the calendar punches in on the cut (112 -> 100%, 10f expo.out) then pushes 100 -> 106% (sine.inOut);
                      18 empty slots, 18 squares fill left to right 2f apart from local 47 (18th on 81 = "eighteen"), no dates;
                      a key punch on "eighteen" (106%, 3f in / 9f out). T2 above the grid, word by word (rule A), steady
                      (outside the camera): "planned" (59) / "to take" (70, 76) / keyword "18 months." (81, 88: blur punch),
                      last group exits in 3f (power2.in) ending on the beat end (106).
         No SFX in B4 (plan p.38: silence by design). Tesseract owns all audio. -->
    <div data-hf-id="hf-yp6j" id="root" data-composition-id="b04-racenchase" data-start="0" data-duration="3.7333333" data-width="1920" data-height="1080">

      <!-- ============ L7 spotlight on the 1995 design-document title page (R4.5, real still) ============ -->
      <div data-hf-id="hf-bbw1" id="b04-l7" class="rc-l7" style="z-index: 1">
        <div data-hf-id="hf-1rj7" id="b04-docframe">

t&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;,&quot;wheels&quot;:{&quot;shadows&quot;:{&quot;hue&quot;:35,&quot;amount&quot;:0.1,&quot;level&quot;:0.04},&quot;midtones&quot;:{&quot;hue&quot;:0,&quot;amount&quot;:0,&quot;level&quot;:0},&quot;highlights&quot;:{&quot;hue&quot;:0,&quot;amount&quot;:0,&quot;level&quot;:0}}}" data-hf-id="hf-o9g5" id="b04-doc" class="clip rc-l7__media" src="assets/footage/R4.5.png" data-start="0.0000" data-duration="1.5333" data-track-index="1" alt="Race'n'Chase Game Design, 1995 design document title page" style="--rc-pos: 50% 0%">
          <!-- T9 highlight over "Race'n'Chase" (page px 753-1004 x 263-296 + padding), in the page layer so it pushes with

          <div data-hf-id="hf-hjze" id="b04-hl-clip" class="clip" data-start="0.0000" data-duration="1.5333" data-track-index="2" data-layout-ignore="">

          </div>
        </div>
        <!-- dim: #0A0A0A at 65% (the page shows at 35%) with a rounded, 20 px feathered hole on the boxed title
             (both title lines "Race'n'Chase / Game Design", screen px at push 100%) -->

      <!-- ============ L9 / M3 calendar on the gray card (hard cut at local 46 = beat f40) ============ -->
      <div data-hf-id="hf-7ix9" id="b04-card" class="clip rc-card rc-full" data-start="1.5333" data-duration="2.2000" data-track-index="4" style="z-index: 2"></div>
      <!-- untimed camera (rule D): the calendar punches in on the cut, then pushes 100% -> 106%; #b04-key (nested) = the key
           punch on "eighteen". The uniform gray ground stays still; the T2 caption is outside the camera (steady). -->
      <div data-hf-id="hf-onvd" id="b04-cam" class="rc-full" style="z-index: 3"><div id="b04-key" class="rc-full">
        <!-- the M3 component; B12 reuses it with identical geometry (grid top-left 748, 520; 64 px squares, 8 px gaps,
             6 columns). No dates, month names or years on it (plan p.21 Watch out). -->
        <div data-hf-id="hf-211p" id="b04-cal" class="clip m3-cal" data-start="1.5333" data-duration="2.2000" data-track-index="5"></div>
      </div></div>

      <!-- ============ T2 above the grid, word by word (rule A; card ink on the gray card, --rc-y 390 as v01): groups from
           RCK.type.captionPlanV2 ('planned to take 18 months.', loose: "18" is the spoken "eighteen"; key: 2 = "18 months."
           is the keyword); lead words pop (5f expo.out), keyword words blur-punch (30 -> 0 px, 108 -> 100%, 6f expo.out) on
           their onsets; the last group exits in 3f (power2.in) ending on the beat end (106). ============ -->
      <div id="b04-t2-1" class="clip rc-t2 rc-cap rc-on-card" data-start="1.9666" data-duration="0.3667" data-track-index="6" style="--rc-y: 390px; z-index: 4"><div class="rc-t2__row rc-g"><span class="rc-t2__lead"><span class="rc-w" data-rc-f="59">planned</span></span></div></div>
      <div id="b04-t2-2" class="clip rc-t2 rc-cap rc-on-card" data-start="2.3333" data-duration="0.3667" data-track-index="6" style="--rc-y: 390px; z-index: 4"><div class="rc-t2__row rc-g"><span class="rc-t2__lead"><span class="rc-w" data-rc-f="70">to</span> <span class="rc-w" data-rc-f="76">take</span></span></div></div>
      <div id="b04-t2-3" class="clip rc-t2 rc-cap rc-on-card" data-start="2.7000" data-duration="0.8333" data-track-index="6" data-rc-exit-f="3" style="--rc-y: 390px; z-index: 4"><div class="rc-t2__row rc-g"><span class="rc-t2__key"><span class="rc-w rc-w--key" data-rc-f="81">18</span> <span class="rc-w rc-w--key" data-rc-f="88">months.</span></span></div></div>

    <script src="assets/kit/type.js"></script>

    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, M = RCK.motifs, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // words.json comp_t (v02); every helper snaps to the nearest frame
      const W = { Race: 0.75, eighteen: 2.699 };     // local 23 (22.5 rounds up), 81

      // T2 groups (rule A): every .rc-cap pops word by word on its onset; the last group exits 103-106 (eased)
      T.captionPops(tl);

      // L7 push toward the title: 100% on the beat's first frame (local 6) -> 118% on the cut (local 46), easeInOutSine,
      // about the hole centre. Head handle (local 0-5) holds the opening state (100%): the push may never go below 100%, or
      // the 1920 x 1080 dim layer (scaled with the page) would stop covering the frame edges (seen at 97.5% in v01 review).
      S.spotPush(tl, '#b04-l7', L(6), { until: L(46), from: 1, to: 1.18 });
      // T9: highlight swipes left to right over 8f, power3.out (easeOutQuart), on "Race"
      T.highlight(tl, '#b04-hl', W.Race);

      // L9 / M3: 18 empty slots appear with the card (cut, local 46), squares fill 2f apart from local 47 -> the 18th on 81,
      // the frame "eighteen" is spoken (hard fills: one state per frame, a cut pattern)
      M.calendarFill(tl, '#b04-cal', L(47), { slots: 18, filled: 0 });
      // camera (rule D): punch-in on the cut 112 -> 100% (10f easeOutExpo), then push 100 -> 106% to the beat end
      // (easeInOutSine), held through the tail handle; key punch on "eighteen" about the grid centre (960, 624) on the
      // nested wrapper: 100 -> 106% in 3f (expo.out, from 80), back over 9f (sine.inOut).
      C.punchIn(tl, '#b04-cam', L(46), { from: 1.12, frames: 10 });
      C.push(tl, '#b04-cam', L(56), { until: L(106), from: 1, to: 1.06 });
      C.keyPunch(tl, '#b04-key', W.eighteen, { origin: '960px 624px' });

      tl.set({}, {}, L(112));                         // timeline spans the whole composition
      window.__timelines["b04-racenchase"] = tl;
    </script>
