    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0E0E10; }

      /* ---- the page (local 0-46): 05_GFX/shared/racenchase_title_page_dark_v05.jpg (the dark inverted page on a dark
         textured ground, 2097 x 3072 page px; prep/race_page.py), shown at S = 1.5 with page point (1093, 540) (between
         the title and the date) on the frame centre, tilted -4 deg about the frame centre (static), pushed 100 -> 115% by
         #b04-page-cam (GSAP). The page covers the frame at every scale (top-left frame corner = page (480, 136), inside
         the sheet). On screen at 100%: title ~45 px cap / 527 px wide, the date ~40 px, the copyright at the bottom edge. */
      #b04-page-tilt { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: rotate(-4deg); transform-origin: 960px 540px; }
      #b04-page { position: absolute; left: 0; top: 0; width: 2097px; height: 3072px; transform-origin: 0 0; transform: translate(-679.5px, -270px) scale(1.5); }
      #b04-page-img { position: absolute; left: 0; top: 0; width: 2097px; height: 3072px; }
      /* "It's called" (tier A, Coolvetica Regular, white + soft shadow) printed above the title box, left-aligned to
         "Race'n'Chase" (page x 918), baseline 10 page px above the box line (y 348). 36 page px = 54 px on screen. */
      #b04-lk-called { position: absolute; left: 918px; top: 306.8px; width: 700px; height: 36px; color: #FFFFFF;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.45); }
      #b04-lk-called .rc-lk__row { font-size: 36px; line-height: 36px; height: 36px; }
      /* TODO kit v05 placeholders, page px (they push and tilt with the page) */
      #b04-hl { position: absolute; left: 900px; top: 360px; width: 388px; height: 66px; }       /* "Race'n'Chase" 918-1269 x 369-417 */
      #b04-circ { position: absolute; left: 925px; top: 648px; width: 337px; height: 106px; }   /* "March 22, 1995" 975-1212 x 687-714 */

      /* ---- the grid (local 46-112): near-black + the 1990s DMA office blurred ~45 px at 25% behind the 18 cells; two
         office angles with a hard cut at 70 (doc 19.0). Each office video is laid out at 1/4 size (480 x 270) and scaled
         x 4.2 by its static wrapper (media-treatment blur at max: it works in source px, ~30 px on screen). Provisional for the kit
         v05 dark card (#0E0E10 + grain + blurred footage). */
      #b04-bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #0E0E10; }
      .b04-off-wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0.25; }
      .b04-off-scale { position: absolute; left: 720px; top: 405px; width: 480px; height: 270px; transform: scale(4.2); transform-origin: 50% 50%; }
      .b04-off { position: absolute; left: 0; top: 0; width: 480px; height: 270px; object-fit: cover; }
      /* the caption block around the grid (Coolvetica, U1): setup line above, "18" (Coolvetica Italic 330 px) left of the
         grid, "months." (tier B 190 px) under the grid's right edge; block ink x 549-1371, centred. */
      .b04-free { display: block; }
      #b04-setup { position: absolute; left: 549px; top: 297px; height: 60px; }
      #b04-setup.rc-lk__row { font-size: 60px; line-height: 60px; }
      /* line box tightened to the glyph (236 px, baseline still at 609 = the grid bottom - 4): the 330 px box overlapped the
         setup line's box (check content_overlap); Coolvetica: baseline = top + (lh - 1.2 em) / 2 + 0.967 em */
      #b04-18 { position: absolute; left: 549px; top: 369.9px; height: 236px; }
      #b04-18.rc-lk__row { font-size: 330px; line-height: 236px; }
      #b04-months { position: absolute; right: 559px; top: 606.3px; height: 190px; }
      #b04-months.rc-lk__row { font-size: 190px; line-height: 190px; }

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)

      // ---- captions (U2): every word appears on its own frame (hard cut, white); "18" (rc-lw--pop) pops + blurs in
      T.lockupsWire(tl, '#b04-lk-called, #b04-lk-grid');

      // ---- the page: push 100 -> 115% (doc 17.0-18.0), sine.inOut, from the beat start to the cut; head handle at 100%.
      C.push(tl, '#b04-page-cam', L(6), { until: L(46), from: 1.0, to: 1.15 });

      // ---- the grid: 18 cells, one every 2f from 47 -> the 18th on 81 ("eighteen"), hard fills (kit M3 calendar)
      M.calendarFill(tl, '#b04-cal', L(47), { slots: 18, filled: 0, max: 18, cols: 6, sq: 72, gap: 9, x: 894, y: 379 });
      // (the hard cut at 70 is the clip boundary between #b04-offA and #b04-offB; no camera move, U3)

      tl.set({}, {}, L(112));
      window.__timelines["b04-racenchase"] = tl;
    </script>
