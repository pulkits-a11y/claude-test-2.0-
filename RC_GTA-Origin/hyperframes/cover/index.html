    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink-black, #0A0A0A); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* same push-in wrapper as b05/b06/b11 (the L11 frame never moves; the picture inside each half is pushed) */
      .lc-push { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .lc-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
      /* T2 style (kit .rc-t2: lead-in Inter SemiBold 42 px + keyword Instrument Serif Italic 140 px, baselines aligned,
         14 px gap, centred as a group), scaled 1.6x as a whole so the line reads at thumbnail size (cover choice). */
      #cover-t2 { transform: scale(1.6); transform-origin: 50% 50%; }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const M = RCK.motifs;
      // b11-flip back-side push-in at local 170: 100% on local 34 -> 104% on local 168, linear.
      tl.set('#cover-split .lc-push', { scale: 1 + 0.04 * (170 - 34) / (168 - 34), transformOrigin: '50% 50%' }, 0);
      // the B11 arrow (same seed and geometry as b11-flip), already drawn
      M.arrowInit('#cover-arrow', { from: [175, 800], to: [335, 520], bend: 0.16, seed: 7, label: 'you', drawn: true });
      tl.set({}, {}, 0.9);
      window.__timelines["cover"] = tl;
