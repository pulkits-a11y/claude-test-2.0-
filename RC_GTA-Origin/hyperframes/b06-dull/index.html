      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* Camera wrapper inside each 958 px half (as in b05-copgame / b11-flip): the L11 frame never moves; only the picture
         inside each half moves (v03: b05's slow eased 100 -> 104% push, continued to the cut to the card). */
      .lc-push { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .lc-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
      /* v04: Gary Penn full frame (16:9 working clip, never stretched) inside the camera wrapper */
      .b06-fill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      /* v04 lower third: bottom left inside title-safe (96 px in, last baseline about 970 px), white + the kit's glow, on a
         soft dark plate (a feathered gradient from the bottom-left corner, part of the lower third graphic) so the small
         role line reads on the bright shirt */
      .b06-l3plate { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none;
                     background: radial-gradient(ellipse 980px 360px at 0px 1080px, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.5) 45%, rgba(0, 0, 0, 0) 100%); }
      .b06-l3 { position: absolute; left: var(--safe-x); top: 864px; width: 900px; height: 130px; color: var(--white);
                text-shadow: var(--text-glow); pointer-events: none; }
      .b06-l3__name { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 52px; line-height: 60px; white-space: nowrap; }
      .b06-l3__role { margin-top: 6px; font-family: var(--sans); font-weight: 400; font-size: 28px; line-height: 34px;
                      letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.75; white-space: nowrap; }

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: But 6, there's 9, a 17, problem: 19, it's 38, dull. 46, One 64,
      // developer 68, later 85, calls 93, it 108, "awful... 112, too 129, sim-y." 135 (voice ends 155).

      // ---- split-screen camera, v03 (note 13: the v02 zoom-out is gone, back to v01's camera): b05-copgame's ONE slow push
      //      100 -> 104% (easeInOutSine) on the EDIT clock, from B5 local 0 (edit 600) to the cut to the card on "One" (this
      //      local 64 = edit 747), 147 frames: scale = 1 + 0.04 * sine.inOut(k / 147), k = B5 local frame = this local + 83.
      //      This composition plays curve frames 83..147 (segment of the same ease, not restarted), so the B5/B6 cut (B5
      //      local 89 = this local 6) is seamless; the push lands on 104% on the cut to the card. ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const SPAN = 147, PUSH = 0.04, K0 = 83;          // curve length, push amount, curve frame of this local 0
      C.push(tl, '#b06-split .lc-push', 0, { until: f(64), from: 1 + PUSH * SIN(K0 / SPAN), to: 1 + PUSH, ease: seg(K0 / SPAN, 1) });

      // On "dull." (local 46): drain to black and white over 6f, easeInOutCubic (the rate lanes in the HTML slow both halves
      // to 50% over the same 6f on the same curve). The LUT's own intensity (not the whole treatment's) is tweened: frame 46 =
      // colour (+ contrast), 52 = black and white (+ contrast).
      const drainVids = document.querySelectorAll('#b06-split .rc-l11__face--front video');
      tl.fromTo(drainVids, { '--hf-color-grading-lut-intensity': 0 },
        { '--hf-color-grading-lut-intensity': 1, duration: 6 / 30, ease: 'power2.inOut', immediateRender: false }, f(46));

      // ---- v04: Gary Penn full frame from the cut on "One" (64): one slow push 100 -> 104% (easeInOutSine) to the end of
      //      the tail handle (168), the held-shot camera (no punch, no zoom-out). ----
      C.push(tl, '#b06-cam', f(64), { until: f(168), from: 1, to: 1.04 });

      // caption lockups (every .rc-lk above): plain words hard-cut in on their spoken frame; starred words pop + blur in
      // (kit POP3): "dull." on 46 with the drain (v03), and the v04 quote lockup's three words on 112, 129, 135.
      T.lockupsWire(tl);

      window.__timelines["b06-dull"] = tl;
    </script>
