    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: But 6, there's 9, a 18, problem: 19, it's 40, dull. 49, One 67,
      // developer 72, later 90, calls 99, it 114, "awful... 118, too 137, sim-y." 143 (voice ends 164).

      // Split screen push-in: the same continuous move as b05-copgame (edit clock: 100% at B5 local 0 -> 104% at this
      // beat's X2 cut, 155 frames). B6 local m = B5 local 88 + m, so B6 starts at 1 + 0.04 * 88/155 and lands on 104% at 67.
      const PUSH_SPAN_F = 155;
      S.push(tl, '#b06-split .lc-push', 0, { until: f(67), from: 1 + 0.04 * 88 / PUSH_SPAN_F, to: 1.04 });

      // On "dull." (local 49): drain to black and white over 6f (linear; the rate lanes in the HTML slow both halves to 50%
      // over the same 6f).
      // LOCAL FIX (lane C, reported): RCK.screens.splitDrain tweens --hf-color-grading-intensity 0 -> 1, which scales the
      // WHOLE treatment, so the B5 game grade (contrast) would be missing at intensity 0 and the B5 -> B6 cut would jump
      // (measured on 0.9.52: intensity 0 == ungraded). Same timing and linear ramp as splitDrain, but on the LUT's own
      // intensity: frame 49 = colour (+ contrast), 55 = black and white (+ contrast).
      const drainVids = document.querySelectorAll('#b06-split .rc-l11__face--front video');
      tl.fromTo(drainVids, { '--hf-color-grading-lut-intensity': 0 },
        { '--hf-color-grading-lut-intensity': 1, duration: 6 / 30, ease: 'none', immediateRender: false }, f(49));

      // T2: keyword blur-in on "dull." (49); the pair fades out over 4f ending on the X2 cut (63 -> 67).
      T.punchPair(tl, '#b06-t2', f(49), { outAt: f(63) });

      // X2 into the L5 card on "One" (67): slide 60 px right -> left over 20f, power3.out (lands at 87).
      X.drift(tl, '#b06-x2', f(67), { px: 60, dir: 'left', frames: 20 });

      // Held-shot push-in on the card (plan rule 7): 100% at the cut (67) -> 104% at the beat end (172), same rate into
      // the tail handle (178).
      S.push(tl, '#b06-push', f(67), { until: f(178), from: 1, to: 1 + 0.04 * (178 - 67) / (172 - 67) });

      // L5 prop: -4 deg tilt (data-rot), floats +/-6 px over 2 s from the cut to the end.
      S.propFloat(tl, '#b06-p1', f(67), { until: f(178) });

      // T8: name + role fade in over 6f on "One" (67 -> 73); the quote types on at 2 characters per frame from
      // "awful" (118): 19 characters, last one on 127; then holds to the end (the deliberate B6 quote hold).
      T.nameIn(tl, '#b06-t8', f(67));
      T.quoteType(tl, '#b06-t8', f(118), { perFrame: 2 });

      window.__timelines["b06-dull"] = tl;
    </script>
