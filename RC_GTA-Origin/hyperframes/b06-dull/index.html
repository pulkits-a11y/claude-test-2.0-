    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions, C = RCK.cam, FX = RCK.fx;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: But 6, there's 9, a 17, problem: 19, it's 38, dull. 46, One 64,
      // developer 68, later 85, calls 93, it 108, "awful... 112, too 129, sim-y." 135 (voice ends 155).

      // ---- split-screen camera: b05-copgame's ONE slow push (easeInOutSine) across the whole split shot, from B5 local 0 to
      //      the cut on "One" (this local 64), 147 frames: scale = 1 + 0.08 * sine.inOut(k / 147), k = B5 local = this local
      //      + 83. v05: 100 -> 108% (was 104%): the split is one 4.7 s shot, and the doc's pacing rule 3 asks a hold over
      //      2.0 s for a push of at least 8% (REVISION_v05 G10).
      //      This composition plays curve frames 83..147 (segment of the same ease, not restarted), so the B5/B6 cut (B5
      //      local 89 = this local 6) is seamless; the push lands on 104% on the cut to the card. ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const SPAN = 147, PUSH = 0.08, K0 = 83;          // curve length, push amount (v05: 8%, doc pacing rule 3), curve frame of this local 0
      C.push(tl, '#b06-split .lc-push', 0, { until: f(64), from: 1 + PUSH * SIN(K0 / SPAN), to: 1 + PUSH, ease: seg(K0 / SPAN, 1) });

      // On "dull." (local 46): drain to black and white over 6f, easeInOutCubic (the rate lanes in the HTML slow both halves
      // to 50% over the same 6f on the same curve). The LUT's own intensity (not the whole treatment's) is tweened: frame 46 =
      // colour (+ contrast), 52 = black and white (+ contrast).
      const drainVids = document.querySelectorAll('#b06-split .rc-l11__face--front video');
      tl.fromTo(drainVids, { '--hf-color-grading-lut-intensity': 0 },
        { '--hf-color-grading-lut-intensity': 1, duration: 6 / 30, ease: 'power2.inOut', immediateRender: false }, f(46));

      // ---- Gary Penn full frame from the cut on "One" (64). v05 (doc 25.0): one slow push 100 -> 112% (easeInOutSine)
      //      across the whole hold, to the end of the tail handle (168). ----
      C.push(tl, '#b06-cam', f(64), { until: f(168), from: 1, to: 1.12 });

      // ---- v05 [DEPTH] (doc 25.2): the giant pink quote mark fades in behind his shoulder: 0 -> 25% over 8f (easeOutCubic)
      //      from local 73; the cut-out of him (on top, same frames and grade) hides its left half. ----
      tl.fromTo('#b06-qmark-g', { opacity: 0 }, { opacity: 0.25, duration: 8 / 30, ease: 'power2.out', immediateRender: false }, f(73));

      // ---- v05 name pill (doc 25.1): the box wipes in from the left over 6f from the cut on "One" (64), both lines appear
      //      whole on 70 (kit RCK.fx.pill; no type-on, U2) ----
      FX.pill(tl, '#b06-name', f(64));

      // ---- v05 caption lockups (every .rc-lk above): plain words appear on their spoken frame; the quote words pop + blur in
      //      (kit v05 pop, white) on 112, 129, 135; "dull." has no animation (the gag) ----
      T.lockupsWire(tl);

      window.__timelines["b06-dull"] = tl;
    </script>
