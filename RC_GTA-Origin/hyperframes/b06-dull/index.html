      <div data-hf-id="hf-9oli" id="b06-cap-2" class="clip rc-t1 rc-cap" data-start="0.5666" data-duration="0.7000" data-track-index="10" style="z-index: 30"><span data-hf-id="hf-7p6c" class="rc-g"><span data-hf-id="hf-s7c9" class="rc-w" data-rc-f="17">a</span> <span data-hf-id="hf-72hn" class="rc-w" data-rc-f="19">problem:</span></span></div>

      <!-- T2 punch pair (plan p.11, B6 p.22 "T2: it's dull."), v02 markup (captionHTMLV2 style t2): lead-in "it's" pops on
           "it's" (local 38), keyword "dull." (Coolvetica Italic) 6f blur punch 30 -> 0 px + 108 -> 100% (easeOutExpo) on
           "dull." (local 46); the pair exits over 3f (easeInCubic) ending on the X2 cut (local 64). White + soft shadow. -->
      <div data-hf-id="hf-d5hi" id="b06-t2-1" class="clip rc-t2 rc-cap" data-start="1.2666" data-duration="0.8667" data-track-index="11" data-rc-exit-f="3" style="z-index: 31"><div data-hf-id="hf-ig0j" class="rc-t2__row rc-g"><span data-hf-id="hf-s6a7" class="rc-t2__lead"><span data-hf-id="hf-n95o" class="rc-w" data-rc-f="38">it's</span></span><span data-hf-id="hf-f0uu" class="rc-t2__key"><span data-hf-id="hf-7th7" class="rc-w rc-w--key" data-rc-f="46">dull.</span></span></div></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: But 6, there's 9, a 17, problem: 19, it's 38, dull. 46, One 64,
      // developer 68, later 85, calls 93, it 108, "awful... 112, too 129, sim-y." 135 (voice ends 155).

      // ---- split-screen camera, shared with b05-copgame on the EDIT clock (B6 local L = edit 683 + L): b05's move 1 (push
      //      100 -> 108%, easeInOutSine, B5 local 0-89) ends at rest on the cut (this beat's local 6); move 2 = zoom-out
      //      108 -> 100% (easeInOutSine) from the cut to the X2 cut on "One" (local 64). The head handle (local 0-6) plays
      //      move 1's last 6 frames on the same curve (segment of the same ease), so the cut matches b05 exactly.
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      C.push(tl, '#b06-split .lc-push', f(0), { until: f(6), from: 1 + 0.08 * SIN(83 / 89), to: 1.08, ease: seg(83 / 89, 1) });
      C.zoomOut(tl, '#b06-split .lc-push', f(6), { until: f(64), from: 1.08, to: 1.0 });

      // On "dull." (local 46): drain to black and white over 6f, easeInOutCubic (the rate lanes in the HTML slow both halves
      // to 50% over the same 6f on the same curve). The LUT's own intensity (not the whole treatment's) is tweened: frame 46 =
      // colour (+ contrast), 52 = black and white (+ contrast).
      const drainVids = document.querySelectorAll('#b06-split .rc-l11__face--front video');
      tl.fromTo(drainVids, { '--hf-color-grading-lut-intensity': 0 },
        { '--hf-color-grading-lut-intensity': 1, duration: 6 / 30, ease: 'power2.inOut', immediateRender: false }, f(46));

      // X2 into the L5 card on "One" (64): slide 60 px right -> left over 20f, easeOutQuart (lands at 84).
      X.drift(tl, '#b06-x2', f(64), { px: 60, dir: 'left', frames: 20 });

      // Held-shot push on the card (rule D): 100% at the cut (64) -> 108% at the end of the tail handle (168), easeInOutSine.
      C.push(tl, '#b06-push', f(64), { until: f(168), from: 1, to: 1.08 });

      // L5 prop: -4 deg tilt (data-rot), floats +/-6 px over 2 s legs (easeInOutSine) from the cut to the end.
      S.propFloat(tl, '#b06-p1', f(64), { until: f(168) });

      // T8: name + role fade in over 6f on "One" (64 -> 70, easeOutCubic); the quote types on from "awful" (112): 18
      // characters over 8f with eased (power1.out) timing, last one on 120; then holds to the end (the deliberate quote hold).
      T.nameIn(tl, '#b06-t8', f(64));
      T.quoteType(tl, '#b06-t8', f(112));

      // T1 / T2 word pops (every .rc-cap above): each word on its onset frame, max 2 words on screen; T2 keyword blur punch.
      T.captionPops(tl);

      window.__timelines["b06-dull"] = tl;
    </script>
