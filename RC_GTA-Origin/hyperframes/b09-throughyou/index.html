    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens;
      const f = (n) => n / 30;            // local frame -> seconds (local frame = beat frame + 6)

      // v02 word onsets (words.json comp_t snapped to the nearest frame, local): The 7, police 11, cars 21, stop 27,
      // following 34, you 53, and 55, start 59, trying 67, to 75, drive 78, straight 86, through 101, you. 108,
      // They 126, ram. 134, They 149, chase. 155, They 174, don't 181, let 191, go. 197.
      const POP = [174, 176, 178];        // v05: all three strips on "They don't let go." (They 174), 2 f apart, over the
                                          // Tesseract chase shot (no black while they land); ground from 182
      const END = 214;                    // composition end (tail handle end)
      const FUN = 243;                    // B10 "fun" cut (b10-fun local 41) on this clock (b09 local = b10 local + 202)

      // v03 caption lockups (T1 + T4 markup above): plain words hard-cut in on their data-rc-f frame, the starred word
      // ("straight") pops + blurs in (kit RCK.type.lockupsWire; REVISION_v03 note 11).
      T.lockupsWire(tl);

      // ---------------- L3 three vertical strips (v05: all on "They don't let go.", 2 f apart) ----------------
      // Plan: "a 4f punch-in to 115%": kit gridPop = 4f pop (opacity power2.out,
      // 96 -> 100% power3.out) + the media punching 100 -> 115% over 4f (power3.out).
      // v04 (REVISION_v04 #12 "can add that glow flash for each rectangle"): each strip pops in with the kit's glow flash on
      // the same frame (white bloom + inner edge glow + outer glow on the gutter, 2f in / 6f out, power2.out; kit defaults).
      POP.forEach((t, i) => {
        S.gridPop(tl, '#b09-s' + (i + 1), f(t), { punch: 1.15 });
        S.glowFlash(tl, '#b09-s' + (i + 1), f(t));
      });

      // Held shot: after its punch lands (the plan's own 4f punch-in to 115%), each strip's footage keeps pushing in,
      // 115% -> 115% x 1.08 (v05, doc pacing rule 3 for a hold over 2 s; v03-v04 x 1.04), ONE
      // easeInOutSine curve from the landing to the "fun" cut in b10-fun (B10 f35 = this local 243). This composition
      // plays the head of that curve up to its end (ease = exactly that part of easeInOutSine), b10-fun plays the rest,
      // so the move is continuous across the B9/B10 boundary.
      const IO = RCK.ease.fn('easeInOutSine');
      const part = (u0, u1) => (p) => (IO(u0 + (u1 - u0) * p) - IO(u0)) / (IO(u1) - IO(u0));
      const PUSH = 0.08;                  // v05: the grid holds 174 -> b10-fun 41 = 2.3 s, doc pacing rule 3 >= 8%; = b10-fun's PUSH
      const pushAt = (land, x) => 1.15 * (1 + PUSH * IO((x - land) / (FUN - land)));
      POP.forEach((t, i) => {
        const land = t + 4, u1 = (END - land) / (FUN - land);
        tl.fromTo('#b09-s' + (i + 1) + ' .rc-l3__media', { scale: 1.15 },
          { scale: pushAt(land, END), duration: f(END - land), ease: part(0, u1), immediateRender: false }, f(land));
      });

      window.__timelines["b09-throughyou"] = tl;
    </script>
  </body>
