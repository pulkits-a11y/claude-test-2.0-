    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, M = RCK.motifs;
      const f = (n) => n / 30;            // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets (words.json comp_t snapped to the nearest frame, local): The 6, police 11, cars 21, stop 28,
      // following 35, you 55, and 58, start 62, trying 71, to 79, drive 83, straight 90, through 106, you. 114,
      // They 133, ram. 142, They 157, chase. 164, They 184, don't 191, let 202, go. 208.
      const W = { stop: 28, straight: 90, ram: 133, chase: 157, letgo: 184 };
      const CUT_L3 = W.ram;               // beat f127: X1 to the L3 strips
      const END = 227;                     // composition end (tail handle end)

      // ---------------- Path diagram over the Tesseract L1 shot (beat f0-127) ----------------
      // Push 100 -> 104% across the L1 shot exactly like Tesseract's (beat f0 = 100%, beat f127 = 104%, linear, centre
      // anchor); the head handle continues the same line backward (local 0 = 99.811%).
      const P0 = 1 - 0.04 * 6 / 127;
      S.push(tl, '#b09-diagram', f(0), { until: f(CUT_L3), from: P0, to: 1.04 });
      // Track: the dot rides the player's car (purple Beast GTS) in the Tesseract L1 shot. Car centre measured by template
      // matching on R9.1 (crop 736:414:59:40 scaled to 1920 x 1080), source time -> (x, y); mapped through the L1 base scale
      // 105% about the frame centre (the push is shared: #b09-diagram is pushed like the shot). Beat f0 = source 313.9 s.
      const TRACK = [[313.70,1250,578],[314.0,1260,580],[314.2,1248,584],[314.4,1208,560],[314.6,1112,496],[314.8,1016,452],
        [315.0,920,440],[315.2,912,452],[315.6,904,456],[316.0,900,456],[316.2,928,472],[316.5,928,484],[316.8,960,508],
        [317.0,968,532],[317.9,968,532],[318.0,964,540],[318.14,968,528]];
      const SRC0 = 313.9;                                                  // source time at beat f0 (local 6)
      for (let k = 0; k <= CUT_L3; k++) {
        const t = SRC0 + (k - 6) / 30;
        let j = 0; while (j < TRACK.length - 2 && TRACK[j + 1][0] <= t) j++;
        const a = TRACK[j], b = TRACK[j + 1], u = Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0])));
        const x = a[1] + (b[1] - a[1]) * u, y = a[2] + (b[2] - a[2]) * u;
        const X = 960 + 1.05 * (x - 960), Y = 540 + 1.05 * (y - 540);
        tl.set('#b09-track', { x: Number((X - 960).toFixed(2)), y: Number((Y - 540).toFixed(2)) }, k === 0 ? 0 : f(k) - 1e-4);
      }


      // Dotted yellow "normal chase path": draws from S to the dot from "stop" over 24f (linear: the steady path the
      // cops follow), done local 52 (beat f46), before "you" (beat f49).
      tl.fromTo('#b09-path-reveal', { attr: { 'stroke-dashoffset': 100 } },
        { attr: { 'stroke-dashoffset': 0 }, duration: f(24), ease: 'none', immediateRender: false }, f(W.stop));

      // Red arrow on "straight": invisible until local 90, then the line grows S -> E and the head rides its tip over 8f,
      // power3.out (the plan's "ease out"). Line and head use the same ease and duration, so the head stays on the tip.
      gsap.set('#b09-arrow', { opacity: 0 });
      S.hard(tl, '#b09-arrow', { opacity: 0 }, { opacity: 1 }, f(W.straight));
      tl.fromTo('#b09-arrow-line', { attr: { 'stroke-dashoffset': 100 } },
        { attr: { 'stroke-dashoffset': 0 }, duration: f(8), ease: 'power3.out', immediateRender: false }, f(W.straight));
      gsap.set('#b09-arrow-tip', { x: 275.8311, y: 473.4836 });                  // tip at S + 36 px along the line
      tl.fromTo('#b09-arrow-tip', { x: 275.8311, y: 473.4836 },
        { x: 1159.0614, y: 559.3532, duration: f(8), ease: 'power3.out', immediateRender: false }, f(W.straight));
      // Tip passes the dot (723 px from S) between local 92 (643 px) and 93 (788 px): the dot shakes from local 93.
      const HIT = W.straight + 3;
      M.shake(tl, '#b09-dot', f(HIT), { amp: 6, frames: 8, seed: 9, decay: true });

      // ---------------- L3 three vertical strips (beat f127 ..), one per phrase, with its T4 phrase ----------------
      const POP = [W.ram, W.chase, W.letgo];
      POP.forEach((t, i) => {
        S.gridPop(tl, '#b09-s' + (i + 1), f(t), { punch: 1.15 });              // 4f pop + 4f punch-in to 115%
        T.spreadIn(tl, document.querySelectorAll('#b09-t4 .rc-t4__piece')[i], f(t));
      });
      // Rule 7 (held shot): after its punch lands, each strip's footage keeps pushing in slowly, 115% -> 115% x 1.04,
      // linear, ending on the B10 "fun" cut (beat f252 on this clock = B10 f37). b10-fun continues the same line.
      const FUN = 258;                                                            // B10 f37 in this composition's local frames
      const pushAt = (land, x) => 1.15 * (1 + 0.04 * (x - land) / (FUN - land));
      POP.forEach((t, i) => {
        const land = t + 4;
        tl.fromTo('#b09-s' + (i + 1) + ' .rc-l3__media', { scale: 1.15 },
          { scale: pushAt(land, END), duration: f(END - land), ease: 'none', immediateRender: false }, f(land));
      });

      window.__timelines["b09-throughyou"] = tl;
    </script>
