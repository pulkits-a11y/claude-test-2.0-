      <div id="b09-lk-3" class="clip rc-lk" data-start="2.5000" data-duration="1.7000" data-track-index="10" style="--rc-lk-c: 150.5px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 60px; line-height: 60px; height: 60px"><span class="rc-lw" data-rc-f="75">to</span> <span class="rc-lw" data-rc-f="78">drive</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -28.03px"><span class="rc-lw rc-lw--pop" data-rc-f="86">straight</span></div><div class="rc-lk__row rc-lk__row--tail" style="font-size: 60px; line-height: 60px; height: 60px; margin-top: 15.3px"><span class="rc-lw" data-rc-f="101">through</span> <span class="rc-lw" data-rc-f="108">you.</span></div></div></div>

    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, M = RCK.motifs, X = RCK.transitions;
      const f = (n) => n / 30;            // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets (local, words.json v05 = v04): The 7, police 11, cars 21, stop 27, following 34, you 53, and 55, start 59,
      // trying 67, to 75, drive 78, straight 86, through 101, you. 108, They 126, ram. 134, They 149, chase. 155, They 174,
      // don't 181, let 191, go. 197.

      // ---- "you" arrow on the player's car from local 77 (doc: "from 35.5", v04 time): the same M2 arrow as B5 / B11
      //      (seed 7), drawn on over 8 f; it sits inside the camera wrapper so the whip-zoom carries it with the car.
      //      Tip at the car's right end, tail on the open lanes to its right, just above the lockup's lead row; after the
      //      whip it sits at (991, 224) <- (1238, 137), on screen. Phase 2: kit v05 annotation (#FFD23F, jitter). ----
      M.arrowDraw(tl, '#b09-arrow', f(77), { from: [1040, 330], to: [870, 390], bend: 0.16, seed: 7, label: 'you' });

      // ---- whip-zoom on "straight" (local 86; doc 36.0): the wrapper scales 100 -> 145% about the player's car
      //      (600, 760) under the player's car (it rises into the upper third, clear of the lockup) over 83-89, easeInOutExpo (the move is almost all on 85-87), motion blur on the footage through
      //      its media-treatment blur control (kit BLUR_CAL): 0 -> 14 px expo.in to 86, back to 0 expo.out by 89. Holds
      //      145% to the cut on "They" (126). ----
      const WHIP = 86, BV = X.blurValue;
      gsap.set('#b09-cam', { scale: 1, transformOrigin: '600px 760px', force3D: false });
      tl.fromTo('#b09-cam', { scale: 1 }, { scale: 1.45, duration: f(6), ease: 'expo.inOut', force3D: false, immediateRender: false }, f(WHIP - 3));
      tl.fromTo('#b09-gta1', { '--hf-color-grading-blur': 0 }, { '--hf-color-grading-blur': BV(14), duration: f(3), ease: 'expo.in', immediateRender: false }, f(WHIP - 3));
      tl.fromTo('#b09-gta1', { '--hf-color-grading-blur': BV(14) }, { '--hf-color-grading-blur': 0, duration: f(3), ease: 'expo.out', immediateRender: false }, f(WHIP));

      // ---- glow flash (kit, client v04 #12) on each sentence's own shot: "They ram." 126, "They chase." 149 ----
      S.glowFlash(tl, '#b09-ram-box', f(126));
      S.glowFlash(tl, '#b09-chase-box', f(149));

      // ---- "They don't let go.": the three strips slam in 2 f apart over the chase shot (no black), each with the kit's
      //      pop + 4 f punch-in to 115% + glow flash; then ONE easeInOutSine push 115% -> 115% x 1.08 from each landing to
      //      "fun" (b10-fun local 41 = this 243); this composition plays the head of that curve, b10-fun the rest. ----
      const POP = [174, 176, 178], END = 214, FUN = 243, PUSH = 0.08;   // PUSH = b10-fun's PUSH
      POP.forEach((t, i) => {
        S.gridPop(tl, '#b09-s' + (i + 1), f(t), { punch: 1.15 });
        S.glowFlash(tl, '#b09-s' + (i + 1), f(t));
      });
      const IO = RCK.ease.fn('easeInOutSine');
      const part = (u0, u1) => (p) => (IO(u0 + (u1 - u0) * p) - IO(u0)) / (IO(u1) - IO(u0));
      const pushAt = (land, x) => 1.15 * (1 + PUSH * IO((x - land) / (FUN - land)));
      POP.forEach((t, i) => {
        const land = t + 4, u1 = (END - land) / (FUN - land);
        tl.fromTo('#b09-s' + (i + 1) + ' .rc-l3__media', { scale: 1.15 },
          { scale: pushAt(land, END), duration: f(END - land), ease: part(0, u1), immediateRender: false }, f(land));
      });

      // ---- captions (v04 lockups until phase 2): plain words hard-cut in, "straight" pops + blurs in ----
      T.lockupsWire(tl);

      window.__timelines["b09-throughyou"] = tl;
    </script>
