<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/base.css" />
    <link rel="stylesheet" href="assets/kit/type.css" />
    <link rel="stylesheet" href="assets/kit/motifs.css" />
    <link rel="stylesheet" href="assets/kit/transitions.css" />
    <link rel="stylesheet" href="assets/kit/screens.css" />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- B12 b12-thirty v03 (REVISION_v03: dark card, caption lockups, no v02 zooms; calendar entrance + position as v02): beat 78f (2.600s) + 6f handle each end = 90f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 2.8000s (local frames 6 .. 84).
         Word timings: words.json (v02 beat map, VO 115%). Spec: ../../PRODUCTION_SPEC.md, ../../REVISION_v02.md. Plan: ../../00_Brief/ (B12 p.25).

         The B4 L9 / M3 calendar returns: SAME kit component and geometry as b04-racenchase (64 px squares, 8 px gaps,
         6 columns, grid centred on x 960; v03: the dark card + light squares, kit), extended 18 -> 30. v02 (note 6: "add a opening animation where
         it comes into the screen ... and move it a bit more above to the center"): the calendar sits higher (grid top y 400,
         was 520) and comes into the screen with the kit's calendarIn (rises 90 px + scales 90 -> 100% + fades in, 12f
         expo.out) from local 5, so the beat's first frame already shows it arriving.
         beat f0     18 squares filled (light, v03 dark card) + the counter "18" (Coolvetica 120 px) at the grid's
                     top-left (kit counterPos "left": right edge 32 px left of the grid, digit top on the grid top);
                     v03 lockup "Of course," (Of 6, course, 10; above the calendar, ink centred on y 230) until "turn".
         beat f50    "turn": 12 more squares appear and fill siren red #E3262E, 2f apart (local 56 ... 78) while the counter
                     rolls 18 -> 30 (12 odometer rolls, 2f each, easeInOutQuad), landing on 30 on "thirty" (local 71);
                     v03 lockup "turn into [thirty.]*": turn 56, into 67 hard-cut in, above the grid (ink centre y 230).
         beat f65    "thirty": counter lands + the starred keyword "thirty." pops + blurs in; S11's hit lands here
                     (Tesseract, cues.json). The lockup hard-cuts out on the beat end (local 84; no exit animation).
         Camera (v03, REVISION_v03 note 13: v01's camera, eased): the calendar pushes 100 -> 104% across the composition
         (sine.inOut), no keyword punch; captions stay outside it.
         No dates on the calendar (plan p.21/p.40). Optional R12.1 clock time-lapse: skipped while it is a stand-in
         (STORYBOARD B12); see BEAT_NOTES.md. Tesseract owns all audio. -->
    <div id="root" data-composition-id="b12-thirty" data-start="0" data-duration="3.0000000" data-width="1920" data-height="1080">

      <!-- the card (history and facts), whole composition: v03 dark card (REVISION_v03 note 12, ref 3; kit .rc-card =
           --card-surface, ink #0A0A0A with a charcoal lift in the middle); the calendar on it is the kit's dark variant
           (light squares and counter with the glow, the 12 overrun squares stay siren red) -->
      <div id="b12-card" class="clip rc-card rc-full" data-start="0.0000" data-duration="3.0000" data-track-index="1" style="z-index: 1"></div>

      <!-- OPTIONAL R12.1 clock time-lapse "faint behind the card at 10%" (plan p.25): skipped while R12.1 is a stand-in
           (STORYBOARD B12). To use the real clip: add "R12.1" to footage.json, run tools/sync_footage.py, uncomment the
           line below (clip at 10% opacity over the card, under the calendar), re-check, re-render.
      <video id="b12-clock" class="clip rc-full" src="assets/footage/R12.1.mp4" data-start="0.0000" data-duration="3.0000" data-track-index="2" muted playsinline style="z-index: 2; opacity: 0.1; object-fit: cover"></video>
      -->

      <!-- untimed camera wrapper (kit .rc-cam): #b12-cam = v01's slow held-shot push (100 -> 104%, eased; v03 note 13
           removed v02's keyword punch on "thirty" and its nested wrapper). Only the calendar is inside; the captions are not. -->
      <div id="b12-cam" class="rc-cam" style="z-index: 3">
        <div id="b12-cal" class="clip m3-cal" data-start="0.0000" data-duration="3.0000" data-track-index="3"></div>
      </div>

      <!-- v03 caption lockups (REVISION_v03 notes 11, 16, 17; ref 1; kit RCK.type.lockups), white + glow on the dark
           card, centred on x 960. The calendar holds the frame centre (its v02 place, kept), so both lockups sit above it
           with their ink centred on y 230 (lowest ink, the "y" of "thirty.", ~365 px, clears the grid top: 400 -> ~394.5
           at the 104% push, by ~29 px). "Of course," = one centred line at the dark-card size (76 px, kit card: true), Of 6, course,
           10, held until "turn" (local 56) as v02; then "turn into" small above-left + "thirty." the big Coolvetica Italic
           keyword, starred: turn 56 / into 67 hard-cut in, "thirty." pops + blurs in on local 71 (= the counter landing on
           30 + S11's hit), held to the beat end (local 84). Generated with T.lockups(w, ['Of course,'], { from: 0, end:
           56/30, y: 230, card: true }) and T.lockups(w, ['turn into [thirty.]*'], { from: 5, end: 84/30, y: 230 }). -->
      <div id="b12-lk-of-1" class="clip rc-lk" data-start="0.2000" data-duration="1.6666" data-track-index="9" style="--rc-y: 230px; --rc-lk-c: 40.36px; z-index: 20"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--solo" style="font-size: 76px; line-height: 76px; height: 76px"><span class="rc-lw" data-rc-f="6">Of</span> <span class="rc-lw" data-rc-f="10">course,</span></div></div></div>
      <div id="b12-lk-1" class="clip rc-lk" data-start="1.8666" data-duration="0.9334" data-track-index="4" style="--rc-y: 230px; --rc-lk-c: 104.2px; z-index: 20"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 60px; line-height: 60px; height: 60px"><span class="rc-lw" data-rc-f="56">turn</span> <span class="rc-lw" data-rc-f="67">into</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -28.03px"><span class="rc-lw rc-lw--pop" data-rc-f="71">thirty.</span></div></div></div>
    </div>

    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> composition seconds (local = beat frame + 6)
      // v02 word onsets (words.json comp_t -> nearest frame, local): Of 6, course, 10, the 26, eighteen 32, months 44,
      // turn 56, into 67, thirty. 71.
      const TURN = 56, THIRTY = 71, END = 90;

      // ---- M3 / L9: the B4 calendar, 18 filled + counter 18 (same component and default geometry as B4), placed
      //      higher (note 6): grid top y 400 (v01 520) ----
      const cal = M.calendarInit('#b12-cal', { slots: 18, filled: 18, counter: 18, counterPos: 'left', y: 400 });

      // ---- opening animation (note 6): the calendar comes into the screen (kit calendarIn: +90 px -> 0, 90 -> 100%,
      //      12f expo.out, opacity 0 -> 1 over 6f power2.out) from local 5: the beat's first frame (local 6) shows it
      //      arriving (42%, 94.4%, +51 px), landed by local 17 ----
      M.calendarIn(tl, '#b12-cal', L(5));

      // ---- the 18 -> 30 overrun, as v01: squares from "turn" 2f apart, the counter landing on "thirty" ----
      // RCK.motifs.calendarExtend ties one counter roll to each square (2f apart), which would land 30 on local 80, not on
      // "thirty" (71). So the counter is detached while the kit adds the squares, then rolled on its own schedule with the
      // kit's own roll (each digit strip slides up 1 em over 2f, easeInOutQuad = the v02 kit's counter ease): 12 rolls
      // spread evenly from "turn" (56) to local 69, the last one landing on 71.
      const counter = cal.counter;
      cal.counter = null;
      M.calendarExtend(tl, '#b12-cal', L(TURN), { to: 30, stepF: 2, grow: 'with-fill' });   // red squares 19-30: local 56, 58 ... 78
      cal.counter = counter;
      const rollStarts = [56, 57, 58, 60, 61, 62, 63, 64, 65, 67, 68, 69];                   // local frames; +2f = 30 on 71
      let v = 18;
      rollStarts.forEach((s) => {
        const nv = v + 1;
        counter.strips.forEach((strip) => {
          const a = Math.floor(v / strip.place), b = Math.floor(nv / strip.place);
          if (a !== b) tl.fromTo(strip.el, { y: -a * counter.fs }, { y: -b * counter.fs, duration: L(2), ease: 'power1.inOut', immediateRender: false }, L(s));
        });
        v = nv;
      });
      cal.value = v;   // 30

      // ---- v03 caption lockups: plain words hard-cut in on their frames, "thirty." pops + blurs in (kit lockupsWire) ----
      T.lockupsWire(tl);

      // ---- camera (v03, note 13 "remove the random zooms": back to v01's camera = the held-card push 100 -> 104% across
      //      the composition, as B4's calendar, now easeInOutSine about the frame centre; no keyword punch) ----
      C.push(tl, '#b12-cam', 0, { until: L(END), from: 1, to: 1.04 });

      window.__timelines["b12-thirty"] = tl;
    </script>
  </body>
</html>
