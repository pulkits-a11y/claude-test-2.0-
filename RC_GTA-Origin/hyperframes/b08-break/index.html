         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 2.1667s (local frame = beat frame + 6).
         Word timings: words.json (comp_t, v02 VO 115%). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B8 p.23).

         Plan B8 (p.23): T1 "Then, something" -> T10 "breaks.". On "breaks" the picture shatters with X4 and cuts to black

         local 39-47  X4 tear on "breaks" (8f: the kit default inside the plan's 6-10f, so the plan's 12f clean hold of T10
                      still fits the shorter v02 beat), still = this composition's own frame at local 39 (x4_still.sh)

         local 47-52  T10 glitch (6f, hard per-frame cuts), clean from 53, holds 12f to the hard cut at local 65 (beat end);
                      the tail handle 65-71 holds the clean word.
         Layer stack (top -> bottom): z40 caption lockup (y 840) | z30 T10 | z20 X4 tear canvas | z10 ink black |

            <!-- the two T9 highlighter strokes, landed (b07 swipes them on "shut" and "down."); v03: dark-page group -->

                <mask data-hf-id="hf-kd0g" id="b08-dimE-m" maskUnits="userSpaceOnUse" x="0" y="0" width="2232" height="2352"><rect data-hf-id="hf-g9ea" x="0" y="0" width="2232" height="2352" fill="#FFFFFF" /><rect data-hf-id="hf-p0r5" x="241" y="1979" width="1154" height="64" rx="12" ry="12" fill="#000000" filter="url(#b08-dimE-f)" /></mask>
              </defs><rect data-hf-id="hf-add3" x="0" y="0" width="2232" height="2352" fill="#000000" fill-opacity="0.65" mask="url(#b08-dimE-m)" /></svg>

      <!-- v05 (doc 31.0-32.0 "Then, something": the article dims to 30% and blurs): black over the page, 0 -> 70% (below the
           caption lockup, above the page), with the page blur in the script -->

      <!-- ===== X4 pixel-block tear on "breaks" (local 39 = beat f33), 8f, then the hard cut to black ===== -->

      <!-- ===== local 47-71 (beat 41-59 + tail handle): black, T10 "breaks." ===== -->

      <div data-hf-id="hf-08q9" id="b08-t10" class="clip rc-t10" data-start="1.5666" data-duration="0.8000" data-track-index="8" style="z-index: 30"><span data-hf-id="hf-iiag" class="rc-t10__word">breaks.</span></div>

      <!-- v03 caption lockup (REVISION_v03 notes 11, 16, 17), kit RCK.type.lockups from words.json: "Then, something" (one
           small line; "Then," on 7, "something" on 25, hard cuts), below the spotlit sentence (ink centre y 840, as b07's
           last lockup); it leaves at the tear (39). -->
      <div data-hf-id="hf-00mr" id="b08-lk-1" class="clip rc-lk" data-start="0.2333" data-duration="1.0667" data-track-index="10" style="--rc-y: 840px; --rc-lk-c: 33.98px; z-index: 40"><div data-hf-id="hf-fsmu" class="rc-lk__box"><div data-hf-id="hf-8zfn" class="rc-lk__row rc-lk__row--solo" style="font-size: 64px; line-height: 64px; height: 64px"><span data-hf-id="hf-ut3s" class="rc-lw" data-rc-f="7">Then,</span> <span data-hf-id="hf-6hql" class="rc-lw" data-rc-f="25">something</span></div></div></div>

    <script src="assets/kit/type.js"></script>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;
      // x4_still.sh renders a copy of this page with data-x4-capture on <html>: same picture, no tear (the X4 still).
      const CAPTURE = document.documentElement.hasAttribute("data-x4-capture");

      // Word frames (local) from words.json: Then, 7, something 25, breaks. 39.
      const kBreaks = 39;                 // beat 33: the X4 tear's first frame (cues.json "breaks")
      const kBlack = kBreaks + 8;         // beat 41: first black frame (cues.json "first_black")

      // ---- b07-shutdown's article shot, continued (v05): b07's push about the frame centre, ONE easeInOutSine move from b07's
      //      cut on "keep" (b07 local 41) to "breaks" (this local 39 = b07 local 129), 88f, 100 -> 118%. This composition (local
      //      L = b07 local 90 + L) plays curve frames 49..88 (segment of the same ease), so b07's last frame and this first frame
      //      match. From the tear on, the page is covered (X4 still mode) and holds the end state. ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const ART_LEN = 88, ART_S = 1.18, k0 = 49 / ART_LEN;
      C.push(tl, '#b08-artCam', f(0), { until: f(kBreaks), from: 1 + (ART_S - 1) * SIN(k0), to: ART_S, ease: seg(k0, 1) });

      // ---- v05 (doc 31.0-32.0): on "Then, something" the article dims to 30% (black 0 -> 70%) and blurs 0 -> 30 px on screen,
      //      from "Then," (7) to just before "breaks" (37), easeInOutSine. The page is scaled ~1.6x on screen here, so 30 px =
      //      18.5 layout px: the page image through its media-treatment blur control (kit blurValue), the DOM layers on it
      //      (strokes, spotlight) by CSS. ----
      tl.fromTo('#b08-dimall', { opacity: 0 }, { opacity: 0.7, duration: 30 / 30, ease: 'sine.inOut', immediateRender: false }, f(7));
      const art = document.getElementById('b08-e'), BLUR_PX = 18.5, vEnd = X.blurValue(BLUR_PX);
      art.style.setProperty('--hf-color-grading-blur', '0');
      // the blur VALUE follows the px curve exactly: value(p) = blurValue(18.5 * sine.inOut(p)), normalised (plain tweens only,
      // no callbacks, so any seek renders the same frame)
      const pxEase = (p) => X.blurValue(BLUR_PX * SIN(p)) / vEnd;
      tl.fromTo(art, { '--hf-color-grading-blur': 0 }, { '--hf-color-grading-blur': vEnd, duration: 30 / 30, ease: pxEase, immediateRender: false }, f(7));
      tl.fromTo('#b08-hlgroup, #b08-dimE svg', { filter: 'blur(0px)' }, { filter: 'blur(' + BLUR_PX + 'px)', duration: 30 / 30, ease: 'sine.inOut', immediateRender: false }, f(7));

      // ---- X4 on "breaks": 8f tear as the X library defines it (16 x 9 blocks jumping +/-30 px, some freezing on the old
      //      frame, 6 px RGB split; per-frame cuts), then the hard cut to black on local 47. Seed 8 (as v01 and b17-loop). ----
      if (CAPTURE) document.getElementById("b08-x4").remove();
      else X.tear(tl, "#b08-x4", f(kBreaks), { frames: 8, seed: 8 });

      // ---- T10 "breaks." on black: 6f glitch (local 47-52, hard per-frame cuts), clean from 53, holds 12f to the hard cut
      //      (local 65); the tail handle 65-70 holds the clean word (closing state continued) ----
      T.glitch(tl, "#b08-t10", f(kBlack), { seed: 8 });

      // ---- v03 caption lockup: each word hard-cuts in on its spoken frame (no animation) ----
      T.lockupsWire(tl);

      window.__timelines["b08-break"] = tl;
    </script>
