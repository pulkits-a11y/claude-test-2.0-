  <body>
    <!-- B8 b08-break: beat 63f (2.100s) + 6f handle each end = 75f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 2.3000s (local frame = beat frame + 6).
         Word timings: words.json (comp_t). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B8 p.23).

         Plan B8 (p.23): T1 "Then, something" -> T10 "breaks.". On "breaks" the stamp card shatters with X4 and cuts to
         black (#0A0A0A). T10 "breaks." glitches for 6f, settles clean and holds 12f, then hard cut. The only fully silent
         moment besides the very end (MU4 mutes the music 15f from the first black frame): add nothing to it.
         Storyboard: f0-35 the B7 stamped card held (final state, slow push) + T1 "Then, something" @0 (out at 35);
         f35-45 X4 shatter (10f); f45 cut to black; T10 glitch f45-50, clean f51-62, hard cut to B9 at f63.

         Layer stack (top -> bottom):
           z40  T1 caption (card ink, low line: same place as B7's captions)          local  6-41
           z30  T10 "breaks." (Inter Black 160 px, white, centred)                      local 51-75
           z20  #b08-x4  X4 tear canvas (still mode, still = this composition's own frame at local 41)   41-50
           z10  #b08-black  ink black #0A0A0A                                           local 51-75
           z2   #b08-cam  camera: push continues B7's (same function of the edit frame) local  0-51
                  #b08-prop  L5 prop, tilt -4 deg, float continuing B7's phase
                    frame + R7.1 (continuous source time: B7 in-point + 3.2 s) + the three stamps, landed
           z1   #b08-ground  card gray #E9E9E9                                          local  0-51 -->
    <div data-hf-id="hf-1bdy" id="root" data-composition-id="b08-break" data-start="0" data-duration="2.5000000" data-width="1920" data-height="1080">

      <!-- ===== f-6..34: B7's final stamped card, exactly (layout copied from b07-shutdown) ===== -->
      <div data-hf-id="hf-5j7l" id="b08-ground" class="clip rc-l5__ground" data-start="0" data-duration="1.7000" data-track-index="1" style="z-index: 1"></div>
      <div data-hf-id="hf-pxin" id="b08-cam" class="rc-scr" style="z-index: 2">
        <div data-hf-id="hf-d9kt" id="b08-prop" class="rc-l5__prop" data-rot="-4" style="--x: 560px; --y: 140px; --w: 800px; --h: 600px; --rc-pos: 50% 50%;">
          <div data-hf-id="hf-8tq4" id="b08-frame" class="clip rc-l5__frame" data-start="0" data-duration="1.7000" data-track-index="2"></div>
          <!-- R7.1: b07's in-point (media 0 = original 0:03.6) + 3.2 s = continuous source time across the B7/B8 cut. -->
          <video data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0,&quot;contrast&quot;:0,&quot;highlights&quot;:0,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0.06,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:-0.2},&quot;details&quot;:{&quot;vignette&quot;:0.12,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0.1,&quot;grainSize&quot;:0.2,&quot;grainRoughness&quot;:0.6},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;,&quot;wheels&quot;:{&quot;shadows&quot;:{&quot;hue&quot;:35,&quot;amount&quot;:0.08,&quot;level&quot;:0.03},&quot;midtones&quot;:{&quot;hue&quot;:0,&quot;amount&quot;:0,&quot;level&quot;:0},&quot;highlights&quot;:{&quot;hue&quot;:0,&quot;amount&quot;:0,&quot;level&quot;:0}}}" data-hf-id="hf-71kr" id="b08-r71" class="clip rc-l5__media" src="assets/footage/R7.1.mp4" data-start="0" data-duration="1.7000" data-media-start="3.2000" data-track-index="3" muted playsinline></video>
          <div data-hf-id="hf-b5ju" id="b08-stamp1" class="clip m-stamp" data-start="0" data-duration="1.7000" data-track-index="4" data-layout-allow-overlap="" data-layout-allow-occlusion=""></div>
          <div data-hf-id="hf-wuok" id="b08-stamp2" class="clip m-stamp" data-start="0" data-duration="1.7000" data-track-index="5" data-layout-allow-overlap="" data-layout-allow-occlusion=""></div>
          <div data-hf-id="hf-kjwm" id="b08-stamp3" class="clip m-stamp" data-start="0" data-duration="1.7000" data-track-index="6" data-layout-allow-overlap="" data-layout-allow-occlusion=""></div>
        </div>
      </div>

      <!-- ===== X4 pixel-block tear on "breaks" (beat f35 = local 41), 10f, shatter to black, then the cut ===== -->
      <!-- still mode: assets/x4/b08-old.png = this composition at local 41 WITHOUT the tear (made by x4_still.sh) -->
      <div data-hf-id="hf-o4zi" id="b08-x4" class="rc-x4" style="z-index: 20">
        <img data-hf-id="hf-ha5p" class="rc-x4__still" src="assets/x4/b08-old.png" alt="">
      </div>

      <!-- ===== f45-63 (+ tail handle): black, T10 "breaks." ===== -->
      <div data-hf-id="hf-svfe" id="b08-black" class="clip rc-ink rc-full" data-start="1.7000" data-duration="0.8000" data-track-index="7" style="z-index: 10"></div>
      <div data-hf-id="hf-us1x" id="b08-t10" class="clip rc-t10" data-start="1.7000" data-duration="0.8000" data-track-index="8" style="z-index: 30"><span data-hf-id="hf-iiag" class="rc-t10__word">breaks.</span></div>

      <!-- T1 "Then, something" (kit T.captionPlan from words.json): in on "Then," (local 6), out at the tear (local 41) -->
      <div data-hf-id="hf-894m" id="b08-cap-1" class="clip rc-t1 rc-t1--low rc-on-card" data-start="0.2000" data-duration="1.1666" data-track-index="10" style="z-index: 40">Then, something</div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens;
      const F = (n) => n / 30;
      // x4_still.sh renders a copy of this page with data-x4-capture on <html>: same picture, no tear (the X4 still).
      const CAPTURE = document.documentElement.hasAttribute("data-x4-capture");

      // Word onsets on this composition's clock (words.json comp_t, s)
      const W = { Then: 0.205, something: 0.875, breaks: 1.366 };
      const kBreaks = T.frame(W.breaks);          // local 41 = beat 35
      const kBlack = kBreaks + 10;                // local 51 = beat 45: first black frame (X4 is 10f)

      // ---- B7's card, continued (same functions of the EDIT frame as b07-shutdown) ----
      // local frame L of this composition = edit frame 990 + L (B8 beat f0 = edit 996).
      const PUSH = (e) => 1 + 0.04 * (e - 900) / 131;     // 100% at B7 f0 -> 104% at B8 f35 (edit 1031)
      const ORIGIN = "960px 440px";
      const PHASE = 0 + Math.PI * 3.2 / 2;                 // b07's PHASE + pi * (96f / 30) / 2 s  (= 1.6 pi)
      S.push(tl, "#b08-cam", 0, { until: F(kBlack), from: PUSH(990), to: PUSH(990 + kBlack), origin: ORIGIN });
      S.propFloat(tl, "#b08-prop", 0, { until: F(kBlack), phase: PHASE, amp: 6, legS: 2 });

      // the three stamps, already landed (b07: centre (400, 300) in the prop, offsets (0,-30) (0,0) (0,+30),
      // rotations -4 / 0 / +10 inside the -4 deg prop = -8 / -4 / +6 deg on screen)
      const rots = [-4, 0, 10], offs = M.STAMP_OFF;
      ["#b08-stamp1", "#b08-stamp2", "#b08-stamp3"].forEach((id, i) => {
        const st = M.stampInit(id, { x: 400 + offs[i][0], y: 300 + offs[i][1], rotation: rots[i] });
        gsap.set(st.slam, { opacity: 1, scale: 1 });
      });

      // ---- X4 on "breaks": 10f tear exactly as the X library defines it (16 x 9 blocks jumping +/-30 px, some freezing
      //      on the old frame, 6 px RGB split), then the hard cut to black on local 51. Kit defaults (no `gap`
      //      drop-outs: the plan's X4 has none). Same settings as b17-loop's final tear (the ending echoes this break).
      if (CAPTURE) document.getElementById("b08-x4").remove();
      else X.tear(tl, "#b08-x4", F(kBreaks), { frames: 10, seed: 8 });

      // ---- T10 "breaks." on black: 6f glitch (local 51-56), clean from 57, holds 12f to the hard cut (local 69),
      //      tail handle 69-74 holds the clean word (closing state continued) ----
      T.glitch(tl, "#b08-t10", F(kBlack), { seed: 8 });

      window.__timelines["b08-break"] = tl;
    </script>
