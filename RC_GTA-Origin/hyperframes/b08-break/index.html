<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/base.css">
    <link rel="stylesheet" href="assets/kit/type.css">
    <link rel="stylesheet" href="assets/kit/motifs.css">
    <link rel="stylesheet" href="assets/kit/transitions.css">
    <link rel="stylesheet" href="assets/kit/screens.css">
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* b07-shutdown's shot E, exactly: the article page in its own pixels with the same static base framing */
      .b08-page { position: absolute; left: 0; top: 0; width: 2232px; height: 2352px; transform-origin: 0 0; }
      #b08-pageE { transform: translate(-68.5714px, -2144.9143px) scale(1.3714286); }  /* page x 50-1450, y 1564-2351.5 */
      .b08-art, .b08-dim, .b08-hls { position: absolute; left: 0; top: 0; width: 2232px; height: 2352px; }
      .b08-dim > svg { position: absolute; left: 0; top: 0; overflow: visible; }
      /* v03: the dark-page highlighter, exactly as b07-shutdown (opaque strokes in one group; the group: screen, 50%) */
      .b08-hlgroup { position: absolute; left: 0; top: 0; width: 2232px; height: 2352px; mix-blend-mode: screen; opacity: 0.5; }
      .b08-hlgroup > .rc-t9-hl { mix-blend-mode: normal; opacity: 1; }
    </style>
  </head>
  <body>
    <!-- B8 b08-break (v03; timing v02): beat 59f (1.967s) + 6f handle each end = 71f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 2.1667s (local frame = beat frame + 6).
         Word timings: words.json (comp_t, v02 VO 115%). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B8 p.23).

         Plan B8 (p.23): T1 "Then, something" -> T10 "breaks.". On "breaks" the picture shatters with X4 and cuts to black
         (#0A0A0A). T10 "breaks." glitches for 6f, settles clean and holds 12f, then hard cut. The only fully silent moment
         besides the very end (MU4 mutes the music 15f from the first black frame): add nothing to it.
         v02: B7 now ends on the Game Developer article (the highlighted sentence, client note 3), so the X4 breaks THAT:
         local  0-39  b07-shutdown's last shot continued: the same page, framing, spotlight and highlights, and the same
                      eased push (one easeInOutSine move on the edit clock from B7's cut on "to" to "breaks", 100 -> 118% +
                      drift; this composition plays its last 39 frames) + the caption lockup "Then, something"
                      v03: the page is the DARK-mode capture (as b07), the highlight is the dark-page one (screen, 50%)
         local 39-47  X4 tear on "breaks" (8f: the kit default inside the plan's 6-10f, so the plan's 12f clean hold of T10
                      still fits the shorter v02 beat), still = this composition's own frame at local 39 (x4_still.sh)
         local 47     first black (S07 riser end, MU4 mute start)
         local 47-52  T10 glitch (6f, hard per-frame cuts), clean from 53, holds 12f to the hard cut at local 65 (beat end);
                      the tail handle 65-71 holds the clean word.
         Layer stack (top -> bottom): z40 caption lockup (y 840) | z30 T10 | z20 X4 tear canvas | z10 ink black |
         z2 #b08-driftE > #b08-camE > the page (R7.GD + highlights + spotlight dim). -->
    <div id="root" data-composition-id="b08-break" data-start="0" data-duration="2.3666667" data-width="1920" data-height="1080">

      <!-- ===== local 0-47: b07-shutdown's shot E continued (Game Developer, Jan 31 2011, the sentence "It was almost canned.
           The publisher, BMG Interactive, wanted to can it" highlighted; R7.GD = live screenshot of
           https://www.gamedeveloper.com/pc/penn-first-i-grand-theft-auto-i-was-almost-canned- , never edited) ===== -->
      <div id="b08-driftE" class="rc-cam" style="z-index: 2">
        <div id="b08-camE" class="rc-cam">
          <div id="b08-pageE" class="b08-page" data-layout-allow-overflow="">
            <img id="b08-e" class="clip b08-art" src="assets/footage/R7.GD.png" data-start="0.0000" data-duration="1.5666" data-track-index="1" alt="Game Developer, 2011: It was almost canned. The publisher, BMG Interactive, wanted to can it">
            <!-- the two T9 highlighter strokes, landed (b07 swipes them on "shut" and "down."); v03: dark-page group -->
            <div id="b08-hlclip" class="clip b08-hls" data-start="0.0000" data-duration="1.5666" data-track-index="2" data-layout-ignore="">
              <div class="b08-hlgroup">
                <div id="b08-hl1" class="rc-t9-hl" style="left: 247px; top: 1987px; width: 360px; height: 48px"></div>
                <div id="b08-hl2" class="rc-t9-hl" style="left: 605px; top: 1987px; width: 784px; height: 48px"></div>
              </div>
            </div>
            <div id="b08-dimE" class="clip b08-dim" data-start="0.0000" data-duration="1.5666" data-track-index="3" data-layout-ignore="">
              <svg width="2232" height="2352" viewBox="0 0 2232 2352" aria-hidden="true"><defs>
                <filter id="b08-dimE-f" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3.6"/></filter>
                <mask id="b08-dimE-m" maskUnits="userSpaceOnUse" x="0" y="0" width="2232" height="2352"><rect x="0" y="0" width="2232" height="2352" fill="#FFFFFF"/><rect x="241" y="1979" width="1154" height="64" rx="12" ry="12" fill="#000000" filter="url(#b08-dimE-f)"/></mask>
              </defs><rect x="0" y="0" width="2232" height="2352" fill="#000000" fill-opacity="0.65" mask="url(#b08-dimE-m)"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== X4 pixel-block tear on "breaks" (local 39 = beat f33), 8f, then the hard cut to black ===== -->
      <!-- still mode: assets/x4/b08-old.png = this composition at local 39 WITHOUT the tear (made by x4_still.sh) -->
      <div id="b08-x4" class="rc-x4" style="z-index: 20">
        <img class="rc-x4__still" src="assets/x4/b08-old.png" alt="">
      </div>

      <!-- ===== local 47-71 (beat 41-59 + tail handle): black, T10 "breaks." ===== -->
      <div id="b08-black" class="clip rc-ink rc-full" data-start="1.5666" data-duration="0.8000" data-track-index="7" style="z-index: 10"></div>
      <div id="b08-t10" class="clip rc-t10" data-start="1.5666" data-duration="0.8000" data-track-index="8" style="z-index: 30"><span class="rc-t10__word">breaks.</span></div>

      <!-- v03 caption lockup (REVISION_v03 notes 11, 16, 17), kit RCK.type.lockups from words.json: "Then, something" (one
           small line; "Then," on 7, "something" on 25, hard cuts), below the spotlit sentence (ink centre y 840, as b07's
           last lockup); it leaves at the tear (39). -->
      <div id="b08-lk-1" class="clip rc-lk" data-start="0.2333" data-duration="1.0667" data-track-index="10" style="--rc-y: 840px; --rc-lk-c: 33.98px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--solo" style="font-size: 64px; line-height: 64px; height: 64px"><span class="rc-lw" data-rc-f="7">Then,</span> <span class="rc-lw" data-rc-f="25">something</span></div></div></div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;
      // x4_still.sh renders a copy of this page with data-x4-capture on <html>: same picture, no tear (the X4 still).
      const CAPTURE = document.documentElement.hasAttribute("data-x4-capture");

      // Word frames (local) from words.json: Then, 7, something 25, breaks. 39.
      const kBreaks = 39;                 // beat 33: the X4 tear's first frame (cues.json "breaks")
      const kBlack = kBreaks + 8;         // beat 41: first black frame (cues.json "first_black")

      // ---- b07-shutdown's article camera, continued: ONE easeInOutSine move on the EDIT clock from B7's cut on "to" (edit
      //      897) to "breaks" (edit 968 = this local 39), 71f: scale 100 -> 118% about the sentence centre (1053.257, 613.029)
      //      + drift (-93.257, -53.029) px. This composition (local L = edit 929 + L) plays frames 32..71 of it on the same curve
      //      (segment of the ease, not restarted), so b07's last frame and this first frame match. From the tear on the page
      //      is covered (X4 still mode) and holds the end state. ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const E_LEN = 71, E_S = 1.18, E_DX = -93.257, E_DY = -53.029, k0 = 32 / E_LEN, p0 = SIN(k0);
      C.push(tl, '#b08-camE', f(0), { until: f(kBreaks), from: 1 + (E_S - 1) * p0, to: E_S, ease: seg(k0, 1), origin: '1053.257px 613.029px' });
      gsap.set('#b08-driftE', { x: E_DX * p0, y: E_DY * p0, force3D: false });
      tl.fromTo('#b08-driftE', { x: E_DX * p0, y: E_DY * p0 }, { x: E_DX, y: E_DY, duration: kBreaks / 30, ease: seg(k0, 1), force3D: false, immediateRender: false }, 0);

      // ---- X4 on "breaks": 8f tear as the X library defines it (16 x 9 blocks jumping +/-30 px, some freezing on the old
      //      frame, 6 px RGB split; per-frame cuts), then the hard cut to black on local 47. Seed 8 (as v01 and b17-loop). ----
      if (CAPTURE) document.getElementById("b08-x4").remove();
      else X.tear(tl, "#b08-x4", f(kBreaks), { frames: 8, seed: 8 });

      // ---- T10 "breaks." on black: 6f glitch (local 47-52, hard per-frame cuts), clean from 53, holds 12f to the hard cut
      //      (local 65); the tail handle 65-70 holds the clean word (closing state continued) ----
      T.glitch(tl, "#b08-t10", f(kBlack), { seed: 8 });

      // ---- v03 caption lockup: each word hard-cuts in on its spoken frame (no animation) ----
      T.lockupsWire(tl);

      window.__timelines["b08-break"] = tl;
    </script>
  </body>
</html>
