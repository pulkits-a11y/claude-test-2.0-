    <!-- B8 b08-break (v05; timing v02): beat 59f (1.967s) + 6f handle each end = 71f.

         z2 #b08-artCam > the page (R7.GD + pink highlights + spotlight dim). No stamp anywhere (U5).

            <!-- the two pink highlighter strokes, landed (b07 sweeps them on 61 and 82), kit .fx-hl fx-hl--dark in b07's group -->

              <div data-hf-id="hf-u5ya" id="b08-hlgroup" class="b08-hlgroup">

              </div>
            </div>
            <div data-hf-id="hf-a249" id="b08-dimE" class="clip b08-dim" data-start="0.0000" data-duration="1.4000" data-track-index="3" data-layout-ignore="">
              <svg data-hf-id="hf-buxh" width="2232" height="2352" viewBox="0 0 2232 2352" aria-hidden="true"><defs data-hf-id="hf-mh0t">
                <filter data-hf-id="hf-aj0m" id="b08-dimE-f" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><fegaussianblur data-hf-id="hf-ajt9" stdDeviation="3.6" /></filter>
                <mask data-hf-id="hf-kd0g" id="b08-dimE-m" maskUnits="userSpaceOnUse" x="0" y="0" width="2232" height="2352"><rect data-hf-id="hf-g9ea" x="0" y="0" width="2232" height="2352" fill="#FFFFFF" /><rect data-hf-id="hf-p0r5" x="241" y="1979" width="1154" height="64" rx="12" ry="12" fill="#000000" filter="url(#b08-dimE-f)" /></mask>

      <!-- v05 (doc 31.0-32.0 "Then, something": the article dims to 30% and blurs): black over the page, 0 -> 70% (below the
           caption lockup, above the page), with the page blur in the script -->
      <div data-hf-id="hf-64dc" id="b08-dimall" class="clip b08-dimall" data-start="0.0000" data-duration="1.4000" data-track-index="4" style="z-index: 3"></div>

      <!-- ===== v05 the break on "breaks" (local 39 = beat 33; REVISION_v05 lane 2 with the client override U2) =====
           39-45 the kit's pink pixel glitch is the FRAME transition (RCK.fx.glitch 'cut', 7f, RGB split on 41-44, the picture
           shaking 18 px); the hard cut from the article to the dark card is on its middle frame (42). The hero word
           "breaks." (Coolvetica Italic 450) simply appears on 39 above it all; the Win95 window (the hook's dialog, same
           scale and place as b02-bug) flashes for 2 frames behind it (39-40, RCK.fx.errorFlash). -->
      <div id="b08-dark" class="fx-dark" style="z-index: 5"><div id="b08-dark-base" class="clip fx-fill fx-dark__base" data-start="1.4000" data-duration="0.9666"></div><div class="fx-dark__loop" style="opacity: 0.2"><div class="fx-card__bgscale" data-layout-allow-overflow style="width: 1258.56px; height: 707.94px; transform: translate(-144px, -81px) scale(1.7543900000000001)"><video id="b08-dark-loop" class="clip " src="assets/footage/R9.1.mp4" data-start="1.4000" data-duration="0.9666" data-media-start="0.0000" muted playsinline data-color-grading='{"preset":null,"intensity":1,"adjust":{"exposure":-1,"contrast":0,"highlights":0,"shadows":0,"whites":0,"blacks":0,"temperature":0,"tint":0,"vibrance":0,"saturation":0},"effects":{"blur":1}}'></video></div></div><div id="b08-dark-tex" class="clip fx-fill fx-dark__tex" data-start="1.4000" data-duration="0.9666"></div></div>
      <div id="b08-err" class="clip fx-host" data-start="1.3000" data-duration="0.0667" data-track-index="7" style="--x: 960px; --y: 420px; z-index: 20"></div>
      <div id="b08-gl" class="clip fx-host" data-start="1.3000" data-duration="0.2333" data-track-index="8" style="z-index: 30"></div>

      <!-- v05 caption lockups (kit v05): "Then, something" (7, 25; words appear; ink centre y 840 under the dimming article)
           and the hero "[[breaks.]]" (39, Coolvetica Italic 450, appears, centred), held through the tail handle. -->
      <div id="b08-lk-1" class="clip rc-lk" data-rc-v="5" data-start="0.2333" data-duration="1.0667" data-track-index="10" style="--rc-y: 840px; --rc-lk-c: 28.67px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--solo" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="7">Then,</span> <span class="rc-lw" data-rc-f="25">something</span></div></div></div>
      <div id="b08-lk-2" class="clip rc-lk" data-rc-v="5" data-start="1.3000" data-duration="1.0666" data-track-index="10" style="--rc-lk-c: 238.95px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--key rc-lk__row--hero" style="font-size: 450px; line-height: 450px; height: 450px"><span class="rc-lw rc-lw--key rc-lw--hero" data-rc-f="39">breaks.</span></div></div></div>

    <script src="assets/kit/type.js"></script>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions, C = RCK.cam, FX = RCK.fx;
      const f = (n) => n / 30;

      // Word frames (local) from words.json: Then, 7, something 25, breaks. 39.
      const kBreaks = 39;                 // beat 33: "breaks." appears, the glitch transition starts (cues.json key_words / sfx)
      const kCut = kBreaks + 3;           // beat 36: the cut from the article to the dark card, the glitch's middle frame

      // ---- b07-shutdown's article shot, continued (v05): b07's push about the frame centre, ONE easeInOutSine move from b07's
      //      cut on "keep" (b07 local 41) to "breaks" (this local 39 = b07 local 129), 88f, 100 -> 118%. This composition (local
      //      L = b07 local 90 + L) plays curve frames 49..88 (segment of the same ease), so b07's last frame and this first frame
      //      match. It holds 118% from "breaks" (39) to the cut (42). ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const ART_LEN = 88, ART_S = 1.18, k0 = 49 / ART_LEN;
      C.push(tl, '#b08-artCam', f(0), { until: f(kBreaks), from: 1 + (ART_S - 1) * SIN(k0), to: ART_S, ease: seg(k0, 1) });

      // ---- v05 (doc 31.0-32.0): on "Then, something" the article dims to 30% (black 0 -> 70%) and blurs 0 -> 30 px on screen,
      //      from "Then," (7) to just before "breaks" (37), easeInOutSine. The page is scaled ~1.6x on screen here, so 30 px =
      //      18.5 layout px: the page image through its media-treatment blur control (kit blurValue), the DOM layers on it
      //      (strokes, spotlight) by CSS. ----
      tl.fromTo('#b08-dimall', { opacity: 0 }, { opacity: 0.7, duration: 30 / 30, ease: 'sine.inOut', immediateRender: false }, f(7));
      const art = document.getElementById('b08-e'), BLUR_PX = 18.5, vEnd = X.blurValue(BLUR_PX);
      art.style.setProperty('--hf-color-grading-blur', '0');
      // the blur VALUE follows the px curve exactly: value(p) = blurValue(18.5 * sine.inOut(p)), normalised (plain tweens only,
      // no callbacks, so any seek renders the same frame)
      const pxEase = (p) => X.blurValue(BLUR_PX * SIN(p)) / vEnd;
      tl.fromTo(art, { '--hf-color-grading-blur': 0 }, { '--hf-color-grading-blur': vEnd, duration: 30 / 30, ease: pxEase, immediateRender: false }, f(7));
      tl.fromTo('#b08-hlgroup, #b08-dimE svg', { filter: 'blur(0px)' }, { filter: 'blur(' + BLUR_PX + 'px)', duration: 30 / 30, ease: 'sine.inOut', immediateRender: false }, f(7));

      // ---- v05 the break on "breaks" (39): the kit's pink pixel glitch as the frame transition (RCK.fx.glitch 'cut', 7f:
      //      39-45, a new seeded layout of pink / white blocks + pixel-sort streaks each frame, RGB split 9 px on 41-44), the
      //      picture under it shaking 18 px (the article on 39-41, the dark card on 42-45); the cut to the dark card on 42
      //      (clip boundaries). The Win95 window (the hook's dialog: same scale 1.8 and place as b02-bug) flashes for 2 frames
      //      behind the word (39-40). The hero word itself simply appears (U2). The kit's v05 dark card (#0E0E10 + grain +
      //      scanlines + GTA 1 at 20%, blurred 40 px) holds to the end. ----
      FX.errorWindow('#b08-err', { scale: 1.8 });
      FX.errorFlash(tl, '#b08-err', f(kBreaks), { frames: 2 });
      FX.glitch(tl, '#b08-gl', f(kBreaks), { mode: 'cut', frames: 7, shake: '#b08-artCam, #b08-dark', shakePx: 18 });

      // ---- v05 caption lockups: "Then," / "something" appear on their frames; the hero "breaks." appears on 39 (no star) ----
      T.lockupsWire(tl);

      window.__timelines["b08-break"] = tl;
    </script>
