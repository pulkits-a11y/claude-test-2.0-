    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions;
      const B = (n) => (n + 6) / 30;                 // beat frame -> composition seconds (6f head handle)
      const W = { Race: 5.120 };                     // words.json comp_t: "Race" = beat f148

      // Geometry measured on the real R15.3 catalogue frame (source px -> frame px through the 1.4x reframe about 241, 1080)
      const PUSH = 1.18, CAT_K = 1.4, HOLE_C = [366 + 548 / 2, 681 + 430 / 2];  // hole 366,681,548,430 -> centre (640, 896)
      const SCREEN_100 = [737, 874, 118, 66.375];                                // 16:9 screen picture rect at push 100%
      const SCREEN_160 = [HOLE_C[0] + PUSH * (SCREEN_100[0] - HOLE_C[0]),       // the same rect on the zoom's first
                          HOLE_C[1] + PUSH * (SCREEN_100[1] - HOLE_C[1]),       // frame (f160, push 118%):
                          PUSH * SCREEN_100[2], PUSH * SCREEN_100[3]];          // [754.46, 870.04, 139.24, 78.32]
      const ZG = X.zoomGeometry({ rect: SCREEN_160 }, { scale: 'fill' });        // fill = 13.79 (1379%)

      // X5 in half: shut until f0 (head handle), slats rotate open over f0-8, removed on f8
      X.blindsOpen(tl, '#b15-x5', B(0));
      // the interior: rule 7 push 100% (f0) -> 104% (f133, the cut), linear; the head handle holds 100% under the slats
      S.push(tl, '#b15-int-wrap', B(0), { until: B(133), from: 1, to: 1.04, origin: '960px 540px' });

      // L7: the screen picture box laid out 1920 px wide (res = 1920 / 118) so it is 1:1 at the end of push + zoom;
      // hidden while the real cabinet screen shows, faded in over the zoom's first 3 frames (f160 -> f163)
      X.zoomFit('#b15-screen', { rect: SCREEN_100 }, { res: 1920 / SCREEN_100[2] });
      gsap.set('#b15-screen', { opacity: 0 });
      tl.fromTo('#b15-screen', { opacity: 0 }, { opacity: 1, duration: 3 / 30, ease: 'none', immediateRender: false }, B(160));
      // push 100% (f133, the cut) -> 118% (f160), linear, about the hole centre (L7: "towards the target")
      S.spotPush(tl, '#b15-l7', B(133), { until: B(160), from: 1, to: PUSH });

      // T9 label pops in over 4f (96% -> 100% + fade, ease out) on "Race" (f148)
      T.label(tl, '#b15-t9', W.Race);

      // X6 IN f160-168: 100% -> 600% about the origin that brings the screen centre to the frame centre; per-frame
      // media-treatment blur on the plate + screen picture, CSS blur on the dim and label (non-media DOM).
      // blurRef / blurMax divided by the 1.18 push: the kit sizes the blur by the zoom scale only, and every element in
      // the world is also pushed 1.18x, so this keeps the on-screen blur at the kit's calibrated strength.
      X.zoom(tl, '#b15-world', B(160), {
        screen: { rect: SCREEN_160 }, dir: 'in', scale: 'fill', blurRef: 540 / PUSH, blurMax: 24 / PUSH,
        blurMedia: '#b15-pic',       // the plate gets its own values below (it is also inside the 1.4x reframe)
        blurDom: ['#b15-dim > svg', '#b15-t9 .rc-t9__label'],
        handoff: '#b15-full-wrap',   // kit: the plain full-frame next shot shows from the landing frame (f168) on
      });
      // the plate's blur control, same plan as the kit, divided by its extra 1.4x on-screen scale
      {
        const plan = X.zoomPlan({ frames: 8, scale: ZG.scale, dir: 'in', blurRef: 540 / PUSH, blurMax: 24 / PUSH });
        let prev = 0;
        plan.list.forEach((p) => {
          const v = X.blurValue(p.sigma / (p.scale * CAT_K));
          if (p.k > 0) tl.fromTo('#b15-plate', { '--hf-color-grading-blur': prev }, { '--hf-color-grading-blur': v, duration: 1 / 30, ease: 'none', immediateRender: false }, B(160 + p.k - 1));
          prev = v;
        });
      }

      // full-frame R15.1 from the landing frame f168: rule 7 push 100% -> 104% to the tail-handle end (102.4% on f177)
      S.push(tl, '#b15-full-wrap', B(168), { until: 190 / 30, from: 1, to: 1.04, origin: '960px 540px' });

      tl.to({}, { duration: 190 / 30 }, 0);
      window.__timelines["b15-proof"] = tl;
    </script>
  </body>
