    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions, C = RCK.cam;
      const B = (n) => (n + 6) / 30;                 // beat frame -> composition seconds (6f head handle)
      // v02 word onsets (words.json comp_t -> local frame): called 130 (beat 124), Race 145 (beat 139), Chase. 153 (beat 147)
      const CUT = 124, ZOOM = 150, LAND = 158;       // beat frames: cut on "called", X6 start (3f after "Chase."), landing

      // Geometry measured on the real R15.3 catalogue frame (source px -> frame px through the 1.4x reframe about 241, 1080)
      const PUSH = 1.18, CAT_K = 1.4, HOLE_C = [366 + 548 / 2, 681 + 430 / 2];  // hole 366,681,548,430 -> centre (640, 896)
      const SCREEN_100 = [737, 874, 118, 66.375];                                // 16:9 screen picture rect at push 100%
      const SCREEN_ZOOM = [HOLE_C[0] + PUSH * (SCREEN_100[0] - HOLE_C[0]),      // the same rect on the zoom's first
                           HOLE_C[1] + PUSH * (SCREEN_100[1] - HOLE_C[1]),      // frame (f150, push 118%):
                           PUSH * SCREEN_100[2], PUSH * SCREEN_100[3]];         // [754.46, 870.04, 139.24, 78.32]
      const ZG = X.zoomGeometry({ rect: SCREEN_ZOOM }, { scale: 'fill' });       // fill = 13.79 (1379%)

      // ---- captions (v03): lockup words hard-cut in on their frames; the starred keyword (GTA Online) pops + blurs in;
      //      lockups replace each other with hard cuts (the last one out on "Race")
      T.lockupsWire(tl);

      // v03 (note 6): no X5 blinds, hard cut from B14 on beat f0. (note 13): the v02 keyword punches are gone and the
      // interior is back to v01's held-shot push, 100% (f0) -> 104% (f124, the cut), eased (easeInOutSine); the head
      // handle holds 100%.
      C.push(tl, '#b15-int-wrap', B(0), { until: B(CUT), from: 1, to: 1.04 });

      // L7: the screen picture box laid out 1920 px wide (res = 1920 / 118) so it is 1:1 at the end of push + zoom;
      // hidden while the real cabinet screen shows, faded in over the zoom's first 3 frames (f150 -> f153, easeOutCubic)
      X.zoomFit('#b15-screen', { rect: SCREEN_100 }, { res: 1920 / SCREEN_100[2] });
      gsap.set('#b15-screen', { opacity: 0 });
      tl.fromTo('#b15-screen', { opacity: 0 }, { opacity: 1, duration: 3 / 30, ease: 'power2.out', immediateRender: false }, B(ZOOM));
      // push 100% (f124, the cut) -> 118% (f150) about the hole centre (L7: "towards the target"), easeInOutSine (kit v02)
      S.spotPush(tl, '#b15-l7', B(CUT), { until: B(ZOOM), from: 1, to: PUSH });

      // X6 IN f150-158: 100% -> 1379% about the origin that brings the screen centre to the frame centre (log-space
      // easeInQuad); per-frame media-treatment blur on the screen picture, CSS blur on the dim (non-media DOM), all as
      // step cuts between frames. blurRef / blurMax divided by the 1.18 push: the kit sizes the blur by the zoom scale
      // only, and every element in the world is also pushed 1.18x, so this keeps the on-screen blur at the kit's strength.
      X.zoom(tl, '#b15-world', B(ZOOM), {
        screen: { rect: SCREEN_ZOOM }, dir: 'in', scale: 'fill', blurRef: 540 / PUSH, blurMax: 24 / PUSH,
        blurMedia: '#b15-pic',       // the plate gets its own values below (it is also inside the 1.4x reframe)
        blurDom: ['#b15-dim > svg'],
        handoff: '#b15-full-wrap',   // kit: the plain full-frame next shot shows from the landing frame (f158) on
      });
      // the plate's blur control, same plan as the kit, divided by its extra 1.4x on-screen scale: one value per frame,
      // changed between frames (a step, like the kit's own X6 blur; nothing linear)
      {
        const plan = X.zoomPlan({ frames: 8, scale: ZG.scale, dir: 'in', blurRef: 540 / PUSH, blurMax: 24 / PUSH });
        let prev = 0;
        plan.list.forEach((p) => {
          const v = X.blurValue(p.sigma / (p.scale * CAT_K));
          if (p.k > 0) S.hard(tl, '#b15-plate', { '--hf-color-grading-blur': prev }, { '--hf-color-grading-blur': v }, B(ZOOM + p.k));
          prev = v;
        });
      }

      // full-frame proof shot (R15.L1) from the landing frame f158: v01's held-shot push 100% -> 104% (v03 note 13; v02 106%),
      // eased (easeInOutSine), to the tail-handle end
      C.push(tl, '#b15-full-wrap', B(LAND), { until: 179 / 30, from: 1, to: 1.04 });

      tl.to({}, { duration: 179 / 30 }, 0);
      window.__timelines["b15-proof"] = tl;
    </script>
  </body>
</html>
