    <!-- B15 b15-proof: beat 178f (5.933s) + 6f handle each end = 190f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 6.1333s (local frame = beat frame + 6).
         Word timings: words.json (comp_t). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B15 p.26-27).

         Beat f-6..0  head handle: X5 slats shut (in half of the B14 -> B15 blinds; B14 closes them over its last 8f).
         Beat f0-8    X5 blinds OPEN onto L7 (12 ink-black slats rotate 0 -> -90 deg, 8f, constant speed).
         Beat f0-160  L7: GTA Online arcade interior (R15.3), dimmed to 35% except a rounded spotlight box on the
                      Race and Chase cabinet; push 100% -> 118% toward it (f0 -> f160). The cabinet screen carries the
                      Race and Chase gameplay (R15.1) so the X6 zoom lands on it. T1 captions (y 620, white + soft shadow):
                      "Don't believe me?" f0 / "Open GTA Online" f27 / "and buy an arcade." f54 / "One of the machines" f100 /
                      "is called" f129. T9 label "RACE AND CHASE" pops next to the cabinet on "Race" (f148, 4f).
         Beat f160-168 X6 IN: zoom through the cabinet screen 100% -> 600% over 8f with motion blur; the label goes with it.
         Beat f168-178 full-frame Race and Chase arcade gameplay (R15.1): the plain full-frame R15.1 (same media time as the
                      screen picture) is the X6 handoff, shown from the landing frame f168 (= the 600% frame), pushing
                      100% -> 104% to the tail-handle end.
         CABINET HOLE, SCREEN RECT AND LABEL SPOT ARE GUESSES ON THE STAND-IN: see BEAT_NOTES.md "Pending real footage".
         Cues (Tesseract): label = f148 (MU6 low-pass/-6 dB from f0 until here), zoom_mid = f164 (S16 peak). -->

st&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-bdpp" id="b15-full" class="clip" src="assets/footage/R15.1.mp4" data-start="5.8000" data-duration="0.5333" data-media-start="5.8000" data-track-index="5" muted playsinline></video>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions;
      const B = (n) => (n + 6) / 30;                 // beat frame -> composition seconds (6f head handle)
      const W = { Race: 5.120 };                     // words.json comp_t: "Race" = beat f148

      // Stand-in geometry (re-fit on the real R15.3, see BEAT_NOTES "Pending real footage")
      const PUSH = 1.18, HOLE_C = [500, 540];                                   // hole 300,120,400,840 -> centre
      const SCREEN_100 = [364.4068, 253.7288, 271.1864, 152.5424];              // screen picture rect at push 100%
      const SCREEN_160 = [HOLE_C[0] + PUSH * (SCREEN_100[0] - HOLE_C[0]),       // the same rect on the zoom's first
                          HOLE_C[1] + PUSH * (SCREEN_100[1] - HOLE_C[1]),       // frame (f160, push 118%):
                          PUSH * SCREEN_100[2], PUSH * SCREEN_100[3]];          // [340, 202.2, 320, 180]

      // X5 in half: shut until f0 (head handle), slats rotate open over f0-8, removed on f8
      X.blindsOpen(tl, '#b15-x5', B(0));

      // L7: the screen picture box laid out at res 7.08 (= 6 x 1.18) so it is 1:1 at the end of push + zoom
      X.zoomFit('#b15-screen', { rect: SCREEN_100 }, { res: 6 * PUSH });
      // push 100% (f0) -> 118% (f160), linear, about the hole centre; the head handle holds 100% under the shut slats
      S.spotPush(tl, '#b15-l7', B(0), { until: B(160), from: 1, to: PUSH });

      // T9 label pops in over 4f (96% -> 100% + fade, ease out) on "Race" (f148)
      T.label(tl, '#b15-t9', W.Race);

      // X6 IN f160-168: 100% -> 600% about the origin that brings the screen centre to the frame centre; per-frame
      // media-treatment blur on the plate + screen picture, CSS blur on the dim and label (non-media DOM).
      // blurRef / blurMax divided by the 1.18 push: the kit sizes the blur by the zoom scale only, and every element in
      // the world is also pushed 1.18x, so this keeps the on-screen blur at the kit's calibrated strength.
      X.zoom(tl, '#b15-world', B(160), {
        screen: { rect: SCREEN_160 }, dir: 'in', blurRef: 540 / PUSH, blurMax: 24 / PUSH,
        blurDom: ['#b15-dim > svg', '#b15-t9 .rc-t9__label'],
        handoff: '#b15-full-wrap',   // kit: the plain full-frame next shot shows from the landing frame (f168) on
      });

      // full-frame R15.1 from the landing frame f168: rule 7 push 100% -> 104% to the tail-handle end (102.4% on f177)
      S.push(tl, '#b15-full-wrap', B(168), { until: 190 / 30, from: 1, to: 1.04, origin: '960px 540px' });

      tl.to({}, { duration: 190 / 30 }, 0);
      window.__timelines["b15-proof"] = tl;
    </script>
