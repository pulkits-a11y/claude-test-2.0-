<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/base.css" />
    <link rel="stylesheet" href="assets/kit/type.css" />
    <link rel="stylesheet" href="assets/kit/motifs.css" />
    <link rel="stylesheet" href="assets/kit/transitions.css" />
    <link rel="stylesheet" href="assets/kit/screens.css" />
    <style>
      /* v05 phase 1 fonts (06_Fonts, OFL); remove the ones the kit v05 defines */
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: block; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: block; }
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F1ECE2; }
      /* TODO kit v05 (off-white paper texture + grain): provisional flat off-white card (the Race'n'Chase page's paper colour) */
      #b18-card { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #F1ECE2; }

      /* ---- profile header (slides up from the bottom over 8f): a white panel, the avatar, name / handle / followers,
         the Follow button. Fixed geometry so the cursor's target is known: panel 1130 x 260 at (395, 270), avatar 200 px
         at (435, 300), text column at x 691 (520 wide), button 280 x 100 at (1205, 350), centre (1345, 400). */
      #b18-head { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b18-panel { position: absolute; left: 395px; top: 270px; width: 1130px; height: 260px; border-radius: 36px; background: #FFFFFF;
        box-shadow: 0 18px 48px rgba(17, 17, 17, 0.12), 0 2px 6px rgba(17, 17, 17, 0.06); }
      #b18-avatar { position: absolute; left: 435px; top: 300px; width: 200px; height: 200px; border-radius: 50%; overflow: hidden; background: #1E1E22; }
      #b18-avatar-mono { position: absolute; left: 0; top: 0; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;
        font: 700 76px/1 "Inter", sans-serif; letter-spacing: -0.01em; color: #FFFFFF; }
      #b18-avatar-img { position: absolute; left: 0; top: 0; width: 200px; height: 200px; object-fit: cover; display: none; }
      #b18-text { position: absolute; left: 691px; top: 290px; width: 500px; height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
      #b18-name { font: 700 76px/1.08 "Inter", sans-serif; letter-spacing: -0.01em; color: #111111; white-space: nowrap; }
      #b18-handle { font: 600 40px/1.15 "Inter", sans-serif; color: #6E6A64; white-space: nowrap; }
      #b18-followers { font: 600 36px/1.15 "Inter", sans-serif; color: #6E6A64; white-space: nowrap; }
      #b18-btn { position: absolute; left: 1205px; top: 350px; width: 280px; height: 100px; }
      .b18-btn-face { position: absolute; left: 0; top: 0; width: 280px; height: 100px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
        font: 600 44px/1 "Inter", sans-serif; white-space: nowrap; }
      #b18-btn-follow { background: #FF2E7E; color: #FFFFFF; }
      #b18-btn-following { background: #DDD8CF; color: #111111; opacity: 0; }

      /* ---- the CTA line, Playfair Display Italic 81 px (doc 54 px @720), centred, the keyword pink; typed on */
      #b18-line { position: absolute; left: 0; top: 640px; width: 1920px; height: 110px; text-align: center;
        font: italic 400 81px/110px "Playfair Display", serif; color: #111111; white-space: nowrap; }
      #b18-line .b18-kw { color: #FF2E7E; }

      /* ---- the cursor (a plain arrow pointer), tip at the wrapper's (0, 0) */
      #b18-cursor { position: absolute; left: 0; top: 0; width: 60px; height: 84px; }
      #b18-cursor-svg { position: absolute; left: 0; top: 0; width: 60px; height: 84px; overflow: visible; }

      /* ---- loop: the last 6 frames cross to B1's frame 0. TODO (B1 lane): hyperframes/b01-hook/LOOP_FRAME.json does not
         exist yet; PLACEHOLDER = a red / blue lightbar-coloured gradient. Replace with B1's clip at its recorded in-point
         and scale (a <video> whose data-media-start = in-point - 6/30 s, so it reaches B1's frame 0 on local 81). */
      #b18-loop { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b18-loop-fade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0;
        background: linear-gradient(90deg, #7A0E12 0%, #E3262B 30%, #1A1A2E 50%, #2E6BFF 70%, #0B1F5C 100%); }
    </style>
  </head>
  <body>
    <!-- B18 b18-cta v05 (NEW, doc "NEW 1:17.0-1:19.5 CTA end card"; REVISION_v05 "Lane 5"): beat 75f (2.500 s, no voice) + 6f
         handle each end = 87f. Local time 0 = beat start - 6f (local frame = CTA frame + 6). Hard cut in from B17's GTA VI logo.
           6-14   profile header (avatar, name, handle, follower count) slides up from the bottom, 8f, expo.out
           12-21  the cursor glides in (power3.out) to the Follow button; 24 (CTA +18 = v04 1:17.6) click: the button turns
                  grey, "Following" (cues: click on CTA frame 18); 30-42 the cursor leaves
           30-61  Comment "BUG" for the full story, Playfair Display Italic 81 px, "BUG" pink, typed on 1 char per frame
           75-81  the last 6 frames cross to B1's frame 0 (the police lightbar) so the video loops; 81-87 tail = that frame.
                  PLACEHOLDER until hyperframes/b01-hook/LOOP_FRAME.json exists.
         Profile data: ONE config object (PROFILE) at the top of the script. Avatar, @handle and follower count are not
         known (REVISION_v05 N3): empty = a neutral monogram and the handle / followers lines hidden. -->
    <div id="root" data-composition-id="b18-cta" data-start="0" data-duration="2.9000000" data-width="1920" data-height="1080">
      <div id="b18-card" class="clip" data-start="0" data-duration="2.9000" data-track-index="1" style="z-index: 1"></div>

      <div id="b18-head" style="z-index: 2">
        <div id="b18-panel" class="clip" data-start="0" data-duration="2.9000" data-track-index="2"></div>
        <div id="b18-avatar" class="clip" data-start="0" data-duration="2.9000" data-track-index="3">
          <div id="b18-avatar-mono">RC</div>
          <img id="b18-avatar-img" alt="">
        </div>
        <div id="b18-text" class="clip" data-start="0" data-duration="2.9000" data-track-index="4">
          <div id="b18-name">Raw Canvas</div>
          <div id="b18-handle"></div>
          <div id="b18-followers"></div>
        </div>
        <div id="b18-btn" class="clip" data-start="0" data-duration="2.9000" data-track-index="5">
          <div id="b18-btn-follow" class="b18-btn-face">Follow</div>
          <div id="b18-btn-following" class="b18-btn-face">Following</div>
        </div>
      </div>

      <div id="b18-line" class="clip" data-start="1.0000" data-duration="1.9000" data-track-index="6" style="z-index: 3"></div>

      <div id="b18-cursor" style="z-index: 4">
        <svg id="b18-cursor-svg" class="clip" data-start="0.4000" data-duration="1.0000" data-track-index="7" viewBox="0 0 60 84" aria-hidden="true">
          <path d="M3 3 L3 66 L18 52 L29 78 L40 73 L29 48 L50 48 Z" fill="#111111" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
        </svg>
      </div>

      <div id="b18-loop" class="clip" data-start="2.5000" data-duration="0.4000" data-track-index="8" style="z-index: 10">
        <div id="b18-loop-fade"></div>
      </div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      // ===== PROFILE: the CTA's profile data. Fill in when the client sends it; never invent values. =====
      const PROFILE = {
        name: "Raw Canvas",     // REVISION_v05 N3
        handle: "",             // e.g. "@..."   unknown: the line is hidden while empty
        followers: "",          // e.g. "... followers"   unknown: the line is hidden while empty
        avatar: "",             // an image in assets/ (e.g. "assets/avatar.jpg"); unknown: empty = the neutral monogram
        monogram: "RC",         // initials of the name, shown while avatar is empty
        keyword: "BUG",         // doc: "Comment “BUG” for the full story" (swap in the real keyword / DM automation)
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const L = (n) => n / 30;                        // local frame -> seconds (local frame = CTA frame + 6)
      const at = (f) => L(f) - 0.0001;                 // a hard change shows on frame f

      // ---- profile data -> markup (static, before the timeline is built)
      document.getElementById("b18-name").textContent = PROFILE.name;
      document.getElementById("b18-avatar-mono").textContent = PROFILE.monogram;
      [["b18-handle", PROFILE.handle], ["b18-followers", PROFILE.followers]].forEach(([id, v]) => {
        const el = document.getElementById(id);
        el.textContent = v;
        el.style.display = v ? "block" : "none";
      });
      if (PROFILE.avatar) {
        const img = document.getElementById("b18-avatar-img");
        img.src = PROFILE.avatar;
        img.style.display = "block";
        document.getElementById("b18-avatar-mono").style.display = "none";
      }

      // ---- the CTA line, one span per character, the keyword (with its quotes) pink
      const line = document.getElementById("b18-line");
      const parts = [["Comment ", false], ["“" + PROFILE.keyword + "”", true], [" for the full story", false]];
      const chars = [];
      parts.forEach(([txt, kw]) => {
        for (const ch of txt) {
          const s = document.createElement("span");
          s.textContent = ch;
          if (kw) s.className = "b18-kw";
          line.appendChild(s);
          chars.push(s);
        }
      });

      // ---- 6-14: the header slides up from below the frame (8f, expo.out); the head handle holds it out of frame
      gsap.set("#b18-head", { y: 820, force3D: false });
      tl.fromTo("#b18-head", { y: 820 }, { y: 0, duration: L(8), ease: "expo.out", immediateRender: false }, L(6));

      // ---- cursor: in from the bottom right (12-21, power3.out), click on 24 (press 2f, release 3f), out (30-42, power2.in)
      gsap.set("#b18-cursor", { x: 1720, y: 1160, scale: 1, transformOrigin: "0px 0px", force3D: false });
      tl.fromTo("#b18-cursor", { x: 1720, y: 1160 }, { x: 1330, y: 408, duration: L(9), ease: "power3.out", immediateRender: false }, L(12));
      tl.fromTo("#b18-cursor", { scale: 1 }, { scale: 0.86, duration: L(2), ease: "power2.out", immediateRender: false }, L(23));
      tl.fromTo("#b18-cursor", { scale: 0.86 }, { scale: 1, duration: L(3), ease: "power2.out", immediateRender: false }, L(25));
      tl.fromTo("#b18-cursor", { x: 1330, y: 408 }, { x: 1700, y: 1180, duration: L(12), ease: "power2.in", immediateRender: false }, L(30));

      // ---- the button on the click (24 = CTA frame 18): Follow -> Following (grey), a small press 96 -> 100%
      gsap.set("#b18-btn", { scale: 1, transformOrigin: "50% 50%", force3D: false });
      tl.fromTo("#b18-btn-follow", { opacity: 1 }, { opacity: 0, duration: L(0.5), ease: "steps(1)", immediateRender: false }, at(24) - L(0.5));
      tl.fromTo("#b18-btn-following", { opacity: 0 }, { opacity: 1, duration: L(0.5), ease: "steps(1)", immediateRender: false }, at(24) - L(0.5));
      tl.fromTo("#b18-btn", { scale: 0.96 }, { scale: 1, duration: L(5), ease: "expo.out", immediateRender: false }, L(24));

      // ---- 30-61: the line types on, one character per frame (~30 chars/s)
      gsap.set(chars, { opacity: 0 });
      chars.forEach((s, i) => {
        tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: L(0.5), ease: "steps(1)", immediateRender: false }, at(30 + i) - L(0.5));
      });

      // ---- 75-81: cross to B1's frame 0 (placeholder), sine.inOut; the tail holds it
      tl.fromTo("#b18-loop-fade", { opacity: 0 }, { opacity: 1, duration: L(6), ease: "sine.inOut", immediateRender: false }, L(75));

      tl.set({}, {}, L(87));
      window.__timelines["b18-cta"] = tl;
    </script>
  </body>
</html>
