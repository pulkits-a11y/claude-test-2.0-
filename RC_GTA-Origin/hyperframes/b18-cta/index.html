<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/base.css">
    <link rel="stylesheet" href="assets/kit/type.css">
    <link rel="stylesheet" href="assets/kit/motifs.css">
    <link rel="stylesheet" href="assets/kit/transitions.css">
    <link rel="stylesheet" href="assets/kit/screens.css">
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0E0E10; }
      /* U4 (client v03 #12): a DARK card, not off-white: the kit dark card (prep/gen_b18.cjs, RCK.fx.darkCardHTML) =
         #0E0E10 + grain + scanlines + B1's lightbar footage blurred 40 px at 20 % behind the header. */

      /* ---- profile header (slides up from the bottom over 8f): a dark panel, the avatar, name / handle / followers,
         the Follow button. All Coolvetica (U1). Fixed geometry so the cursor's target is known: panel 1130 x 260 at
         (395, 270), avatar 200 px at (435, 300), text column at x 691 (500 wide), button 280 x 100 at (1205, 350), centre
         (1345, 400). */
      #b18-head { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b18-panel { position: absolute; left: 395px; top: 270px; width: 1130px; height: 260px; box-sizing: border-box; border-radius: 36px;
        background: #17171B; border: 1.5px solid rgba(255, 255, 255, 0.10); box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5); }
      #b18-avatar { position: absolute; left: 435px; top: 300px; width: 200px; height: 200px; box-sizing: border-box; border-radius: 50%; overflow: hidden;
        background: #2A2A30; border: 3px solid rgba(255, 255, 255, 0.16); }
      #b18-avatar-mono { position: absolute; left: 0; top: 0; width: 194px; height: 194px; display: flex; align-items: center; justify-content: center;
        font-family: var(--sans); font-size: 84px; line-height: 1; color: #FFFFFF; }
      #b18-avatar-img { position: absolute; left: 0; top: 0; width: 194px; height: 194px; object-fit: cover; display: none; }
      #b18-text { position: absolute; left: 691px; top: 290px; width: 500px; height: 220px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
      #b18-name { font-family: var(--sans); font-size: 78px; line-height: 1.05; color: #FFFFFF; white-space: nowrap; }
      #b18-handle { font-family: var(--sans); font-size: 42px; line-height: 1.1; color: #A9A6A0; white-space: nowrap; }
      #b18-followers { font-family: var(--sans); font-size: 38px; line-height: 1.1; color: #A9A6A0; white-space: nowrap; }
      #b18-btn { position: absolute; left: 1205px; top: 350px; width: 280px; height: 100px; }
      .b18-btn-face { position: absolute; left: 0; top: 0; width: 280px; height: 100px; box-sizing: border-box; border-radius: 24px;
        display: flex; align-items: center; justify-content: center; font-family: var(--sans); font-size: 48px; line-height: 1; white-space: nowrap; }
      #b18-btn-follow { background: #FF2E7E; color: #FFFFFF; }
      #b18-btn-following { background: #3A3A40; color: #FFFFFF; opacity: 0; }

      /* ---- the CTA line: Coolvetica Italic 81 px (doc 54 px @720, U1), white with the soft shadow, the keyword pink;
         appears whole (U2: no type-on) */
      #b18-line { position: absolute; left: 0; top: 640px; width: 1920px; height: 110px; text-align: center;
        font-family: var(--serif); font-style: italic; font-size: 81px; line-height: 110px; color: #FFFFFF; white-space: nowrap;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
      #b18-line .b18-kw { color: #FF2E7E; }

      /* ---- the cursor (a plain arrow pointer), tip at the wrapper's (0, 0) */
      #b18-cursor { position: absolute; left: 0; top: 0; width: 60px; height: 84px; }
      #b18-cursor-svg { position: absolute; left: 0; top: 0; width: 60px; height: 84px; overflow: visible; }

      /* ---- loop: the last 6 frames cross to B1's frame 0 (hyperframes/b01-hook/LOOP_FRAME.json): the same lightbar footage
         (assets/footage/b18_lightbar.mp4 = B1's recipe from source 631.0333 s), media time = local / 30, so local 81 = B1's
         clip frame 6 = B1's frame 0 (measured: mean diff 0.9 / 255); static, full frame, contrast 0.15 as B1. */
      #b18-loop-fade { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
      #b18-loop-v { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- B18 b18-cta v05 (NEW, doc "NEW 1:17.0-1:19.5 CTA end card"; REVISION_v05 "Lane 5" with the CLIENT OVERRIDE U1, U2,
         U4): beat 75f (2.500 s, no voice) + 6f handle each end = 87f. Local time 0 = beat start - 6f (local = CTA frame + 6).
         Hard cut in from B17's GTA VI logo ("now?").
           6-14   profile header (avatar, name, handle, follower count) slides up from the bottom, 8f, expo.out
           12-21  the cursor glides in (power3.out) to the Follow button; 24 (CTA +18 = v04 1:17.6) click: the button turns
                  grey, "Following" (cues: click on CTA frame 18); 30-42 the cursor leaves
           30     Comment "BUG" for the full story (Coolvetica Italic 81 px, "BUG" pink) appears whole (no type-on, U2)
           75-81  the last 6 frames cross (sine.inOut) to B1's frame 0 (LOOP_FRAME.json: the GTA V night police lightbar),
                  the footage playing into it, so the video loops seamlessly; 81-87 tail = B1's frames 0-5 (unflashed)
         Profile data: ONE config object (PROFILE) at the top of the script. Avatar, @handle and follower count are not
         known (REVISION_v05 N3): empty = a neutral monogram and the handle / followers lines hidden. -->
    <div data-hf-id="hf-bsl6" id="root" data-composition-id="b18-cta" data-start="0" data-duration="2.9000000" data-width="1920" data-height="1080">
      <!-- @dark -->
<div id="b18-dark" class="fx-dark" style="z-index: 1"><div id="b18-dark-base" class="clip fx-fill fx-dark__base" data-start="0.0000" data-duration="2.9000"></div><div class="fx-dark__loop" style="opacity: 0.2"><div class="fx-card__bgscale" data-layout-allow-overflow style="width: 1258.56px; height: 707.94px; transform: translate(-144px, -81px) scale(1.7543900000000001)"><video id="b18-dark-loop" class="clip " src="assets/footage/b18_lightbar.mp4" data-start="0.0000" data-duration="2.9000" data-media-start="0.0000" muted playsinline data-color-grading='{"preset":null,"intensity":1,"adjust":{"exposure":-1,"contrast":0,"highlights":0,"shadows":0,"whites":0,"blacks":0,"temperature":0,"tint":0,"vibrance":0,"saturation":0},"effects":{"blur":1}}'></video></div></div><div id="b18-dark-tex" class="clip fx-fill fx-dark__tex" data-start="0.0000" data-duration="2.9000"></div></div>
<!-- /@dark -->

      <div data-hf-id="hf-k2e4" id="b18-head" style="z-index: 2">
        <div data-hf-id="hf-9srw" id="b18-panel" class="clip" data-start="0" data-duration="2.9000" data-track-index="3"></div>
        <div data-hf-id="hf-bs06" id="b18-avatar" class="clip" data-start="0" data-duration="2.9000" data-track-index="4">
          <div data-hf-id="hf-uprj" id="b18-avatar-mono">RC</div>
          <img data-hf-id="hf-vsee" id="b18-avatar-img" alt="">
        </div>
        <div data-hf-id="hf-bcj9" id="b18-text" class="clip" data-start="0" data-duration="2.9000" data-track-index="5">
          <div data-hf-id="hf-maas" id="b18-name">Raw Canvas</div>
          <div data-hf-id="hf-dt7x" id="b18-handle"></div>
          <div data-hf-id="hf-7i6o" id="b18-followers"></div>
        </div>
        <div data-hf-id="hf-xozh" id="b18-btn" class="clip" data-start="0" data-duration="2.9000" data-track-index="6">
          <div data-hf-id="hf-gamr" id="b18-btn-follow" class="b18-btn-face">Follow</div>
          <div data-hf-id="hf-46e9" id="b18-btn-following" class="b18-btn-face">Following</div>
        </div>
      </div>

      <!-- the CTA line appears whole on local 30 (6f after the click) -->
      <div data-hf-id="hf-lbht" id="b18-line" class="clip" data-start="1.0000" data-duration="1.9000" data-track-index="7" style="z-index: 3">Comment <span data-hf-id="hf-mmi2" class="b18-kw">“BUG”</span> for the full story</div>

      <div data-hf-id="hf-8yqu" id="b18-cursor" style="z-index: 4">
        <svg data-hf-id="hf-dnbx" id="b18-cursor-svg" class="clip" data-start="0.4000" data-duration="1.0000" data-track-index="8" viewBox="0 0 60 84" aria-hidden="true">
          <path data-hf-id="hf-k639" d="M3 3 L3 66 L18 52 L29 78 L40 73 L29 48 L50 48 Z" fill="#111111" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
        </svg>
      </div>

      <div data-hf-id="hf-xhsw" id="b18-loop-fade" style="z-index: 10">
        <video data-color-grading="{&quot;preset&quot;:null,&quot;intensity&quot;:1,&quot;adjust&quot;:{&quot;exposure&quot;:0,&quot;contrast&quot;:0.15,&quot;highlights&quot;:0,&quot;shadows&quot;:0,&quot;whites&quot;:0,&quot;blacks&quot;:0,&quot;temperature&quot;:0,&quot;tint&quot;:0,&quot;vibrance&quot;:0,&quot;saturation&quot;:0},&quot;details&quot;:{&quot;vignette&quot;:0,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-thkd" id="b18-loop-v" class="clip" src="assets/footage/b18_lightbar.mp4" data-start="2.5000" data-duration="0.4000" data-media-start="2.5000" data-track-index="9" muted playsinline></video>
      </div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      // ===== PROFILE: the CTA's profile data. Fill in when the client sends it; never invent values. =====
      const PROFILE = {
        name: "Raw Canvas",     // REVISION_v05 N3
        handle: "",             // e.g. "@..."   unknown: the line is hidden while empty
        followers: "",          // e.g. "... followers"   unknown: the line is hidden while empty
        avatar: "",             // an image in assets/ (e.g. "assets/avatar.jpg"); unknown: empty = the neutral monogram
        monogram: "RC",         // initials of the name, shown while avatar is empty
        keyword: "BUG",         // doc: "Comment “BUG” for the full story" (swap in the real keyword / DM automation)
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const L = (n) => n / 30;                        // local frame -> seconds (local frame = CTA frame + 6)
      const at = (f) => L(f) - 0.0001;                 // a hard change shows on frame f

      // ---- profile data -> markup (static, before the timeline is built)
      document.getElementById("b18-name").textContent = PROFILE.name;
      document.getElementById("b18-avatar-mono").textContent = PROFILE.monogram;
      [["b18-handle", PROFILE.handle], ["b18-followers", PROFILE.followers]].forEach(([id, v]) => {
        const el = document.getElementById(id);
        el.textContent = v;
        el.style.display = v ? "block" : "none";
      });
      if (PROFILE.avatar) {
        const img = document.getElementById("b18-avatar-img");
        img.src = PROFILE.avatar;
        img.style.display = "block";
        document.getElementById("b18-avatar-mono").style.display = "none";
      }
      document.querySelector("#b18-line .b18-kw").textContent = "“" + PROFILE.keyword + "”";

      // ---- 6-14: the header slides up from below the frame (8f, expo.out); the head handle holds it out of frame
      gsap.set("#b18-head", { y: 820, force3D: false });
      tl.fromTo("#b18-head", { y: 820 }, { y: 0, duration: L(8), ease: "expo.out", immediateRender: false }, L(6));

      // ---- cursor: in from the bottom right (12-21, power3.out), click on 24 (press 2f, release 3f), out (30-42, power2.in)
      gsap.set("#b18-cursor", { x: 1720, y: 1160, scale: 1, transformOrigin: "0px 0px", force3D: false });
      tl.fromTo("#b18-cursor", { x: 1720, y: 1160 }, { x: 1330, y: 408, duration: L(9), ease: "power3.out", immediateRender: false }, L(12));
      tl.fromTo("#b18-cursor", { scale: 1 }, { scale: 0.86, duration: L(2), ease: "power2.out", immediateRender: false }, L(23));
      tl.fromTo("#b18-cursor", { scale: 0.86 }, { scale: 1, duration: L(3), ease: "power2.out", immediateRender: false }, L(25));
      tl.fromTo("#b18-cursor", { x: 1330, y: 408 }, { x: 1700, y: 1180, duration: L(12), ease: "power2.in", immediateRender: false }, L(30));

      // ---- the button on the click (24 = CTA frame 18): Follow -> Following (grey), a small press 96 -> 100%
      gsap.set("#b18-btn", { scale: 1, transformOrigin: "50% 50%", force3D: false });
      tl.fromTo("#b18-btn-follow", { opacity: 1 }, { opacity: 0, duration: L(0.5), ease: "steps(1)", immediateRender: false }, at(24) - L(0.5));
      tl.fromTo("#b18-btn-following", { opacity: 0 }, { opacity: 1, duration: L(0.5), ease: "steps(1)", immediateRender: false }, at(24) - L(0.5));
      tl.fromTo("#b18-btn", { scale: 0.96 }, { scale: 1, duration: L(5), ease: "expo.out", immediateRender: false }, L(24));

      // ---- 75-81: cross to B1's frame 0 (the lightbar footage arrives on B1's f0 at local 81), sine.inOut
      tl.fromTo("#b18-loop-fade", { opacity: 0 }, { opacity: 1, duration: L(6), ease: "sine.inOut", immediateRender: false }, L(75));

      tl.set({}, {}, L(87));
      window.__timelines["b18-cta"] = tl;
    </script>
  </body>
</html>
