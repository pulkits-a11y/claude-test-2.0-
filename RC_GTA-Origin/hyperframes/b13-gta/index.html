      <!-- ===== v05 (doc 0:54.5-0:55.5 "cut the silence to 0.4 s ... then a reverse cymbal into the box art. 55.5 box art: card

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;   // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets from words.json (v02, comp_t snapped to the nearest frame, local):
      // Until 7, finally 16, in 33, November 36, 1997 51, it 86, ships 88, with 97, a 104, new 107, name 111,
      // Grand 130, Theft 136, Auto 146 (voice ends 161; then the 43f title-hold room tone).
      const W = { in: 33, November: 36, y1997: 51, it: 86, Grand: 130 };
      const CUT_L6 = W.it;        // X3 is centred on this cut (beat 80)
      const CUT_BOX = 161;        // v05: beat 155 = the end of "Auto." (voice ends): hard cut to the box-art card insert for the
                                  // 0.386 s tail (beat 155-166 + the 6f tail handle)

      // ---- captions (v03 notes 11, 16, 17): every lockup word hard-cuts in on its frame; starred words (the title) pop +
      //      blur in (kit lockupsWire: full opacity on the onset frame, blur 20 px / 92% settling in 6f, easeOutExpo)
      T.lockupsWire(tl);

      // ---- T3 year card: "In" on "in", "Nov" on "November", digits roll on "1997" (S12 on the first digit's move).
      //      Held card: slow push 100 -> 106% of the card content (easeInOutSine) from the head handle to the cut (rule D).
      gsap.set(['#b13-t3-in', '#b13-t3-month'], { opacity: 0 });
      S.hard(tl, '#b13-t3-in', { opacity: 0 }, { opacity: 1 }, f(W.in));
      S.hard(tl, '#b13-t3-month', { opacity: 0 }, { opacity: 1 }, f(W.November));
      T.yearCard(tl, '#b13-t3', f(W.y1997), { pushFrom: 0, pushUntil: f(CUT_L6), pushTo: 1.04 });   // last digit lands local 65 (beat 59); v03: v01's 104% push, eased
      // v04 (note 15 "glow flicker"): the year line "Nov 1997" flickers like a neon tube catching while the digits roll in
      // on "1997," (local 51, 10f of stepped flare / on / half / off, seed 15), then settles (4f easeOutCubic) to the steady
      // soft glow. Before that, "Nov" (cut in on "November", local 36) already shows the steady glow (before: 'steady').
      T.glowFlicker(tl, '#b13-t3 .rc-t3__year', f(W.y1997), { seed: 15, before: 'steady' });

      // ---- X3 white flash, centred on the cut into L6 (ramp 83-86 easeInQuad, 100% on 86, fade 86-91 easeOutQuad). Silent.
      X.flash(tl, '#b13-x3', f(CUT_L6));

      // ---- the full-frame R13.1 (v03 note 13: no punch-in): v01's held-shot push 100 -> 104% from the cut to the cut out,
      //      eased (easeInOutSine)
      C.push(tl, '#b13-cam', f(CUT_L6), { until: f(CUT_BOX), from: 1.0, to: 1.04 });

      // ---- v04 (note 17): the 1997 logo pops + blurs in on "Grand" (local 130 = beat 124 = cue type_on) and holds to the cut
      T.wordPops(tl, '#b13-logo', null);

      // keep the timeline as long as the composition (the tail handle is transparent)
      tl.set({}, {}, f(178));
      window.__timelines["b13-gta"] = tl;
    </script>
