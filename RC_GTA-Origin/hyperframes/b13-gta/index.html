         32     38     "Nov" hard cut in on "November"

         83-90  89-96  X3 white flash centred on the cut at beat 85 (local 91, 100% on 91-92)
         85     91     cut to L6: R13.1 framed at 62% (4:3 frame) over its own 50 px blurred, 40% darker copy; push 100->104% to beat 190
         85     91     T1 "it ships with" (white + soft shadow) on "it"
         105    111    T1 "a new name:" on "a"
         132    138    T6 GRAND / THEFT / AUTO types on BEHIND the frame, one letter every 2f (14 letters, last beat 158 / local 164) = cue type_on (S13)
         158-190       title holds 32f (>= 1 s) ... hard cut at beat 190 (local 196)
         190-214 196-220  TS only: GTA 1 big-box unboxing R13.2 in the L2 band (tesseract_shots.json); this composition is transparent
         214-220 220-226  tail handle: transparent (closing state = Tesseract footage) -->

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions;
      const f = (n) => n / 30;   // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets from words.json (comp_t snapped to the nearest frame, local):
      // Until 7, finally 16, in 34, November 38, 1997 54, it 91, ships 94, with 103, a 111, new 113, name 118,
      // Grand 138, Theft 144, Auto 155 (voice ends 171).
      const W = { in: 34, November: 38, y1997: 54, it: 91, Grand: 138 };
      const CUT_L6 = W.it;        // X3 is centred on this cut (beat 85)
      const CUT_TS = 196;         // beat 190: hard cut to the Tesseract unboxing

      // ---- T3 year card: "In" on "in", "Nov" on "November", digits roll on "1997" (S12 on the first digit's move).
      //      Held shot: slow push 100 -> 104% of the card content from the head handle to the cut (rule 7).
      gsap.set(['#b13-t3-in', '#b13-t3-month'], { opacity: 0 });
      S.hard(tl, '#b13-t3-in', { opacity: 0 }, { opacity: 1 }, f(W.in));
      S.hard(tl, '#b13-t3-month', { opacity: 0 }, { opacity: 1 }, f(W.November));
      T.yearCard(tl, '#b13-t3', f(W.y1997), { pushFrom: 0, pushUntil: f(CUT_L6) });   // last digit lands local 68 (beat 62)

      // ---- X3 white flash, centred on the cut into L6 (ramp 89-91, 100% 91-92, fade 92-96). Silent.
      X.flash(tl, '#b13-x3', f(CUT_L6));

      // ---- L6: held shot pushes 100 -> 104% (back copy, T6 and frame together) across the shot.
      S.push(tl, '#b13-l6', f(CUT_L6), { until: f(CUT_TS) });

      // ---- T6 GRAND / THEFT / AUTO behind the frame from "Grand": one letter every 2f, no fades (S13 on the first letter).
      //      Last letter local 164 (beat 158); holds 32f (>= 1 s) to the hard cut at local 196 (beat 190).
      T.giantType(tl, '#b13-t6', f(W.Grand));

      // keep the timeline as long as the composition (the tail handle is transparent)
      tl.set({}, {}, f(226));
      window.__timelines["b13-gta"] = tl;
    </script>
