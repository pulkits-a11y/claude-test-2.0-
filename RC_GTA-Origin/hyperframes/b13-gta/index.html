    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, S = RCK.screens, X = RCK.transitions, C = RCK.cam, FX = RCK.fx;
      const f = (n) => n / 30;   // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets from words.json (v02, comp_t snapped to the nearest frame, local):
      // Until 7, finally 16, in 33, November 36, 1997 51, it 86, ships 88, with 97, a 104, new 107, name 111,
      // Grand 130, Theft 136, Auto 146 (voice ends 161; then the 43f title-hold room tone).
      const W = { in: 33, November: 36, y1997: 51, it: 86, Grand: 130 };
      const CUT_L6 = W.it;        // X3 is centred on this cut (beat 80)
      const CUT_BOX = 161;        // v05: beat 155 = the end of "Auto." (voice ends): hard cut to the box-art card insert for the
                                  // 0.386 s tail (beat 155-166 + the 6f tail handle)

      // ---- captions (v05, U2): words appear on their frames, white (no starred words in B13: the logo slam is the moment)
      T.lockupsWire(tl);

      // ---- the tear-off calendar (kit): MAR 1995 -> NOV 1997 on "in" (local 33 = beat 27), the client's glow flicker on
      //      NOV 1997 from "November" (local 36 = beat 30)
      FX.calendarTear(tl, '#b13-cal', f(W.in), { from: 'MAR 1995', to: 'NOV 1997', frames: 12, size: 300, seed: 15 });
      T.glowFlicker(tl, '#b13-cal .fx-cal__text--to', f(W.November), { frames: 10, seed: 15 });
      // the MAR 1995 page (and the binding stub) cover NOV 1997 until the tear on purpose (the kit does not mark them)
      document.querySelectorAll('#b13-cal .fx-cal__page--from, #b13-cal .fx-cal__stub').forEach((el) => el.setAttribute('data-layout-allow-occlusion', ''));

      // ---- X3 white flash, centred on the cut into L6 (ramp 83-86 easeInQuad, 100% on 86, fade 86-91 easeOutQuad). Silent.
      X.flash(tl, '#b13-x3', f(CUT_L6));

      // ---- the full-frame R9.4 gameplay: the held-shot push 100 -> 104% from the cut to the box art, eased (easeInOutSine)
      C.push(tl, '#b13-cam', f(CUT_L6), { until: f(CUT_BOX), from: 1.0, to: 1.04 });

      // ---- v05: the logo slam on "Grand" (local 130 = beat 124; impact local 134), the same kit call as B1 / B17:
      //      B1's exact call (lane 1), with the doc's B13 values from: 160, shakePx 12, shakeF 8. B1 adds a 1.2% overscan on
      //      its camera while it shakes; here the camera's own push is already at ~102.9% on the hit (local 134-142: >= 27 px
      //      each side, >= 15 px top / bottom, > the 12 px shake), so no frame edge shows and no extra scale is set (a set on
      //      the pushed wrapper would fight the push tween).
      FX.logoSlam(tl, '#b13-logo-slam', f(W.Grand), { from: 160, flash: '#b13-flash', star: '#b13-star', shakeTarget: '#b13-cam', shakePx: 12, shakeF: 8 });

      // ---- the box-art card insert (beat 155 -> the tail-handle end): push 100 -> 104%, eased
      C.push(tl, '#b13-card .fx-card__cam', f(CUT_BOX), { until: f(178), from: 1.0, to: 1.04 });

      // keep the timeline as long as the composition
      tl.set({}, {}, f(178));
      window.__timelines["b13-gta"] = tl;
    </script>
