    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* DMA section (note 2): full-frame B-roll, cover-fitted (4:3 archive cropped to 16:9 by the fit, never stretched) */
      .b03-fill { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
      /* Kinetic type (note 2 "unique layouts ... each word popping up as he says it"): one full-frame layer per group of max
         2 words (RCK.type.captionPlanV2 groups), each word placed on its own; Coolvetica, Coolvetica Italic for "DMA Design"
         and "Lemmings". White on footage with the kit's soft shadow plus a wider one scaled to the 100-300 px type (still a
         soft shadow: no outline, no box). Boxes: line-height 1, so baseline = top + 0.867 em, cap top = top + 0.195 em. */
      .b03-kt { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; color: var(--white);
        text-shadow: var(--text-shadow), 0 8px 48px rgba(0, 0, 0, 0.45); }
      .b03-kw { position: absolute; white-space: nowrap; font-family: var(--sans); font-weight: 400; line-height: 1; }
      .b03-kw--it { font-family: var(--serif); font-style: italic; }
      /* v03 (note 2): the DMA Design logo, centred. The PNG (456 x 687) is shown at 460 px high (x 0.6696, never upscaled):
         ink box (figure y 9-518, lettering y 596-677, x 9-447) centred on (960, 540). A soft drop shadow, as the captions'
         text shadow scaled up, keeps the white lettering and outline readable over the bright 1990s office. */
      #b03-logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b03-logo-img { position: absolute; left: 807.3px; top: 310px; width: 305.4px; height: 460px; object-fit: contain;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.55)); }
      /* group 2 "the studio": a centred baseline pair, small + giant, baseline y 700 */
      #b03-kw-the    { left: 526px; top: 613px; font-size: 100px; }   /* baseline 700, x 526-672 */
      #b03-kw-studio { left: 700px; top: 475px; font-size: 260px; }   /* baseline 700, x 700-1395 */
      /* group 3 "behind Lemmings,": small over giant, top-left (above the walking lemmings, left of the floater) */
      #b03-kw-behind   { left: 104px; top: 135px; font-size: 110px; } /* baseline 230 */
      #b03-kw-lemmings { left: 96px;  top: 262px; font-size: 240px; } /* baseline 470, descender 526, x 96-1145 */
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)

      // ---- ZOOM-THROUGH IN (note 1; B2 played the out half up to this boundary): the card is at 130% + 16 px blur on the
      // boundary (local 6) and through the head handle, settling to 100% sharp over 9f, easeOutExpo (lands 15).
      C.zoomThroughIn(tl, '#b03-zt', L(6));
      // ---- T3: the digits roll up from the boundary (6, 8, 10, 12; 8f power3.out each, last lands 20) so the year arrives
      // while the zoom settles and holds > 1 s before "Dundee," (plan: hold >= 1 s); "In" is part of the card from the start.
      // v03 (note 13): v01's slow push on the card content 100 -> 104% (easeInOutSine) from the boundary to the cut (61).
      T.yearCard(tl, '#b03-t3', L(6), { pushFrom: L(6), pushUntil: L(61), pushTo: 1.04 });

      // ---- kinetic type (DMA section): one pop preset per group, every word on its own onset frame (1f lead)
      //   2 "the studio": rises 50 px from 90%, 5f easeOutExpo (the 135, studio 139)
      T.captionPops(tl, '#b03-kt-2', { pop: { t1: { frames: 5, lead: 1, scale: 0.9, rise: 50, ease: 'expo.out' } } });
      //   3 "behind Lemmings,": pops from 30% with an overshoot, 7f easeOutBack (behind 148, Lemmings, 157)
      T.captionPops(tl, '#b03-kt-3', { pop: { t1: { frames: 7, lead: 1, scale: 0.3, rise: 0, ease: 'back.out(1.7)' } } });
      // the left-aligned words scale about their left edge (the kit pops about 50% 75%), so the 140% slam and the back.out
      // overshoot grow to the right and never cross the 96 px title-safe margin
      gsap.set('#b03-kw-behind .rc-w, #b03-kw-lemmings .rc-w', { transformOrigin: '0% 75%' });
      // ---- every other caption (T4 group with its 3f exit; T1 "starts / a / new game.")
      T.captionPops(tl);

      // ---- DMA section camera, v03 (note 13: no random zooms): the v02 punch-ins on the cuts and the per-shot pushes are
      // gone; the cuts stay. Only v01's one slow push across the section (the v01 card stack pushed 100 -> 104% the same
      // way): 100 -> 104%, easeInOutSine, local 103 -> 175.
      C.push(tl, '#b03-dma-cam', L(103), { until: L(175), from: 1.0, to: 1.04 });

      tl.set({}, {}, L(215));
      window.__timelines["b03-dundee"] = tl;
    </script>
