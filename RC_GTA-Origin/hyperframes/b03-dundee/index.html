    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, C = RCK.cam, FX = RCK.fx;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)

      // ---- B2 -> B3: the end of B2's pink pixel-glitch cut on local 6-7 (mode 'cut', split 9 px as B2's)
      FX.glitch(tl, '#b03-gl', L(1), { mode: 'cut', frames: 7, split: 9 });

      // ---- captions (U2, kit v05): every .rc-lk lockup (prep/gen_captions.cjs); words appear on their own frame (white);
      // the chosen key words ("Dundee,", "Lemmings,") pop + blur in.
      T.lockupsWire(tl);
      // ---- "1995" (hero 420, U7; the client's v04 glow flicker): appears on the spoken "1995" (14) and catches like a
      // neon tube (10 seeded one-frame steps), then settles (4f) to the steady soft glow.
      T.glowFlicker(tl, '#b03-lk-yr-key .rc-lk__row--hero .rc-lw', L(14));

      // ---- [DEPTH] Dundee: plate and hill cut-out push together 100 -> 108% (doc 12.0-13.5), sine.inOut, from the cut on
      // "Dundee," (41) to the cut on "DMA" (83). Origin (960, 356) just under the Law's top (y ~298), so the ridge barely
      // rises while the town opens up: the hilltop keeps covering ~1/3 of "nde" (centre origin: "d" eaten by the end).
      const DUN = { until: L(83), from: 1.0, to: 1.08, origin: '960px 356px' };
      C.push(tl, '#b03-dun-cam', L(41), DUN);
      C.push(tl, '#b03-dun-fgcam', L(41), DUN);
      // ---- location tag (doc 12.0-13.5): the UK outline zooms x3 toward the pink Dundee pin over 12f from the cut (41)
      FX.locationTag(tl, '#b03-loc', L(41));

      // ---- DMA logo pop (doc 13.5-14.5, U11): 140% on its first frame -> 95% (3f, power2.out) -> 100% (2f, sine.inOut).
      gsap.set('#b03-logo-pop', { scale: 1.4, transformOrigin: '50% 50%', force3D: false });
      tl.fromTo('#b03-logo-pop', { scale: 1.4 }, { scale: 0.95, duration: L(3), ease: 'power2.out', immediateRender: false }, L(83));
      tl.fromTo('#b03-logo-pop', { scale: 0.95 }, { scale: 1.0, duration: L(2), ease: 'sine.inOut', immediateRender: false }, L(86));

      // ---- DMA section camera (as v03/v04): one slow push 100 -> 104%, easeInOutSine, local 83 -> 155.
      C.push(tl, '#b03-dma-cam', L(83), { until: L(155), from: 1.0, to: 1.04 });
      // ---- "Lemmings," (doc 15.0-15.5): a yellow hand-drawn circle round the front walker, drawn on 137-146; the tracker
      // follows him at his measured walking speed (790 -> 606 px over 137 -> 155 = -10.2 px/f), one hard step per frame.
      FX.annotate(tl, '#b03-ann', L(137), { type: 'circle', rect: [780, 612, 135, 273], pad: 16 });
      gsap.set('#b03-lemtrack', { x: 0, force3D: false });
      for (let f = 138; f <= 155; f++) {
        const x0 = Math.round(-10.2 * (f - 1 - 137) * 10) / 10, x1 = Math.round(-10.2 * (f - 137) * 10) / 10;
        tl.fromTo('#b03-lemtrack', { x: x0 }, { x: x1, duration: L(0.5), ease: 'steps(1)', immediateRender: false }, L(f) - L(0.5));
      }

      // ---- card insert push (doc 15.5-17.0): 100 -> 106%, sine.inOut, from the cut on "starts" through the tail.
      C.push(tl, '#b03-card .fx-card__cam', L(155), { until: L(195), from: 1.0, to: 1.06 });

      tl.set({}, {}, L(195));
      window.__timelines["b03-dundee"] = tl;
    </script>
