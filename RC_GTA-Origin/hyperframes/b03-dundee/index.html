      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // words.json comp_t
      const W = { its: 0.933, y1995: 1.175, Dundee: 2.124, Scotland: 2.666, DMA: 3.638, the: 4.763 };

      // ---- X5 in half: slats shut until the boundary (local 6 = beat f0), rotate open over 8f, gone on local 14
      X.blindsOpen(tl, '#b03-x5', L(6));

      // ---- T3 year card: "In" appears (hard cut) on "It's" (local 28); digits roll up 40 px from their masks on "1995"
      // (local 35, 37, 39, 41; 8f each, ease out; last lands local 49); slow push 100 -> 104% on the card content across
      // the whole card (head handle to the hard cut out at local 64).
      const tIn = document.querySelector('#b03-t3 .rc-t3__in');
      gsap.set(tIn, { opacity: 0 });
      S.hard(tl, tIn, { opacity: 0 }, { opacity: 1 }, W.its);
      T.yearCard(tl, '#b03-t3', W.y1995, { pushFrom: 0, pushUntil: L(64) });

      // ---- T4 over the Dundee band: "Dundee," on "Dundee," (local 64), "Scotland." on "Scotland." (local 80);
      // each fades in over 4f while drifting 12 px up; both leave together with a 4f fade ending local 109 (beat f103).
      T.spreadWords(tl, '#b03-t4', W.Dundee, { times: [W.Dundee, W.Scotland], outAt: L(105) });

      // ---- L12 (hard cut on "DMA", local 109): cards drop in one at a time (8f each, ease out: local 109, 117, 125),
      // slow parallax drift to the cut, and the held stack pushes 100 -> 104% (style rule 7); the T8 title stays still.
      S.cardsDrop(tl, '#b03-cards', L(109), { durF: 8 });
      S.cardsDrift(tl, '#b03-cards', L(109), { until: L(186) });
      S.push(tl, '#b03-cards', L(109), { until: L(186), origin: '960px 390px' });

      // ---- T8: name (+ underline) fades in over 6f on "DMA" (local 109); role fades to its 60% over 6f on "the studio"
      // (local 143, STORYBOARD B3 interp: synced to the spoken words).
      // LOCAL FIX: RCK.type.nameIn fades name and role together at one time (no per-part time), and calling it on a
      // wrapper that holds only one part makes GSAP warn "target not found" for the empty other part. Same values as
      // nameIn (linear, 6f, name 0 -> 1, role 0 -> 0.6), each part on its own word.
      const t8Name = document.querySelector('#b03-t8 .rc-t8__name'), t8Role = document.querySelector('#b03-t8 .rc-t8__role');
      gsap.set(t8Name, { opacity: 0 }); gsap.set(t8Role, { opacity: 0 });
      tl.fromTo(t8Name, { opacity: 0 }, { opacity: 1, duration: L(6), ease: 'none', immediateRender: false }, L(109));
      tl.fromTo(t8Role, { opacity: 0 }, { opacity: 0.6, duration: L(6), ease: 'none', immediateRender: false }, T.snap(W.the));

      // ---- the Lemming walks the underline right -> left (its direction in R3.6), linear, from the name's entrance to the
      // cut (local 109 -> 186), at its own speed in the source (9.1546 px/frame at 1920 scale x 20% = 1.8309 px/frame),
      // so its feet do not skate: 141 px over 77 frames, from the underline's right end.
      // LOCAL FIX (kit T8 markup puts the Lemming clip inside the timed T8 element, which lint rejects as
      // video_nested_in_timed_element): the walker is a root-level wrapper placed on the underline's measured span.
      // LEM = the underline in frame px: Instrument Serif ITALIC 72 px "DMA Design" (kit: T8 names italic) is 303.12 px
      // wide (font advance), centred on x 960 -> left 808.44, right 1111.56; top 819.44 (T8 block centred at y 800).
      // Hard-coded so the build never depends on font-load timing; re-measure if the name, its size or position changes.
      // Box x = lemming centre - 24 (crop centre 120 x 20%); box top = underline top - 52.4 (feet at crop y 262 x 20%).
      const LEM = { x0: 1100 - 24, x1: 1100 - 24 - 1.8309 * 77, top: 819.44 - 52.4 };
      gsap.set('#b03-lem-walk', { x: LEM.x0, y: LEM.top });
      tl.fromTo('#b03-lem-walk', { opacity: 0 }, { opacity: 1, duration: L(6), ease: 'none', immediateRender: false }, L(109));
      tl.fromTo('#b03-lem-walk', { x: LEM.x0 }, { x: LEM.x1, duration: L(186 - 109), ease: 'none', immediateRender: false }, L(109));

      tl.set({}, {}, L(227));
      window.__timelines["b03-dundee"] = tl;
    </script>
  </body>
</html>
