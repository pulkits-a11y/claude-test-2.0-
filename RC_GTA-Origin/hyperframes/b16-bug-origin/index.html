    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions, FX = RCK.fx;
      const f = (n) => n / 30;   // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets from words.json (v05 VO, comp_t snapped to the nearest frame, local):
      // So 7, that's 8, why 18, you're 20, always 28, running 35, The 56, whole 61, series 70, started 80, with 92,
      // a 100, bug 101 (voice ends 112).
      const W = { The: 56, bug: 101 };
      const ERR_POP = 47;        // beat 41: the error window slams in (the X7 dissolve has revealed the footage on 46)
      const ERR_CASCADE = 53;    // beat 47: ten copies cascade (B2: 6 f after the pop)
      const REWIND_END = 34;     // beat 28: the tape stops; X7 runs beat 28..40

      // ---- tracking lines: a new noise pattern, position and strength on every frame of the rewind (seeded, so every
      //      frame is a pure function of the timeline; one value per frame = cuts, not moves). Band A rolls up through the
      //      frame, band B rolls down, faster.
      (function trackingLines() {
        // Both bands stay clear of the T1 caption line (box y 592-648): band A (thick) rolls up through the lower third
        // (band + glow inside y 651-1140), band B (thin) rolls down through the upper half (inside y 6-563).
        const rnd = RCK.rng(1616);
        const at = (n) => Math.max(0, (n - 0.5) / 30);   // a set strictly between frames n-1 and n
        for (let n = 0; n < REWIND_END; n++) {
          const ya = 1100 - ((n * 37) % 410) + Math.round((rnd() - 0.5) * 8);
          const ha = 70 + Math.round(rnd() * 40);
          const yb = 30 + ((n * 61 + 100) % 480) + Math.round((rnd() - 0.5) * 8);
          const hb = 14 + Math.round(rnd() * 16);
          const xa = -Math.round(rnd() * 60), xb = -Math.round(rnd() * 60);
          tl.set('#b16-trk-a', { attr: { transform: 'translate(0 ' + ya + ')' }, opacity: 0.6 + rnd() * 0.35 }, at(n));
          tl.set('#b16-trk-a-noise', { attr: { height: ha, x: xa } }, at(n));
          tl.set('#b16-trk-a-glow', { attr: { y: -36, height: ha + 72 } }, at(n));
          tl.set('#b16-trk-ta', { attr: { seed: 1 + n * 7 } }, at(n));
          tl.set('#b16-trk-b', { attr: { transform: 'translate(0 ' + yb + ')' }, opacity: 0.5 + rnd() * 0.4 }, at(n));
          tl.set('#b16-trk-b-noise', { attr: { height: hb, x: xb } }, at(n));
          tl.set('#b16-trk-b-glow', { attr: { y: -20, height: hb + 40 } }, at(n));
          tl.set('#b16-trk-tb', { attr: { seed: 3 + n * 11 } }, at(n));
        }
      })();

      // ---- X7: the rewind picture dissolves to black through the light leak over 12f (beat 28..40; picture fades
      //      easeInCubic, leak sine). Silent.
      X.leakDissolve(tl, '#b16-x7', f(REWIND_END), { frames: 12, from: '#b16-rewind-wrap' });

      // ---- captions (v05): lockup words appear on their frames; the starred hero "bug." pops + blurs in (U2)
      T.lockupsWire(tl);
      // "bug.": the kit RGB split, 6 px narrowing to 2 px over 6 f, then never settles (+/- 1 px every 2 f) to the clip end
      FX.rgbSplit(tl, '#b16-bug-1 .rc-lk__row--hero .rc-lw', f(W.bug), { px: 6, settle: 2 });

      // ---- the Win95 error windows: the same calls and values as B2 (callback): pop, cascade, snap shut on "bug.", flash
      FX.errorWindow('#b16-err', { scale: 1.8 });
      FX.errorPop(tl, '#b16-err', f(ERR_POP));
      FX.errorCascade(tl, '#b16-err', f(ERR_CASCADE), { count: 10, dx: 36, dy: 27, stepF: 2 });
      const shut = FX.errorSnapShut(tl, '#b16-err', f(W.bug), { frames: 3, stepF: 0.2 });   // gone on local 106
      FX.flash(tl, '#b16-flash', shut, { opacity: 1 });                                       // 1 frame, local 106

      tl.set({}, {}, f(125));
      window.__timelines["b16-bug-origin"] = tl;
    </script>
  </body>
</html>
