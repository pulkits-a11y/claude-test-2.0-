    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* camera = the held CRT shot (plate + screen + tear + error box): pushed 100 -> 108% after the X6 lands (sine.inOut),
         then zooms through into B3 (x1.4 + blur, expo.in, the last 5 frames). #b02-key (nested) = the keyword punches. */
      #b02-cam, #b02-key { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .b02-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      /* L8 plate = R3.7 (SUBSTITUTE for R3.9, see BEAT_NOTES): the 1440 x 1080 4:3 picture, rotated +6.5 deg (levels the
         monitor; the BBC corner logo leaves the frame) and scaled 149.97%, so the CRT glass lands on the quad
         TL (286.6, 196.4) TR (838.2, 217.7) BR (818.6, 601.9) BL (296.7, 624.0), centre (560, 410), ~537 x 406 px.
         The screen boxes are corner-pinned onto that quad (RCK.transitions.zoomFit, corners). The GTA 6 box is laid out
         at 3.5754x (1920 x 1452 layout px), its 16:9 band 1920 x 1080 at layout y 186, so at the X6 start ('fill' scale)
         the band covers the frame; the hand-off copy (#b02-g6-hand) shows the straight picture on the first frame. */
      #b02-plate-fit { position: absolute; left: 0; top: 0; width: 1440px; height: 1080px; transform-origin: 0 0;
        transform: matrix(1.4903578, 0.1698048, -0.1698048, 1.4903578, 5.0419, -459.9779); }
      #b02-plate { position: absolute; left: 0; top: 0; width: 1440px; height: 1080px; }
      #b02-lbx { position: absolute; left: 0; top: 0; width: 1920px; height: 1452px; background: var(--ink-black); }
      #b02-band { position: absolute; left: 0; top: 186px; width: 1920px; height: 1080px; overflow: hidden; }
      #b02-band-push { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b02-band-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      /* after the cut on "1995": GTA 1 fills the whole 4:3 screen (box 537 x 406, corner-pinned at 1x; it never zooms).
         The R9.1 clip is itself a 4:3 crop (536:402:260:53, the uploader's watermark cropped out per plan Rule 5), so
         cover fills the screen with 0.8% overscan; its CRT fringe is 50 / 541.3 px = 0.0924 (kit crtGrading, 4:3). */
      #b02-g1 { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      /* X4 region = the screen picture only (plan: "X4 tear on the CRT picture only"): box space of the pinned screen */
      #b02-x4 { left: 0; top: 0; width: 537px; height: 406px; }
      /* L8 flicker (97-100%) kept alive on the frozen torn picture: an ink-black veil of 0-3% over the screen region
         (a solid overlay, never a filter on footage); before the freeze the flicker is the treatment's exposure. */
      #b02-flick { position: absolute; left: 0; top: 0; width: 537px; height: 406px; background: var(--ink-black); opacity: 0; pointer-events: none; }
      /* error box: centred on the screen (x 560), over its lower half, above the caption band (T1/T7 y 592-648) */
      #b02-err { left: 240px; top: 395px; }
      /* hand-off: the straight full-frame GTA 6 picture for the X6's first frame (= B1's last frame), plus B1's push */
      #b02-hand { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b02-g6-hand { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens, C = RCK.cam;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      const STILL = false;                           // true only in the throwaway copy that captures the X4 still
      // words.json comp_t (v02)
      const W = { broke: 3.381, bug: 4.894 };
      // CRT glass on the R3.7 plate (frame px, after the plate transform), TL TR BR BL; and the 16:9 band inside it
      const SCREENQ = [[286.6, 196.4], [838.2, 217.7], [818.6, 601.9], [296.7, 624.0]];
      const BANDQ = [[287.9, 254.1], [835.5, 269.3], [821.0, 555.0], [295.5, 572.0]];
      const RES = 1920 / 537;                        // GTA 6 box laid out so its band is exactly 1920 x 1080

      // ---- captions (rule A): every .rc-cap, each word pops on its own onset; "saved it." exits 172-175 (3f, power2.in)
      T.captionPops(tl);

      // ---- X6 OUT (local 6-14): world 'fill' -> 100% about the screen, log-space ease out, motion blur on media
      X.zoomFit('#b02-screen', { corners: SCREENQ }, { res: RES });
      // GTA 1 picture and the X4/flicker region: the same quad, box 537 x 406 at 1x (STILL copy: unwarped at 0,0 for the X4 still)
      if (STILL) gsap.set('#b02-g1box', { position: 'absolute', left: 0, top: 0, width: 537, height: 406 });
      else X.zoomFit('#b02-g1box', { corners: SCREENQ }, { res: 1 });
      X.zoomFit('#b02-pin', { corners: SCREENQ }, { res: 1 });
      // 'fill' = the exact cover scale of the band (~3.7x) instead of 600% (the real CRT glass is ~537 px wide, not 320)
      X.zoom(tl, '#b02-world', L(6), { screen: { corners: BANDQ }, dir: 'out', scale: 'fill', handoff: '#b02-g6-hand',
        blurMedia: '#b02-plate, #b02-g6-crt, #b02-g6-clean' });
      // clean copy fades 1 -> 0 over the zoom's last frames (local 9 -> 14, easeInCubic = a fade out), revealing the CRT look
      tl.fromTo('#b02-g6-clean', { opacity: 1 }, { opacity: 0, duration: L(5), ease: 'power2.in', immediateRender: false }, L(9));
      // B1's held-shot push finishes inside the picture: B1 = 1 + 0.08 sineInOut((m - 61) / 79) from its local 61 to 140, m =
      // this local + 134. Here local 0 -> 6 is the last 6 frames of that same easeInOutSine curve (a function ease = its
      // tail), so the head handle matches B1's last frames and the boundary frame is B1's 108%; held at 108% after.
      const SIO = (p) => (1 - Math.cos(Math.PI * p)) / 2, P0 = 73 / 79, S0 = 1 + 0.08 * SIO(P0);
      const b1Tail = (q) => (SIO(P0 + q * (1 - P0)) - SIO(P0)) / (1 - SIO(P0));
      gsap.set('#b02-band-push, #b02-hand', { scale: S0, transformOrigin: '50% 50%' });
      tl.fromTo('#b02-band-push, #b02-hand', { scale: S0 }, { scale: 1.08, duration: L(6), ease: b1Tail, immediateRender: false }, 0);

      // ---- held CRT shot (rule D): push 100 -> 108% from the landing (local 14) to local 169, easeInOutSine, towards the
      // screen centre (560, 410); then the zoom-through out (below) continues from 108% on the same wrapper and origin.
      if (!STILL) C.push(tl, '#b02-cam', L(14), { until: L(169), from: 1, to: 1.08, origin: '560px 410px' });

      // ---- L8 brightness flicker 97-100% (one seeded value per frame) on the live CRT picture until the tear
      M.crtFlicker(tl, '#b02-g6-crt', L(6), { until: L(30), seed: 97 });
      M.crtFlicker(tl, '#b02-g1', L(30), { until: L(101), seed: 98 });

      // ---- X4 on "broke." (local 101): 8f tear of the CRT picture only, then holds the torn frame (freeze)
      if (!STILL) X.tear(tl, '#b02-x4', L(101), { frames: 8, end: 'hold', seed: 101 });
      // flicker continues on the frozen picture: ink veil 0-3% (= brightness 100-97%), seeded, one value per frame (cuts)
      (function () {
        const rnd = RCK.rng(99);
        for (let k = 101; k < 181; k++) {
          const b = k === 101 ? 1 : 0.97 + 0.03 * rnd();
          tl.set('#b02-flick', { opacity: Number((1 - b).toFixed(4)) }, Math.max(0, k / 30 - 1e-4));
        }
      })();

      // ---- error box: built once; its clip start (local 109) is the hard pop
      M.errorBoxInit('#b02-err');

      // ---- keyword punches (rule D) on the nested wrapper, about the screen centre: "broke." (101, with the tear) and
      // "bug" (147): 100 -> 106% in 3f (expo.out, from 1f before the onset), back over 9f (sine.inOut); 46f apart.
      if (!STILL) {
        C.keyPunch(tl, '#b02-key', W.broke, { origin: '560px 410px' });
        C.keyPunch(tl, '#b02-key', W.bug, { origin: '560px 410px' });
      }

      // ---- ZOOM-THROUGH OUT (note 1: replaces the X5 slat close), split at the B2/B3 boundary (local 175 = B3's f0): the
      // camera scales x1.4 (108% -> 151.2%) + 16 px blur over local 169-174, easeInExpo, peak on 174 (the last frame of
      // the beat), held through the tail handle. Blur: the R3.7 plate through its media-treatment blur control (footage is
      // never CSS-filtered); the X4 canvas region and the error box (DOM) through a CSS blur. B3 arrives from 130% + blur.
      if (!STILL) C.zoomThroughOut(tl, '#b02-cam', L(175), { blurMedia: '#b02-plate', blurDom: '#b02-pin, #b02-err' });

      tl.set({}, {}, L(181));
      window.__timelines["b02-bug"] = tl;
    </script>
