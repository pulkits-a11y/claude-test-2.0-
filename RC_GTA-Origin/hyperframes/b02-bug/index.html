      window.__timelines = window.__timelines || {};

      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, S = RCK.screens, C = RCK.cam, FX = RCK.fx;
      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      // CRT glass on the R3.7 plate (frame px, after the plate transform), TL TR BR BL; and the 16:9 band inside it (v04)
      const SCREENQ = [[286.6, 196.4], [838.2, 217.7], [818.6, 601.9], [296.7, 624.0]];
      const BANDQ = [[287.9, 254.1], [835.5, 269.3], [821.0, 555.0], [295.5, 572.0]];
      const RES = 1920 / 537;

      // ---- captions (kit v05, U2); "1995," glow-flickers in on its frame (client v04 #6); "broke." jitters; "bug" RGB split
      T.lockupsWire(tl);
      T.glowFlicker(tl, '#b02-lk-1995-1 .rc-lk__row--hero .rc-lw', L(30));
      FX.jitter(tl, '#b02-lk-broke-1 .rc-lw', L(101), { px: 4.5 });
      FX.rgbSplit(tl, '#b02-lk-bug-1 .rc-lk__row--key .rc-lw', L(147), { px: 6, settle: 2 });

      // ---- X6 OUT (local 6-14, v04): world 'fill' -> 100% about the CRT screen, motion blur on media

      X.zoom(tl, '#b02-world', L(6), { screen: { corners: BANDQ }, dir: 'out', scale: 'fill', handoff: '#b02-g6-hand',

      tl.fromTo('#b02-g6-clean', { opacity: 1 }, { opacity: 0, duration: L(5), ease: 'power2.in', immediateRender: false }, L(9));
      // B1's SUV-flip push finishes here: B1 = 1 + 0.04 sineInOut((m - 114) / 26) from its local 114 to 140, m = this local
      // + 134, so local 0 -> 6 is the tail of that curve (104% on 6), held after
      const SIO = (p) => (1 - Math.cos(Math.PI * p)) / 2, P0 = 20 / 26, S0 = 1 + 0.04 * SIO(P0);
      const b1Tail = (q) => (SIO(P0 + q * (1 - P0)) - SIO(P0)) / (1 - SIO(P0));
      gsap.set('#b02-band-push, #b02-hand', { scale: S0, transformOrigin: '50% 50%' });
      tl.fromTo('#b02-band-push, #b02-hand', { scale: S0 }, { scale: 1.04, duration: L(6), ease: b1Tail, immediateRender: false }, 0);

      M.crtFlicker(tl, '#b02-g6-crt', L(6), { until: L(25), seed: 97 });

      FX.vcr('#b02-vcr');
      M.crtFlicker(tl, '#b02-crtc-v', L(25), { until: L(57), seed: 98 });
      FX.zoomThrough(tl, '#b02-crtc', L(57), { to: 4, frames: 8, origin: '960px 540px', in: '#b02-g1f' });
