      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* camera = the held CRT shot (plate + screen + tear + error box), pushed 100 -> 104% after the X6 lands */
      #b02-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .b02-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      /* L8 screen (stand-in geometry, re-fit to the real R3.9): 4:3 screen 320 x 240 at (800, 210), centre (960, 330).
         The GTA 6 picture is 16:9, letterboxed inside the 4:3 CRT: band 320 x 180 at (800, 240) = exactly 1/6 of the
         frame, so at the X6 600% the band IS the full frame (seamless with B1's last frame). The screen box is laid
         out at 6x by RCK.transitions.zoomFit (1920 x 1440 layout px, band at layout y 180). */
      #b02-lbx { position: absolute; left: 0; top: 0; width: 1920px; height: 1440px; background: var(--ink-black); }
      #b02-band { position: absolute; left: 0; top: 180px; width: 1920px; height: 1080px; overflow: hidden; }
      #b02-band-push { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b02-band-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      /* after the cut on "1995": GTA 1 (4:3 game) fills the whole 4:3 screen at 1x (it never zooms) */
      #b02-g1 { position: absolute; left: 800px; top: 210px; width: 320px; height: 240px; object-fit: cover; }
      /* X4 region = the screen picture only (plan: "X4 tear on the CRT picture only") */
      #b02-x4 { left: 800px; top: 210px; width: 320px; height: 240px; }
      /* L8 flicker (97-100%) kept alive on the frozen torn picture: an ink-black veil of 0-3% over the screen region
         (a solid overlay, never a filter on footage); before the freeze the flicker is the treatment's exposure. */
      #b02-flick { position: absolute; left: 800px; top: 210px; width: 320px; height: 240px; background: var(--ink-black); opacity: 0; pointer-events: none; }
      /* error box: centred on the screen, over its lower third, above the caption band (T1/T7 y 592-648) */
      #b02-err { left: 640px; top: 370px; }

      const BAND = [800, 240, 320, 180];             // 16:9 GTA 6 picture letterboxed in it (1/6 of the frame)

      // ---- X6 OUT (beat f0-8 = local 6-14): world 600% -> 100% about the screen, log-space ease out, motion blur on media
      X.zoomFit('#b02-screen', { rect: SCREEN }, { res: 6 });
      X.zoom(tl, '#b02-world', L(6), { screen: { rect: BAND }, dir: 'out', blurMedia: '#b02-plate, #b02-g6-crt, #b02-g6-clean' });
      // clean copy fades 1 -> 0 over the zoom's last frames (local 9 -> 14), revealing the CRT look as the picture lands
      tl.fromTo('#b02-g6-clean', { opacity: 1 }, { opacity: 0, duration: L(5), ease: 'none', immediateRender: false }, L(9));
      // B1's held-shot push continues inside the picture (B1: 100% at its local 64 -> 104% at its local 149, linear), so the
      // first frame here matches B1's last frame exactly: scale(n) = 1 + 0.04 * (n + 79) / 85, n = this local frame.
      gsap.set('#b02-band-push', { scale: 1 + 0.04 * 79 / 85, transformOrigin: '50% 50%' });
      tl.fromTo('#b02-band-push', { scale: 1 + 0.04 * 79 / 85 }, { scale: 1 + 0.04 * 111 / 85, duration: L(32), ease: 'none', immediateRender: false }, 0);

      // ---- held CRT shot: slow push 100% -> 104% from the landing (local 14) to the beat end (local 186), same rate
      // through the tail handle; towards the screen centre (960, 330).
      if (!STILL) S.push(tl, '#b02-cam', L(14), { until: L(192), from: 1, to: 1 + 0.04 * 178 / 172, origin: '960px 330px' });

      // ---- L8 brightness flicker 97-100% (one seeded value per frame) on the live CRT picture until the tear
      M.crtFlicker(tl, '#b02-g6-crt', L(6), { until: L(32), seed: 97 });
      M.crtFlicker(tl, '#b02-g1', L(32), { until: L(107), seed: 98 });

      // ---- X4 on "broke." (beat f101 = local 107): 8f tear of the CRT picture only, then holds the torn frame (freeze)
      if (!STILL) X.tear(tl, '#b02-x4', L(107), { frames: 8, end: 'hold', seed: 101 });
      // flicker continues on the frozen picture: ink veil 0-3% (= brightness 100-97%), seeded, one value per frame
      (function () {
        const rnd = RCK.rng(99);
        for (let k = 107; k < 192; k++) {
          const b = k === 107 ? 1 : 0.97 + 0.03 * rnd();
          tl.set('#b02-flick', { opacity: Number((1 - b).toFixed(4)) }, Math.max(0, k / 30 - 1e-4));
        }
      })();

      // ---- error box: built once; its clip start (local 115) is the hard pop
      M.errorBoxInit('#b02-err');

      // ---- T7 (beat f133-172): "And that" hard cut on "And", chip on "bug", "saved it." on "saved"
      T.chipSentence(tl, '#b02-t7', W.And, { wordTimes: [W.And, W.And, W.saved, W.saved], chipAt: W.bug });

      // ---- X5 out half: slats rotate shut over the last 8f before the boundary (local 186 = B3's f0), held shut after
      X.blindsClose(tl, '#b02-x5', L(186));

      tl.set({}, {}, L(192));
      window.__timelines["b02-bug"] = tl;
    </script>
