         on the quad TL (286.6, 196.4) TR (838.2, 217.7) BR (818.6, 601.9) BL (296.7, 624.0), centre (560, 410) */
      #b02-plate-fit { position: absolute; left: 0; top: 0; width: 1440px; height: 1080px; transform-origin: 0 0;
        transform: matrix(1.4903578, 0.1698048, -0.1698048, 1.4903578, 5.0419, -459.9779); }

      #b02-band-push { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b02-band-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
      #b02-hand { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }

      #b02-vcr { position: absolute; right: 84px; bottom: 66px; font-family: var(--sans); font-weight: 400; font-size: 42px;
        line-height: 42px; letter-spacing: 0.04em; color: var(--white); text-shadow: 0 0 8px rgba(255, 255, 255, 0.35), 0 3px 10px rgba(0, 0, 0, 0.6); }

      .b02-halo { text-shadow: var(--text-glow), 0 0 16px rgba(0, 0, 0, 0.6), 0 0 38px rgba(0, 0, 0, 0.45); }

      .b02-win { --m-eb-w: 1152px; --m-eb-u: 3.6px; --m-eb-fs: 50px; transform-origin: 50% 50%; }
      #b02-wins { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; pointer-events: none; }

      const L = (n) => n / 30;                       // local frame -> seconds (local frame = beat frame + 6)
      const hard = (sel, from, to, n) => tl.fromTo(sel, from, Object.assign({ duration: 0.5 / 30, ease: 'steps(1)', immediateRender: false }, to), (n - 0.75) / 30);
      // CRT glass on the R3.7 plate (frame px, after the plate transform), TL TR BR BL; and the 16:9 band inside it (v04)
      const SCREENQ = [[286.6, 196.4], [838.2, 217.7], [818.6, 601.9], [296.7, 624.0]];
      const BANDQ = [[287.9, 254.1], [835.5, 269.3], [821.0, 555.0], [295.5, 572.0]];
      const RES = 1920 / 537;

      // ---- captions (U2 = kit v03 wiring); "1995," glow-flickers in on its frame (v04 #6). TODO kit v05: regenerate.
      T.lockupsWire(tl);
      T.glowFlicker(tl, '#b02-lk-1995-1 .rc-lk__row--key .rc-lw', L(30));

      // ---- X6 OUT (local 6-14, v04): world 'fill' -> 100% about the CRT screen, motion blur on media

      X.zoom(tl, '#b02-world', L(6), { screen: { corners: BANDQ }, dir: 'out', scale: 'fill', handoff: '#b02-g6-hand',
        blurMedia: '#b02-plate, #b02-g6-crt, #b02-g6-clean' });

      // B1's SUV-flip push finishes here: B1 = 1 + 0.04 sineInOut((m - 114) / 26) from its local 114 to 140, m = this local
      // + 134, so local 0 -> 6 is the tail of that curve (104% on 6), held after
      const SIO = (p) => (1 - Math.cos(Math.PI * p)) / 2, P0 = 20 / 26, S0 = 1 + 0.04 * SIO(P0);
      const b1Tail = (q) => (SIO(P0 + q * (1 - P0)) - SIO(P0)) / (1 - SIO(P0));
      gsap.set('#b02-band-push, #b02-hand', { scale: S0, transformOrigin: '50% 50%' });
      tl.fromTo('#b02-band-push, #b02-hand', { scale: S0 }, { scale: 1.04, duration: L(6), ease: b1Tail, immediateRender: false }, 0);
      // the over-shoulder camera: 100 -> 112% while the X6 lands (6-14, power2.out), then the doc's push 112 -> 116%
      // (14-25, sine.inOut) about the screen centre (560, 410)
      gsap.set('#b02-cam', { scale: 1, transformOrigin: '560px 410px' });
      tl.fromTo('#b02-cam', { scale: 1 }, { scale: 1.12, duration: L(8), ease: 'power2.out', immediateRender: false }, L(6));
      tl.fromTo('#b02-cam', { scale: 1.12 }, { scale: 1.16, duration: L(11), ease: 'sine.inOut', immediateRender: false }, L(14));
      M.crtFlicker(tl, '#b02-g6-crt', L(6), { until: L(25), seed: 97 });

      // ---- the CRT close-up: brightness flicker, then the zoom-through into the monitor (57-65, 100 -> 400%, motion blur).
      // TODO kit v05 zoom-through (stand-in: the kit X6 zoom 'in' about the frame centre).
      M.crtFlicker(tl, '#b02-crtc-v', L(25), { until: L(57), seed: 98 });
      X.zoom(tl, '#b02-crtc', L(57), { screen: { rect: [0, 0, 1920, 1080] }, dir: 'in', scale: 4, frames: 8, blurMedia: '#b02-crtc-v' });

      // ---- "broke." (101): the error window slams in (110 -> 100%, 3f); the copies hard-pop (their clip starts).
      // TODO kit v05 window slam / cascade / snap-shut; stand-in snap: reverse order, 2f each, 151-154
      for (let k = 0; k <= 10; k++) M.errorBoxInit('#b02-w' + k);
      gsap.set('#b02-w0', { scale: 1.1 });
      tl.fromTo('#b02-w0', { scale: 1.1 }, { scale: 1, duration: L(3), ease: 'power3.out', immediateRender: false }, L(101));
      for (let k = 10; k >= 0; k--) {
        const f0 = 151 + Math.floor((10 - k) / 4);
        tl.fromTo('#b02-w' + k, { scale: 1 }, { scale: 0, duration: L(2), ease: 'power2.in', immediateRender: false }, L(f0));
      }
      // "broke." jitter +-4.5 px every frame (seeded), on the lockup box (the word itself pops + blurs in)
      (function () {
        const rnd = RCK.rng(101); let px = 0, py = 0;
        for (let k = 101; k < 131; k++) {
          const x = Number(((rnd() * 2 - 1) * 4.5).toFixed(1)), y = Number(((rnd() * 2 - 1) * 4.5).toFixed(1));
          hard('#b02-lk-broke-1 .rc-lk__box', { x: px, y: py }, { x: x, y: y }, k); px = x; py = y;
        }
      })();
      // "bug" RGB split 6 px that never settles (stand-in: red / cyan text shadows, seeded offset 4.5-7.5 px per frame).
      // TODO kit v05 RCK.fx.rgbSplit
      (function () {
        const rnd = RCK.rng(147), sel = '#b02-lk-bug-1 .rc-lk__row--key .rc-lw';
        const sh = (d) => '-' + d + 'px 0 0 rgba(255, 30, 60, 0.75), ' + d + 'px 0 0 rgba(0, 220, 255, 0.75)';
        let prev = sh(6);
        gsap.set(sel, { textShadow: prev });
        for (let k = 148; k < 155; k++) { const s = sh((4.5 + 3 * rnd()).toFixed(1)); hard(sel, { textShadow: prev }, { textShadow: s }, k); prev = s; }
      })();

      // ---- 155: 1-frame white flash, the clean shot; the pill box wipes in from the left (156-162), text whole on 162
      gsap.set('#b02-flash', { opacity: 0 });
      hard('#b02-flash', { opacity: 0 }, { opacity: 0.85 }, 155);
      hard('#b02-flash', { opacity: 0.85 }, { opacity: 0 }, 156);
      gsap.set('#b02-pill-box', { clipPath: 'inset(0% 100% 0% 0%)' });
      tl.fromTo('#b02-pill-box', { clipPath: 'inset(0% 100% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: L(6), ease: 'power3.out', immediateRender: false }, L(156));
      gsap.set('#b02-pill-text', { opacity: 0 });
      hard('#b02-pill-text', { opacity: 0 }, { opacity: 1 }, 162);

      tl.set({}, {}, L(181));
      window.__timelines["b02-bug"] = tl;
    </script>
