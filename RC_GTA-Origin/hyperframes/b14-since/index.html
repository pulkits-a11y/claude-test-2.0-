    <!-- B14 b14-since (v05): beat 177f (5.900s) + 6f handle each end = 189f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 6.1000s (local frame = beat frame + 6).
         Word timings: words.json (comp_t, v02 VO 115%, unchanged in v03). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/.
         v02: ../../REVISION_v02.md. v03: ../../REVISION_v03.md (notes 5, 6, 11-13, 16, 17).

         Plan p.26 (B14 build), STORYBOARD.md B14, CONFLICTS.md C15. TRANSPARENT OVERLAY: all footage is Tesseract's
         (tesseract_shots.json, v03: v01 framing, eased): L10 burst (9 x 6f + 1 x 5f, static), GTA 5 chase R1.3 (push 100 -> 104%),
         police lights R1.6 (for RT3, static 100%), X8 whip, escape R14.5 (push 100 -> 104%).
         beat     local    what this overlay draws
         -6..12   0..18    L10 year tag "2001" (R14.1 x2)  - the year tags are the ONLY text during the burst (C15)
         12..24   18..30   "2002" (R14.2 x2)
         24..36   30..42   "2004" (R14.3 x2)
         36..48   42..54   "2008" (R14.4 x2)
         48..59   54..65   "2013" (R14.5 6f + 5f)
         59       65       lockup "that [chase.]" (centred; that 65, chase. 72) .. out on "The" (97)
         91       97       lockup "The [wanted stars.]*" under the stars (ink centre y 800): The 97, wanted 102 + stars. 114 pop + blur in;
                           M1 six hero stars (120 px, centred) GLITCH IN one every 3f (97 .. 112, 6f each, clean by 118)
         126      132      stars out with the cut to the police lights; lockup "The [sirens.]" (centred; The 132, sirens. 138)
         132-135  138-141  X9 siren wash on "sirens" (red 2f, blue 2f, Overlay 35%) over an EMBEDDED copy of the R1.6 police lights (opaque
                           on these 4 frames only, so the Overlay blend has the picture under it; the shot is at 100% there) = cue sirens (S14)
         151-157  157-163  X8 whip (Tesseract), midpoint 154 = cue whip_mid (S15 starts 2f before)
         153      159      lockup "The [running.]" (centred; The 159, running. 163), holds to the end
         177      183      v03 (note 6): hard cut into B15 (no X5 blinds); the tail handle is transparent (the escape continues) -->
    <div id="root" data-composition-id="b14-since" data-start="0" data-duration="6.3000000" data-width="1920" data-height="1080">

      <!-- ===== X9: embedded police-lights plate, only under the 4 wash frames (beat 132-135). Must match the Tesseract shot
           B14-police-lights exactly: R1.6 (SUBSTITUTE for the missing RT3), same crop 1264:711:300:289, same source time
           (shot source_in_s 129.5 on beat 126 + 6f = 129.7 s = working clip 0.4000 s, window in 129.3), full frame, 100%
           (the shot's punch-in has settled at 100% on beat 132), no grade. ===== -->
      <video id="b14-x9-plate" class="clip rc-full" src="assets/footage/R1.6.mp4" data-start="4.6000" data-duration="0.1333" data-media-start="0.4000" data-track-index="1" muted playsinline style="z-index: 1; object-fit: cover"></video>
      <div id="b14-x9" class="rc-x9" style="z-index: 2"></div>

      <!-- ===== M1: six wanted stars, 120 px, centred (960, 540), beat 91..126 (v03: they glitch in) ===== -->
      <div id="b14-stars" class="clip m1-stars" data-preset="hero" data-start="3.2333" data-duration="1.1667" data-track-index="2" style="z-index: 4"></div>

      <!-- ===== v05 year labels (doc 56.0 "release-year label ... in each shot's bottom-left (2001, 2002, 2004, 2008), matching hook beat 2"; 2013 kept on the GTA V clips): kit .fx-year, Coolvetica 60 px, bottom-left (96, 64 px from the edges), hard cut with the burst clips ===== -->
      <div id="b14-year-2001" class="clip fx-host" data-start="0.0000" data-duration="0.6000" data-track-index="4" style="z-index: 6; --x: 96px; --b: 64px"><div class="fx-year">2001</div></div>
      <div id="b14-year-2002" class="clip fx-host" data-start="0.6000" data-duration="0.4000" data-track-index="4" style="z-index: 6; --x: 96px; --b: 64px"><div class="fx-year">2002</div></div>
      <div id="b14-year-2004" class="clip fx-host" data-start="1.0000" data-duration="0.4000" data-track-index="4" style="z-index: 6; --x: 96px; --b: 64px"><div class="fx-year">2004</div></div>
      <div id="b14-year-2008" class="clip fx-host" data-start="1.4000" data-duration="0.4000" data-track-index="4" style="z-index: 6; --x: 96px; --b: 64px"><div class="fx-year">2008</div></div>
      <div id="b14-year-2013" class="clip fx-host" data-start="1.8000" data-duration="0.3666" data-track-index="4" style="z-index: 6; --x: 96px; --b: 64px"><div class="fx-year">2013</div></div>

      <!-- ===== v05 captions (REVISION_v05 G10 "every spoken word is on screen", so the burst is captioned now; U1/U2:
           Coolvetica Regular 54 setup over Coolvetica Italic 190 key, white + drop shadow, words appear on their frame; only
           "wanted stars." pops + blurs in): "And every [GTA] since" / "is built around" over the montage, then each phrase on its
           own cut: "that [chase.]" (59), "The [wanted stars.]*" under the stars (ink centre y 800, 91), "The [sirens.]" (126),
           "The [running.]" (153, holds to the end). ===== -->
      <div id="b14-lk-1" class="clip rc-lk" data-rc-v="5" data-start="0.2333" data-duration="1.0667" data-track-index="3" style="--rc-lk-c: 130.78px; z-index: 21"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="7">And</span> <span class="rc-lw" data-rc-f="15">every</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -20.99px"><span class="rc-lw rc-lw--key" data-rc-f="24">GTA</span></div><div class="rc-lk__row rc-lk__row--tail" style="font-size: 54px; line-height: 54px; height: 54px; margin-top: -18.8px"><span class="rc-lw" data-rc-f="32">since</span></div></div></div>
      <div id="b14-lk-2" class="clip rc-lk" data-rc-v="5" data-start="1.3000" data-duration="0.8666" data-track-index="3" style="--rc-lk-c: 28.67px; z-index: 21"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--solo" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="39">is</span> <span class="rc-lw" data-rc-f="43">built</span> <span class="rc-lw" data-rc-f="53">around</span></div></div></div>
      <div id="b14-lk-3" class="clip rc-lk" data-rc-v="5" data-start="2.1666" data-duration="1.0667" data-track-index="3" style="--rc-lk-c: 101.01px; z-index: 21"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="65">that</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -27.23px"><span class="rc-lw rc-lw--key" data-rc-f="72">chase.</span></div></div></div>
      <div id="b14-lk-4" class="clip rc-lk" data-rc-v="5" data-start="3.2333" data-duration="1.1667" data-track-index="3" style="--rc-y: 800px; --rc-lk-c: 101.01px; z-index: 21"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="97">The</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -27.23px"><span class="rc-lw rc-lw--key rc-lw--pop" data-rc-f="102">wanted</span> <span class="rc-lw rc-lw--key rc-lw--pop" data-rc-f="114">stars.</span></div></div></div>
      <div id="b14-lk-5" class="clip rc-lk" data-rc-v="5" data-start="4.4000" data-duration="0.9000" data-track-index="3" style="--rc-lk-c: 101.01px; z-index: 21"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="132">The</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -27.23px"><span class="rc-lw rc-lw--key" data-rc-f="138">sirens.</span></div></div></div>
      <div id="b14-lk-6" class="clip rc-lk" data-rc-v="5" data-start="5.3000" data-duration="1.0000" data-track-index="3" style="--rc-lk-c: 101.01px; z-index: 21"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="159">The</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -27.23px"><span class="rc-lw rc-lw--key" data-rc-f="163">running.</span></div></div></div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>

    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions;
      const f = (n) => n / 30;   // local frame -> seconds (local frame = beat frame + 6)

      // Word onsets from words.json (v02, comp_t snapped to the nearest frame, local):
      // And 7, every 15, GTA 24, since 32, is 39, built 43, around 53, that 65, chase 72,
      // The 97, wanted 102, stars 114, The 132, sirens 138, The 159, running 163.
      const W = { that: 65, The1: 97, The2: 132, sirens: 138, The3: 159 };
      const BOUNDARY_B15 = 183;   // beat 177 = B15's first frame

      // ---- captions (v05): words appear on their frames; the starred key "wanted stars." pops + blurs in (kit v05 timing)
      T.lockupsWire(tl);

      // ---- M1 (v03 note 5): the six hero stars GLITCH IN (kit starsGlitchIn: RGB split, slice jitter, 2 flicker frames;
      //      hard per-frame cuts), one every 3f from "The" (starts 97, 100 ... 112), each 6f, all clean by local 118 (beat 112);
      //      out with the cut to the police lights (local 132)
      M.starsGlitchIn(tl, '#b14-stars', f(W.The1), { stepF: 3, frames: 6 });

      // ---- X9 siren wash on "sirens" (cop word): red 35% Overlay 2f, blue 2f (hard per-frame changes), over the embedded R1.6 plate
      X.sirenWash(tl, '#b14-x9', f(W.sirens));

      // ---- v03 (note 6): no X5 blinds; hard cut into B15 at the boundary (local 183 = beat 177). The tail handle is the
      //      escape shot continued (Tesseract), transparent here.

      tl.set({}, {}, f(189));
      window.__timelines["b14-since"] = tl;
    </script>
