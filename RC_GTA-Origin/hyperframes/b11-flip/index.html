    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // v02 word frames (local) from words.json: So 6, the 9, team 15, flips 23, the 33, whole 42, game. 52, You're 65,
      // not 72, the 76, cop 79, anymore. 83, Now 103, you're 107, the 117, one 122, being 128, chased. 135.
      const GLITCH = 23;                               // "flips" = the first torn frame (beat f17, cues.json "glitch")
      const CUT = GLITCH + 8;                          // 31: X4 is 8f (b08-break v02), then the hard cut to the back side
      const NOW = 103, CHASED = 135, END = 164;

      // ---- front: the B5 split screen returns with B5's own camera (b05-copgame v02: push 100 -> 108%, easeInOutSine,
      //      B5 local 0 -> its cut at local 89). Same curve from this local 0; the front leaves at the glitch's cut, so this
      //      tween covers 0..31 with exactly that part of the ease: local 0-22 = B5 local 0-22 frame for frame. ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const B5_CUT = 89;
      C.push(tl, '#b11-split .b11-front .lc-push', 0, { until: f(CUT), from: 1, to: 1 + 0.08 * SIN(CUT / B5_CUT), ease: seg(0, CUT / B5_CUT) });

      // ---- X4 glitch on "flips" (note 5), B8's break exactly (b08-break v02): still mode, 8f, seed 8, kit defaults (16 x 9 blocks,
      //      jump +/-30 px, 25% freezing, 6 px RGB split); torn local 23-30, nothing of it from 31 (the cut) ----
      X.tear(tl, '#b11-x4', f(GLITCH), { frames: 8, seed: 8 });

      // ---- back side (rule D): the cut into the new shot punches in 115 -> 100% over 10f (easeOutExpo), then the held
      //      shot pushes 100 -> 108% to the end (easeInOutSine); keyword punch on "chased." on the nested wrappers ----
      C.punchIn(tl, '#b11-split .b11-back .lc-push', f(CUT));
      C.push(tl, '#b11-split .b11-back .lc-push', f(CUT + 10), { until: f(END), from: 1, to: 1.08 });
      C.keyPunch(tl, '#b11-split .b11-back .lc-key', f(CHASED));

      // ---- M2 on "Now" (local 103): "you" hard-cuts in, shaft + head drawn by 111 (8f, kit ease out). Same seed and
      //      geometry as b05-copgame (the same arrow), now on the getaway car ----
      M.arrowDraw(tl, '#b11-arrow', f(NOW), { from: [175, 800], to: [335, 520], bend: 0.16, seed: 7, label: 'you' });

      // ---- T1 word pops (every .rc-cap above): each word on its onset frame, 5f easeOutExpo, max 2 words on screen ----
      T.captionPops(tl);

      window.__timelines["b11-flip"] = tl;
    </script>
