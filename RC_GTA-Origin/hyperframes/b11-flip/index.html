      /* Lane C push-in wrapper inside each 958 px half (identical to b05-copgame / b06-dull): the L11 frame (halves
         x 0-958 / 962-1920, 4 px divider) never moves or scales, only the picture inside each half pushes in (plan rule 7),
         so B5 and B11 keep the same frame size and position (plan p.25 "Watch out", QA 7). */
      .lc-push { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .lc-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const S = RCK.screens, M = RCK.motifs;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: So 6, the 10, team 16, flips 24, the 34, whole 45, game. 55, You're 69, not 76,
      // the 80, cop 84, anymore. 88, Now 109, you're 114, the 124, one 129, being 135, chased. 143 (voice ends 160).

      // Front: the B5 split screen returns exactly as B5 opened: same in-points and the same push-in rate as b05-copgame
      // (100% on local 0, +4% per 155 frames), so local 0-23 match B5 local 0-23 frame for frame (picture).
      S.push(tl, '#b11-split .rc-l11__face--front .lc-push', 0, { until: f(34), from: 1, to: 1 + 0.04 * 34 / 155 });

      // On "flips" (local 24): 180 deg on Y over 10f, power2.inOut; 90 deg edge-on on local 29 (beat f23 = flip_mid, S10 peak);
      // the back side lands on local 34. Motion blur ramps on all four face videos (kit splitFlip).
      S.splitFlip(tl, '#b11-split', f(24), { durF: 10 });

      // Back side held shot (plan rule 7): push-in 100% on the landing (34) -> 104% at the beat end (168), same rate into
      // the tail handle (174).
      S.push(tl, '#b11-split .rc-l11__face--back .lc-push', f(34), { until: f(174), from: 1, to: 1 + 0.04 * (174 - 34) / (168 - 34) });

      // M2 on "Now" (local 109): "you" hard-cuts in on 109, shaft + head drawn by 117 (8f, ease out). Same seed and geometry
      // as b05-copgame (the same arrow), now on the getaway car.
      M.arrowDraw(tl, '#b11-arrow', f(109), { from: [175, 800], to: [335, 520], bend: 0.16, seed: 7, label: 'you' });

      window.__timelines["b11-flip"] = tl;
    </script>
