    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // v02 word frames (local) from words.json: So 6, the 9, team 15, flips 23, the 33, whole 42, game. 52, You're 65,
      // not 72, the 76, cop 79, anymore. 83, Now 103, you're 107, the 117, one 122, being 128, chased. 135.
      const GLITCH = 23;                               // "flips" = the first torn frame (beat f17, cues.json "glitch")
      const CUT = GLITCH + 8;                          // 31: X4 is 8f (b08-break v02), then the hard cut to the back side
      const NOW = 103, CHASED = 135, END = 164;

      // ---- front: the B5 split screen returns with B5's own camera (b05-copgame v03, REVISION_v03 note 13: v01's slow
      //      push, eased: scale(B5 local L) = 1 + 0.04 x sine.inOut(L / 147), one curve from B5 local 0 to b06-dull's cut on
      //      "One"; no keyword punch). Same curve from this local 0; the front leaves at the glitch's cut, so this tween
      //      covers 0..31 with exactly that part of the ease: local 0-22 = B5 local 0-22 frame for frame. If b05-copgame's
      //      SPAN / PUSH change, change B5_SPAN / B5_PUSH here and re-run tools/make_x4_stills.py. ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const B5_SPAN = 147, B5_PUSH = 0.04;             // = b05-copgame's SPAN, PUSH (v03)
      C.push(tl, '#b11-split .b11-front .lc-push', 0, { until: f(CUT), from: 1, to: 1 + B5_PUSH * SIN(CUT / B5_SPAN), ease: seg(0, CUT / B5_SPAN) });

      // ---- X4 glitch on "flips" (note 5), B8's break exactly (b08-break v02): still mode, 8f, seed 8, kit defaults (16 x 9 blocks,
      //      jump +/-30 px, 25% freezing, 6 px RGB split); torn local 23-30, nothing of it from 31 (the cut) ----
      X.tear(tl, '#b11-x4', f(GLITCH), { frames: 8, seed: 8 });

      // ---- back side (v03, REVISION_v03 note 13 "remove the random zooms"): v01's camera = the held-shot push 100 -> 104%
      //      from the cut to the end, now easeInOutSine (v02's punch-in on the cut and keyword punch on "chased." removed) ----
      C.push(tl, '#b11-split .b11-back .lc-push', f(CUT), { until: f(END), from: 1, to: 1.04 });

      // ---- M2 on "Now" (local 103): "you" hard-cuts in, shaft + head drawn by 111 (8f, kit ease out). Same seed and
      //      geometry as b05-copgame (the same arrow), now on the getaway car ----
      M.arrowDraw(tl, '#b11-arrow', f(NOW), { from: [850, 862], to: [712, 762], bend: 0.16, seed: 7, label: 'you', labelAt: [880, 898] });

      // ---- v03 caption lockups (every .rc-lk above): plain words hard-cut in on their frames, "chased." pops + blurs in ----
      T.lockupsWire(tl);

      window.__timelines["b11-flip"] = tl;
