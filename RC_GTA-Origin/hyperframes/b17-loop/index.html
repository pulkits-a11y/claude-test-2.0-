<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/base.css">
    <link rel="stylesheet" href="assets/kit/type.css">
    <link rel="stylesheet" href="assets/kit/motifs.css">
    <link rel="stylesheet" href="assets/kit/transitions.css">
    <link rel="stylesheet" href="assets/kit/screens.css">
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* v05 end (local 135-180): the kit dark card with R17.4 (the launch trailer's police chase, 46.73-48.23 s) blurred,
         darkened, 25%, inside #b17-endcam = the camera-shake target of the logo slam (B1: #b01-cam) */
      #b17-endcam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      /* the GTA VI logo: B1's cut-out and box exactly (lane 1: 848 x 660 -> 462.5 x 360, centred on (960, 540)) */
      #b17-logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
      #b17-logo-box { position: absolute; left: 728.75px; top: 360px; width: 462.5px; height: 360px; }
      #b17-logo-pop { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #b17-logo-img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain;
        filter: drop-shadow(0 4px 18px rgba(0, 0, 0, 0.55)); }
      /* captions over the bright Trailer 1 window light / the custody shots: a dark halo under the kit drop shadow (as B2) */
      .b17-halo { text-shadow: var(--text-drop), 0 0 16px rgba(0, 0, 0, 0.6), 0 0 38px rgba(0, 0, 0, 0.45); }
      /* v05 (doc 71.5-74.4 [DEPTH]): the Trailer 1 custody shots live in this composition now. Two camera wrappers get the
         SAME push: #b17-plates (the shots) and #b17-cuts (Lucia cut out of the same frames by remove-background); the key word
         sits between them (steady), so her head / shoulder passes in front of it. */
      #b17-plates, #b17-cuts { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b17-plates video, #b17-cuts video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      /* L2 letterbox bars (138 px), drawn here now that the shots are here; they slide in over 8 f on the first frame */
      .b17-bar { position: absolute; left: 0; width: 1920px; height: 138px; background: var(--ink-black); }
      #b17-bar-t { top: 0; transform-origin: 50% 0%; }
      #b17-bar-b { bottom: 0; transform-origin: 50% 100%; }
    </style>
  </head>
  <body>
    <!-- B17 b17-loop (v05): beat 168f (5.600s; the GTA VI logo holds 27 f after "now?", then a hard cut to B18) + 6f
         handles = 180f. Local frame = beat frame + 6. Words: words.json (v05 VO). v05: ../../REVISION_v05.md (CLIENT
         OVERRIDE + U; lane 4) and the client's doc 1:11.5-1:17.0 (00_Brief/refs_v05/).
         beat    local   what
         -6..36  0..42   HF: Trailer 1 window shot (Lucia's silhouette in the window light), L2 bars slide in over 8 f; push
                         100 -> 104%; "And [GTA 6?]": "GTA 6?" (Coolvetica Italic 240) [DEPTH] in the window light, partly
                         behind her head (plate -> key copy -> cut-out), "And" in front; M1 stars glitch in from "GTA" (U12,
                         a ding each), blink to beat 92
         36-54   42-60   HF: the parole officer (Lucia's INMATE back): "It opens with" (right of centre)
         54-92   60-98   HF: Lucia facing camera: "Lucia" (190) [DEPTH] partly behind her screen-right shoulder, "already
                         caught." on the green wall ("caught." static pink); the doc's slow push 100 -> 110% across beat 36-92
         92-129  98-135  Tesseract: two chase shots (R17.2 @ 7.2 to 109, R17.4 @ 47.2 to 129; swipe between), HF transparent +
                         "So who's chasing who" (tier A, centred low, y 880, over the road)
         129-141 135-147 hard cut on "now?" to the kit dark card (R17.4 police chase continued, blurred, darkened, 25%);
                         "now?" hero 330 px low (ink centre y 890), pop + blur-in, white (U2: no siren flicker)
         141-168 147-174 the GTA VI logo slam = B1's exact call (kit logoSlam from 150 -> 94 -> 100% / 6 f, impact 145:
                         85% white flash, flash-star, 9 px shake 6 f with B1's 1.2% overscan); B1's cut-out at B1's box
                         (462.5 x 360, centred); reverse_cymbal ends on 141, impact_boom + sub_drop on the slam frame 141
         168     174     hard cut to B18 (CTA); tail handle 174-180 = the logo held. -->
    <div data-hf-id="hf-y7mb" id="root" data-composition-id="b17-loop" data-start="0" data-duration="6.0000000" data-width="1920" data-height="1080">

      <!-- ===== v05 beat f0-92 (local 0-98): the official GTA VI Trailer 1 custody shots (client Drive library, R17.1), moved
           from Tesseract into this composition for the [DEPTH] words. Working clips cut from
           04_Broll/_originals/Drive2/Grand Theft Auto VI Trailer 1.mp4 (footage.json):
             window  local 0-42  (beat -6..36): source 6.60-8.00 s, Lucia at the barred window, a silhouette in the window
                     light turning to look over her shoulder  ("And GTA 6?": "GTA 6?" behind her silhouette)
             officer local 42-60 (beat 36-54): source 8.567-9.133 s, the parole officer talking to her, her INMATE back
                     ("It opens with")
             facing  local 60-98 (beat 54-92): source 9.70-10.933 s, Lucia facing camera in the orange jumpsuit ("Lucia
                     already caught.": "Lucia" partly behind her shoulder)
           Cut-outs (assets/depth/, hyperframes remove-background, u2net_human_seg, transparent WebM; edges checked at 200%)
           for the window and facing shots, frame-locked to their plates (same trims, same data-start). ===== -->
      <div id="b17-plates" style="z-index: 1">
        <video id="b17-win" class="clip" src="assets/footage/R17.1-window.mp4" data-start="0.0000" data-duration="1.4000" data-media-start="0" data-track-index="1" muted playsinline></video>
        <video id="b17-off" class="clip" src="assets/footage/R17.1-officer.mp4" data-start="1.4000" data-duration="0.6000" data-media-start="0" data-track-index="1" muted playsinline></video>
        <video id="b17-face" class="clip" src="assets/footage/R17.1-facing.mp4" data-start="2.0000" data-duration="1.2666" data-media-start="0" data-track-index="1" muted playsinline></video>
      </div>
      <!-- [DEPTH] the lockups' KEY copies (kit lockups, key row only; the other rows hidden and unwired) between the plates
           and the cut-outs, so her head / shoulder passes in front of "GTA 6?" / "Lucia"; the matching FRONT copies (key row
           hidden) sit above everything (z 40). Same clip timing, same geometry, so the two copies register exactly. -->
      <div id="b17-gta-key" class="clip rc-lk b17-halo" data-rc-v="5" data-start="0.2333" data-duration="1.1667" data-track-index="10" style="--rc-y: 620px; --rc-lk-c: 117.81px; z-index: 2; box-sizing: border-box; padding-right: 40px"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px; visibility: hidden"><span>And</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 240px; line-height: 240px; height: 240px; margin-top: -36.98px"><span class="rc-lw rc-lw--key" data-rc-f="13">GTA</span> <span class="rc-lw rc-lw--key" data-rc-f="20">6?</span></div></div></div>
      <div id="b17-lucia-key" class="clip rc-lk b17-halo" data-rc-v="5" data-start="1.4000" data-duration="1.8666" data-track-index="10" style="--rc-y: 600px; --rc-lk-c: 129.45px; z-index: 2; box-sizing: border-box; padding-left: 1090px"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px; visibility: hidden"><span>It</span> <span>opens</span> <span>with</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -23.65px"><span class="rc-lw rc-lw--key" data-rc-f="60">Lucia</span></div><div class="rc-lk__row rc-lk__row--tail" style="font-size: 54px; line-height: 54px; height: 54px; margin-top: -18.8px; visibility: hidden"><span>already</span> <span>caught.</span></div></div></div>
      <div id="b17-cuts" style="z-index: 3">
        <video id="b17-win-cut" class="clip" src="assets/depth/R17.1-window-cut.webm" data-start="0.0000" data-duration="1.4000" data-media-start="0" data-track-index="2" muted playsinline></video>
        <video id="b17-face-cut" class="clip" src="assets/depth/R17.1-facing-cut.webm" data-start="2.0000" data-duration="1.2666" data-media-start="0" data-track-index="2" muted playsinline></video>
      </div>
      <div id="b17-bars" class="clip" data-start="0.2000" data-duration="3.0666" data-track-index="4" style="z-index: 30">
        <div id="b17-bar-t" class="b17-bar"></div><div id="b17-bar-b" class="b17-bar"></div>
      </div>

      <!-- ===== beat 129-168 + tail (local 135-180): the kit dark card (#0E0E10 + grain + lines) with R17.4 (the launch
           trailer's police chase, 46.73-48.23 s, the chase-2 shot's own take continued; letterbox cropped) blurred 40 px,
           darkened 50%, at 25%, inside the shake camera ===== -->
      <div id="b17-endcam" class="rc-cam" style="z-index: 1">
        <div id="b17-dark" class="fx-dark" style="z-index: 0"><div id="b17-dark-base" class="clip fx-fill fx-dark__base" data-start="4.5000" data-duration="1.5000"></div><div class="fx-dark__loop" style="opacity: 0.25"><div class="fx-card__bgscale" data-layout-allow-overflow style="width: 1258.56px; height: 707.94px; transform: translate(-144px, -81px) scale(1.7543900000000001)"><video id="b17-dark-loop" class="clip " src="assets/footage/R17.4.mp4" data-start="4.5000" data-duration="1.5000" data-media-start="0.0000" muted playsinline data-color-grading='{"preset":null,"intensity":1,"adjust":{"exposure":-1,"contrast":0,"highlights":0,"shadows":0,"whites":0,"blacks":0,"temperature":0,"tint":0,"vibrance":0,"saturation":0},"effects":{"blur":1}}'></video></div></div><div id="b17-dark-tex" class="clip fx-fill fx-dark__tex" data-start="4.5000" data-duration="1.5000"></div></div>
      </div>

      <!-- ===== beat f-6..92: M1 wanted stars over the Trailer 1 opening (Lucia in custody), on the top letterbox bar (z 35) ===== -->
      <div data-hf-id="hf-rai4" id="b17-stars" class="clip m1-stars" data-preset="hud" data-start="0" data-duration="3.2666" data-track-index="3" style="z-index: 35"></div>

      <!-- ===== v05 captions (kit lockups, U1 Coolvetica, U2: words appear on their frames, white; only "now?" pops + blurs in):
           the FRONT copies of the [DEPTH] lockups (key rows hidden; the key copies sit between plates and cut-outs above), with
           a dark halo over the bright window light. "And [GTA 6?]" centred on x 940 (ink centre y 620: "GTA 6?" in the window
           light, its "G" about 60% behind her head / neck); "It opens with [Lucia] already caught.^" right of her (box centre x 1505,
           ink centre y 600: "Lucia" partly behind her screen-right shoulder, "already caught." on the green wall, "caught."
           static pink), out with the facing shot on the cut to the chase (local 98). Over the chase shots "So who's chasing
           who" (tier A, centred low on the road, ink centre y 880, halo: the police cars fill the middle); then "now?" hero 330 px low (ink centre y 890, under the logo box). ===== -->
      <div id="b17-gta-txt" class="clip rc-lk b17-halo" data-rc-v="5" data-start="0.2333" data-duration="1.1667" data-track-index="10" style="--rc-y: 620px; --rc-lk-c: 117.81px; z-index: 40; box-sizing: border-box; padding-right: 40px"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="7">And</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 240px; line-height: 240px; height: 240px; margin-top: -36.98px; visibility: hidden"><span>GTA</span> <span>6?</span></div></div></div>
      <div id="b17-lucia-txt" class="clip rc-lk b17-halo" data-rc-v="5" data-start="1.4000" data-duration="1.8666" data-track-index="10" style="--rc-y: 600px; --rc-lk-c: 129.45px; z-index: 40; box-sizing: border-box; padding-left: 1090px"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="42">It</span> <span class="rc-lw" data-rc-f="45">opens</span> <span class="rc-lw" data-rc-f="54">with</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -23.65px; visibility: hidden"><span>Lucia</span></div><div class="rc-lk__row rc-lk__row--tail" style="font-size: 54px; line-height: 54px; height: 54px; margin-top: -18.8px"><span class="rc-lw" data-rc-f="68">already</span> <span class="rc-lw rc-lw--hold" data-rc-f="80">caught.</span></div></div></div>
      <div id="b17-chase-1" class="clip rc-lk b17-halo" data-rc-v="5" data-start="3.4333" data-duration="1.0667" data-track-index="12" style="--rc-y: 880px; --rc-lk-c: 28.67px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--solo" style="font-size: 54px; line-height: 54px; height: 54px"><span class="rc-lw" data-rc-f="103">So</span> <span class="rc-lw" data-rc-f="106">who's</span> <span class="rc-lw" data-rc-f="115">chasing</span> <span class="rc-lw" data-rc-f="129">who</span></div></div></div>
      <div id="b17-now-1" class="clip rc-lk" data-rc-v="5" data-start="4.5000" data-duration="1.5000" data-track-index="11" style="--rc-y: 890px; --rc-lk-c: 175.23px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--key rc-lk__row--hero" style="font-size: 330px; line-height: 330px; height: 330px"><span class="rc-lw rc-lw--key rc-lw--hero rc-lw--pop" data-rc-f="135">now?</span></div></div></div>

      <!-- ===== the GTA VI logo slam (RCK.fx.logoSlam, B1's exact call and stack: flash z 30 < flash-star z 37 < logo z 38 <
           captions z 40) on the end of "now?" (local 147 = beat 141) ===== -->
      <div id="b17-flash" class="clip fx-host" data-start="4.9000" data-duration="0.3000" data-track-index="13" style="z-index: 30"></div>
      <div id="b17-star" class="clip fx-host" data-start="4.9000" data-duration="0.3666" data-track-index="14" style="--x: 960px; --y: 540px; z-index: 37"></div>
      <div id="b17-logo" class="clip" data-start="4.9000" data-duration="1.1000" data-track-index="15" style="z-index: 38"><div id="b17-logo-box"><div id="b17-logo-pop"><img id="b17-logo-img" src="assets/logo/GTA6-logo__cutout.png" alt="Grand Theft Auto VI logo"></div></div></div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions, FX = RCK.fx;
      const F = (n) => n / 30;
      // Word onsets on this composition's clock (v05 words.json comp_t, s): GTA 0.438, now? 4.490, end of "now?" 4.895
      const W = { GTA: 0.438, now: 4.490, nowEnd: 4.895 };
      const kNow = T.frame(W.now);                 // local 135 = beat 129: hard cut to the dark card, "now?" pops + blurs in
      const kLogo = T.frame(W.nowEnd);             // local 147 = beat 141: end of "now?": the GTA VI logo slam (B1's call)
      const kChase = 98;                           // local 98 = beat 92: first chase cut (Tesseract), after "caught."
      const kOff = 42, kFace = 60;                 // local cuts: window -> officer (beat 36, "It"), officer -> facing (beat 54, "Lucia")

      // B1's frame-boundary hard set (lane 1): the value changes exactly on frame n
      const hard = (sel, from, to, n) => tl.fromTo(sel, from, Object.assign({ duration: 0.5 / 30, ease: 'steps(1)', immediateRender: false }, to), (n - 0.75) / 30);

      // ---- captions (v05, U2): every lockup word appears on its frame (the [DEPTH] key and front copies alike); "now?" pops
      T.lockupsWire(tl);

      // ---- L2 bars slide in over the first 8 f (easeOutCubic), gone with the cut to the chase shots (full frame) ----
      tl.fromTo(['#b17-bar-t', '#b17-bar-b'], { scaleY: 0 }, { scaleY: 1, duration: 8 / 30, ease: 'power2.out', immediateRender: true }, 6 / 30);

      // ---- camera: plates and cut-outs move together (same tweens on both wrappers). Window shot: held-shot push
      //      100 -> 104% (easeInOutSine) to the cut on "It"; then the doc's slow push 100 -> 110% (easeInOutSine) across
      //      "It opens with Lucia already caught." (officer + facing shots, local 42-98) ----
      const CAMS = ['#b17-plates', '#b17-cuts'];
      gsap.set(CAMS, { scale: 1, transformOrigin: '960px 540px' });
      tl.fromTo(CAMS, { scale: 1 }, { scale: 1.04, duration: kOff / 30, ease: 'sine.inOut', immediateRender: false }, 0);
      tl.fromTo(CAMS, { scale: 1 }, { scale: 1.10, duration: (kChase - kOff) / 30, ease: 'sine.inOut', immediateRender: false }, kOff / 30);

      // ---- M1: five stars (40 px, row centred on x 1700, y 80, on the top letterbox bar) glitch in one by one 3 f apart from
      //      "GTA" (U12, a ding each: cues), then blink (6f on / 6f off, hard) over the Trailer 1 opening until the chase cut ----
      const starsIn = M.starsGlitchIn(tl, "#b17-stars", W.GTA, { stepF: 3, frames: 6 });
      M.starsBlink(tl, "#b17-stars", starsIn, { until: F(kChase) });

      // ---- the GTA VI logo slam on the end of "now?" (local 147 = beat 141): B1's exact call (lane 1) and B1's 1.2% overscan
      //      on the shaken picture while it shakes (impact 151 -> 157: 11.5 px each side >= 9 px), then held to the hard cut
      FX.logoSlam(tl, '#b17-logo-pop', F(kLogo), { from: 150, flash: '#b17-flash', star: '#b17-star', shakeTarget: '#b17-endcam', shakePx: 9, shakeF: 6 });
      hard('#b17-endcam', { scale: 1 }, { scale: 1.012 }, kLogo + 4);
      hard('#b17-endcam', { scale: 1.012 }, { scale: 1 }, kLogo + 10);
      tl.set({}, {}, F(180));
      window.__timelines["b17-loop"] = tl;
    </script>
  </body>
</html>
