    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* the R17.4 end card fills the frame (never stretched); the world wrapper is what X.zoom scales */
      #b17-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b17-logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
      /* T10 on the T2 keyword (kit rc-t10--key face, built inside the keyword so "now?" breaks apart in place):
         the glitch layer carries no shadow, as T10 on black; the clean word keeps T2's soft shadow (over the end card). */
      #b17-key .rc-t10__glitch { text-shadow: none; }

    <!-- B17 b17-loop (v02): beat 186f (6.200s, incl. the 45f logo tail after "now?") + 6f handle each end = 198f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 6.4000s (local frame = beat frame + 6).
         Word timings: words.json (comp_t, v02 VO 115%). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B17 p.27-28).
         v02: ../../REVISION_v02.md (note 9: the Trailer 1 opening is the client's clip "Video by madebyajit [0-29s].mp4",
         Lucia in the prison yard, Tesseract-owned; rules A-E).

         Plan B17 (p.27-28): T1: And GTA 6? / It opens with / Lucia already caught. / So who's -> T2: chasing who now?
         At the final hit "now?" breaks apart with T10. L2 letterbox on the opening seconds of Trailer 1 (Lucia in
         custody), M1 five stars blink at the top-right; on "So who's chasing who" three fast GTA 6 chase shots (R17.3, R17.4),
         8-10f each; on "now?" hard cut to black with the T2 text, then the GTA 6 logo (end card of R17.4) pushes in
         100% -> 115% over 20f with motion blur; final X4 tear on the logo, T10 on "now?", then black (logo tail).

         Owners (beat frames): f0-100 TS+HF (Tesseract: the madebyajit Trailer 1 opening in the L2 band, two shots: the guard
         + Lucia walking in the yard f0-10 (16:9 crop, the bars slide in over it), Lucia walking toward camera f10-100 (2.39:1
         crop inside the band); HF: transparent + M1 stars + T1), f100-129 TS+HF (Tesseract: R17.2 @ 7.2 / R17.4 @ 47.2 /
         R17.2 @ 11.9, 9-10f each, R17.2 substituting for the missing R17.3; HF: transparent + T1 "So who's" + T2 "chasing who"),
         f129-186 HF opaque (black, T2 "now?", the R17.4 logo push-in, X4 (8f) + T10 at f161, black tail from f169). tesseract_shots.json.

         Layer stack (top -> bottom):
           z40  T1 captions word by word (low line y 860: Lucia's face fills the upper band) and the T2 groups
                ("chasing who" --rc-y 880 over the chase shots; "now?" --rc-y 925 on black, clear of the logo's bottom tip at 115%);
                the T10 glitch lives inside the keyword
           z30  #b17-x4  X4 tear canvas (8f, seed 8, still mode = B8's v02 break; still = this composition at local 167
                         without text)                                                                    local 167-174
           z20  #b17-stars  M1 five stars, 40 px, row centred on (1700, 80) (plan), pop in on "GTA", blink to the first chase cut
           z3   #b17-world  R17.4 end card (logo), push 100 -> 115% over 20f, accelerating, motion blur  local 147-174
           z1   #b17-black  ink black #0A0A0A                                                            local 135-197
           (transparent elsewhere: Tesseract footage shows through) -->
    <div data-hf-id="hf-y7mb" id="root" data-composition-id="b17-loop" data-start="0" data-duration="6.6000000" data-width="1920" data-height="1080">

      <!-- ===== f129 ->: black (HF opaque from the hard cut on "now?") ===== -->
      <div data-hf-id="hf-3sf9" id="b17-black" class="clip rc-ink rc-full" data-start="4.5000" data-duration="2.1000" data-track-index="1" style="z-index: 1"></div>

st&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-fd1u" id="b17-logo" class="clip" src="assets/footage/R17.4.mp4" data-start="4.9000" data-duration="0.9333" data-media-start="0" data-track-index="2" muted playsinline style="--hf-color-grading-blur: 0"></video>
      </div>

      <!-- ===== f161: final X4 tear on the logo (8f, seed 8, still mode, as B8's v02 break), then black from f169.
           Still = assets/x4/b17-old.png (x4_still.sh) ===== -->
      <div data-hf-id="hf-5wwh" id="b17-x4" class="rc-x4" style="z-index: 30">
        <img data-hf-id="hf-2w85" class="rc-x4__still" src="assets/x4/b17-old.png" alt="">
      </div>

      <!-- ===== f0-100: M1 wanted stars over the Trailer 1 opening (Lucia in the prison yard) ===== -->
      <div data-hf-id="hf-rai4" id="b17-stars" class="clip m1-stars" data-preset="hud" data-start="0" data-duration="3.5333" data-track-index="3" style="z-index: 20"></div>

      <!-- ===== T1 running captions, word by word, max 2 words (kit captionPlanV2 / captionHTMLV2 from words.json) ===== -->
      <div data-hf-id="hf-5gba" id="b17-cap-1" class="clip rc-t1 rc-cap rc-t1--low" data-start="0.2333" data-duration="0.2000" data-track-index="10" style="z-index: 40"><span class="rc-g"><span class="rc-w" data-rc-f="7">And</span></span></div>
      <div data-hf-id="hf-2lp3" id="b17-cap-2" class="clip rc-t1 rc-cap rc-t1--low" data-start="0.4333" data-duration="0.9667" data-track-index="10" style="z-index: 40"><span class="rc-g"><span class="rc-w" data-rc-f="13">GTA</span> <span class="rc-w" data-rc-f="20">6?</span></span></div>
      <div data-hf-id="hf-dwx9" id="b17-cap-3" class="clip rc-t1 rc-cap rc-t1--low" data-start="1.4000" data-duration="0.4000" data-track-index="10" style="z-index: 40"><span class="rc-g"><span class="rc-w" data-rc-f="42">It</span> <span class="rc-w" data-rc-f="45">opens</span></span></div>
      <div id="b17-cap-4" class="clip rc-t1 rc-cap rc-t1--low" data-start="1.8000" data-duration="0.4666" data-track-index="10" style="z-index: 40"><span class="rc-g"><span class="rc-w" data-rc-f="54">with</span> <span class="rc-w" data-rc-f="60">Lucia</span></span></div>
      <div id="b17-cap-5" class="clip rc-t1 rc-cap rc-t1--low" data-start="2.2666" data-duration="1.1667" data-track-index="10" style="z-index: 40"><span class="rc-g"><span class="rc-w" data-rc-f="68">already</span> <span class="rc-w" data-rc-f="80">caught.</span></span></div>
      <!-- "So who's" hard-cuts out on "chasing" (local 115 = beat 109), where the T2 lead-in and the second chase cut start -->
      <div data-hf-id="hf-my23" id="b17-cap-6" class="clip rc-t1 rc-cap rc-t1--low" data-start="3.4333" data-duration="0.4000" data-track-index="10" style="z-index: 40"><span class="rc-g"><span class="rc-w" data-rc-f="103">So</span> <span class="rc-w" data-rc-f="106">who's</span></span></div>

      <!-- ===== T2 punch pair, word by word (max 2 words): lead-in "chasing who" (beat 109, over the chase shots), then the
           keyword "now?" alone (blur-in on "now?", beat 129, on black, 45 px lower than the lead-in line so it stays clear
           of the logo's bottom tip at 115%); at the final hit (beat 161) "now?" breaks apart with T10 (kit glitch on the
           keyword, rc-t10--key face) while the X4 tears the logo, then the hard cut to black (beat 169). ===== -->
      <div data-hf-id="hf-at7q" id="b17-t2-1" class="clip rc-t2 rc-cap" data-start="3.8333" data-duration="0.6667" data-track-index="11" style="--rc-y: 880px; z-index: 40"><div class="rc-t2__row rc-g"><span class="rc-t2__lead"><span class="rc-w" data-rc-f="115">chasing</span> <span class="rc-w" data-rc-f="129">who</span></span></div></div>
      <div id="b17-t2-2" class="clip rc-t2 rc-cap" data-start="4.5000" data-duration="1.3333" data-track-index="11" style="--rc-y: 925px; z-index: 40"><div class="rc-t2__row rc-g"><span id="b17-key" class="rc-t2__key rc-t10--key"><span class="rc-w rc-w--key" data-rc-f="135"><span class="rc-t10__word">now?</span></span></span></div></div>
    </div>
    <script src="assets/kit/type.js"></script>
    <script src="assets/kit/motifs.js"></script>
    <script src="assets/kit/transitions.js"></script>
    <script src="assets/kit/screens.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions;
      const F = (n) => n / 30;
      // x4_still.sh renders a copy of this page with data-x4-capture on <html>: the logo at its landed 115%, sharp,
      // without text and without the tear = the X4 "old frame" still.
      const CAPTURE = document.documentElement.hasAttribute("data-x4-capture");

      // Word onsets on this composition's clock (v02 words.json comp_t, s): GTA 0.438, now? 4.490, end of "now?" 4.895
      const W = { GTA: 0.438, now: 4.490, nowEnd: 4.895 };
      const kNow = T.frame(W.now);                 // local 135 = beat 129: hard cut to black, keyword blur-in
      const kLogo = T.frame(W.nowEnd);             // local 147 = beat 141: end of "now?" (MU8), the logo comes in
      const kHit = kLogo + 20;                     // local 167 = beat 161: push lands, final hit (X4 + T10, S19); black from local 175
      const kChase = 106;                          // local 106 = beat 100: first chase cut (Tesseract), on "who's"

      // ---- captions (rule A): T1 and the T2 groups pop word by word (T1 / T2 lead presets, easeOutExpo); the keyword
      //      "now?" appears on its frame with the T2 blur punch (30 -> 0 px, 108 -> 100%, 6f, easeOutExpo)
      if (CAPTURE) gsap.set('.rc-cap', { opacity: 0 });
      else T.captionPops(tl);

      // ---- M1: five stars (40 px, row centred on x 1700, y 80) pop in on "GTA" (3f each, 3f apart, easeOutQuart), then
      //      blink (6f on / 6f off, hard) over the Trailer 1 opening until the first chase cut ----
      const starsIn = M.starsPopIn(tl, "#b17-stars", W.GTA);
      M.starsBlink(tl, "#b17-stars", starsIn, { until: F(kChase) });

      // ---- the logo push-in: 100% -> 115% over 20f (beat 141 -> 161) about the frame centre, accelerating
      //      (log-space easeInCubic) into the hit, with motion blur (kit X6 machinery: media-treatment blur control,
      //      one value per frame; blurRef 2200 = a 360-degree shutter measured at the frame corner, so the blur reads,
      //      peaking ~6.5 px on the last frames). Before beat 141 the world holds 100%. ----
      X.zoom(tl, "#b17-world", F(kLogo), {
        screen: { rect: [0, 0, 1920, 1080] }, scale: 1.15, frames: 20, dir: "in", ease: "power2.in",
        blurRef: 2200, blur: !CAPTURE,
      });

      // ---- the final hit (beat 161): X4 tear on the logo (8f, seed 8, still mode = the same X4 settings as b08-break's
      //      v02 break) and T10 on "now?" (6f glitch, hard per-frame cuts, seed 8 = the same slice pattern as b08's "breaks.";
      //      it breaks apart, does not settle and holds its last broken frame while the tear finishes), then the hard cut
      //      to black at beat 169 (local 175: all clips end there). ----
      if (CAPTURE) {
        document.getElementById("b17-x4").remove();
      } else {
        X.tear(tl, "#b17-x4", F(kHit), { frames: 8, seed: 8 });
        T.glitch(tl, "#b17-key", F(kHit), { frames: 6, seed: 8, settle: false });
      }

      tl.set({}, {}, F(198));
      window.__timelines["b17-loop"] = tl;
    </script>
