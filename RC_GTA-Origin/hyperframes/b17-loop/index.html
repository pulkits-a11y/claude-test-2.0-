    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* the R17.4 end card fills the frame (never stretched); the world wrapper is what X.zoom scales */
      #b17-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b17-logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
      /* v03: T10 inside the lockup keyword "now?" (row: Coolvetica Italic 170 px, line-height 170 px): the glitch word
         inherits the row's face; the three slices cut its cap region (33 .. 147 px of the 170 px line: cap top 0.195 em,
         baseline 0.867 em) in thirds at 71 / 109 px. The glitch layer carries no shadow (T10 on black); the clean word keeps
         the lockup glow. */
      #b17-key { position: relative; display: inline-block; font: inherit; line-height: inherit; white-space: nowrap; }
      #b17-key .rc-t10__glitch { text-shadow: none; }
      #b17-key .rc-t10__slice--1 { clip-path: inset(-80px -80px 99px -80px); }
      #b17-key .rc-t10__slice--2 { clip-path: inset(71px -80px 61px -80px); }
      #b17-key .rc-t10__slice--3 { clip-path: inset(109px -80px -80px -80px); }

         At the final hit "now?" breaks apart with T10. L2 letterbox on the opening seconds of Trailer 1 (Lucia in

         Owners (beat frames): f0-100 TS+HF (Tesseract: the madebyajit Trailer 1 opening in the L2 band, two shots: the guard

         f129-186 HF opaque (black, T2 "now?", the R17.4 logo push-in, X4 (8f) + T10 at f161, black tail from f169). tesseract_shots.json.

           z30  #b17-x4  X4 tear canvas (8f, seed 8, still mode = B8's v02 break; still = this composition at local 167
                         without text)                                                                    local 167-174
           z20  #b17-stars  M1 five stars, 40 px, row centred on (1700, 80) (plan), pop in on "GTA", blink to the first chase cut
           z3   #b17-world  R17.4 end card (logo), push 100 -> 115% over 20f, accelerating, motion blur  local 147-174
           z1   #b17-black  ink black #0A0A0A                                                            local 135-197
           (transparent elsewhere: Tesseract footage shows through) -->

st&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-fd1u" id="b17-logo" class="clip" src="assets/footage/R17.4.mp4" data-start="4.9000" data-duration="0.9333" data-media-start="0" data-track-index="2" muted playsinline style="--hf-color-grading-blur: 0"></video>

      <!-- ===== f161: final X4 tear on the logo (8f, seed 8, still mode, as B8's v02 break), then black from f169.

      <!-- ===== v03 captions (notes 11, 16, 17): lockups like ref 1, every word a hard cut on its frame. Over the Trailer 1
           opening the lockups sit low (ink centre y 820: Lucia's face fills the upper band, as the v02 low line did):
           "And [GTA 6?]" / "It opens with [Lucia] already caught."; over the chase cuts one centred line "So who's chasing who";
           on the cut to black the keyword "now?" alone, starred (pop + blur-in on its frame), low (ink centre y 960, 170 px)
           so it stays clear of the logo's bottom tips at 115%; at the final hit (beat 161) "now?" breaks apart with T10
           (#b17-key inside the keyword) while the X4 tears the logo, then the hard cut to black (beat 169). ===== -->
      <div id="b17-lk-1" class="clip rc-lk" data-start="0.2333" data-duration="1.1667" data-track-index="10" style="--rc-y: 820px; --rc-lk-c: 104.2px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 60px; line-height: 60px; height: 60px"><span class="rc-lw" data-rc-f="7">And</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -28.03px"><span class="rc-lw" data-rc-f="13">GTA</span> <span class="rc-lw" data-rc-f="20">6?</span></div></div></div>
      <div id="b17-lk-2" class="clip rc-lk" data-start="1.4000" data-duration="2.0333" data-track-index="10" style="--rc-y: 820px; --rc-lk-c: 135.35px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 60px; line-height: 60px; height: 60px"><span class="rc-lw" data-rc-f="42">It</span> <span class="rc-lw" data-rc-f="45">opens</span> <span class="rc-lw" data-rc-f="54">with</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -23.05px"><span class="rc-lw" data-rc-f="60">Lucia</span></div><div class="rc-lk__row rc-lk__row--tail" style="font-size: 60px; line-height: 60px; height: 60px; margin-top: -19.97px"><span class="rc-lw" data-rc-f="68">already</span> <span class="rc-lw" data-rc-f="80">caught.</span></div></div></div>
      <div id="b17-lk-c-1" class="clip rc-lk" data-start="3.4333" data-duration="1.0667" data-track-index="10" style="--rc-lk-c: 33.98px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--solo" style="font-size: 64px; line-height: 64px; height: 64px"><span class="rc-lw" data-rc-f="103">So</span> <span class="rc-lw" data-rc-f="106">who's</span> <span class="rc-lw" data-rc-f="115">chasing</span> <span class="rc-lw" data-rc-f="129">who</span></div></div></div>

    <script src="assets/kit/type.js"></script>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions;
      const F = (n) => n / 30;
      // x4_still.sh renders a copy of this page with data-x4-capture on <html>: the logo at its landed 115%, sharp,
      // without text and without the tear = the X4 "old frame" still.
      const CAPTURE = document.documentElement.hasAttribute("data-x4-capture");

      // Word onsets on this composition's clock (v02 words.json comp_t, s): GTA 0.438, now? 4.490, end of "now?" 4.895
      const W = { GTA: 0.438, now: 4.490, nowEnd: 4.895 };
      const kNow = T.frame(W.now);                 // local 135 = beat 129: hard cut to black, keyword blur-in
      const kLogo = T.frame(W.nowEnd);             // local 147 = beat 141: end of "now?" (MU8), the logo comes in
      const kHit = kLogo + 20;                     // local 167 = beat 161: push lands, final hit (X4 + T10, S19); black from local 175
      const kChase = 106;                          // local 106 = beat 100: first chase cut (Tesseract), on "who's"

      // ---- captions (v03): lockup words hard-cut in on their frames; the starred keyword "now?" pops + blurs in (blur 20 px,
      //      92% -> 100%, 6f easeOutExpo) on its frame (local 135 = beat 129, the cut to black)
      if (CAPTURE) gsap.set('.rc-lk', { opacity: 0 });
      else T.lockupsWire(tl);

      // ---- M1: five stars (40 px, row centred on x 1700, y 80) pop in on "GTA" (3f each, 3f apart, easeOutQuart), then
      //      blink (6f on / 6f off, hard) over the Trailer 1 opening until the first chase cut ----
      const starsIn = M.starsPopIn(tl, "#b17-stars", W.GTA);
      M.starsBlink(tl, "#b17-stars", starsIn, { until: F(kChase) });

      // ---- the logo push-in: 100% -> 115% over 20f (beat 141 -> 161) about the frame centre, accelerating
      //      (log-space easeInCubic) into the hit, with motion blur (kit X6 machinery: media-treatment blur control,
      //      one value per frame; blurRef 2200 = a 360-degree shutter measured at the frame corner, so the blur reads,
      //      peaking ~6.5 px on the last frames). Before beat 141 the world holds 100%. ----
      X.zoom(tl, "#b17-world", F(kLogo), {
        screen: { rect: [0, 0, 1920, 1080] }, scale: 1.15, frames: 20, dir: "in", ease: "power2.in",
        blurRef: 2200, blur: !CAPTURE,
      });

      // ---- the final hit (beat 161): X4 tear on the logo (8f, seed 8, still mode = the same X4 settings as b08-break's
      //      v02 break) and T10 on "now?" (6f glitch, hard per-frame cuts, seed 8 = the same slice pattern as b08's "breaks.";
      //      it breaks apart, does not settle and holds its last broken frame while the tear finishes), then the hard cut
      //      to black at beat 169 (local 175: all clips end there). ----
      if (CAPTURE) {
        document.getElementById("b17-x4").remove();
      } else {
        X.tear(tl, "#b17-x4", F(kHit), { frames: 8, seed: 8 });
        T.glitch(tl, "#b17-key", F(kHit), { frames: 6, seed: 8, settle: false });
      }

      tl.set({}, {}, F(198));
      window.__timelines["b17-loop"] = tl;
    </script>
