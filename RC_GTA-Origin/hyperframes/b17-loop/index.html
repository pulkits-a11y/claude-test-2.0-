    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* the R17.4 end card fills the frame (never stretched); the world wrapper is what X.zoom scales */
      #b17-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b17-logo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
      /* v05 (doc 71.5-74.4 [DEPTH]): the Trailer 1 custody shots live in this composition now. Two camera wrappers get the
         SAME push: #b17-plates (the shots) and #b17-cuts (Lucia cut out of the same frames by remove-background); the key word
         sits between them (steady), so her head / shoulder passes in front of it. */
      #b17-plates, #b17-cuts { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #b17-plates video, #b17-cuts video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
      /* L2 letterbox bars (138 px), drawn here now that the shots are here; they slide in over 8 f on the first frame */
      .b17-bar { position: absolute; left: 0; width: 1920px; height: 138px; background: var(--ink-black); }
      #b17-bar-t { top: 0; transform-origin: 50% 0%; }
      #b17-bar-b { bottom: 0; transform-origin: 50% 100%; }
    </style>

    <!-- B17 b17-loop (v04): beat 186f (6.200s, incl. the 45f logo tail after "now?") + 6f handle each end = 198f.
         Local time 0 = beat start - 6f; the beat runs local 0.2000s .. 6.4000s (local frame = beat frame + 6).
         Word timings: words.json (comp_t, v02 VO 115%, unchanged in v03). Spec: ../../PRODUCTION_SPEC.md. Plan: ../../00_Brief/ (B17 p.27-28).

         100% -> 115% over 20f with motion blur; final X4 tear on the logo, T10 on "now?", then black (logo tail).

         Owners (beat frames): f0-100 TS+HF (Tesseract, v04 note 20: Rockstar's official GTA VI Trailer 1 opening in the L2

         officer f40-61, facing camera in the orange jumpsuit f61-100; HF: transparent + M1 stars + lockups), f100-129 TS+HF (Tesseract: R17.2 @ 7.2 / R17.4 @ 47.2 /
         R17.2 @ 11.9, 9-10f each, R17.2 substituting for the missing R17.3; HF: transparent + T1 "So who's" + T2 "chasing who"),
         f129-186 HF opaque (black, T2 "now?", the R17.4 logo push-in, X4 (8f) + T10 at f161, black tail from f169). tesseract_shots.json.

         Layer stack (top -> bottom):

           z3   #b17-world  R17.4 end card (logo), push 100 -> 115% over 20f, accelerating, motion blur  local 147-174
           z1   #b17-black  ink black #0A0A0A                                                            local 135-197
           (transparent elsewhere: Tesseract footage shows through) -->

        <video id="b17-face-cut" class="clip" src="assets/depth/R17.1-facing-cut.webm" data-start="2.0000" data-duration="1.2666" data-media-start="0" data-track-index="2" muted playsinline></video>

st&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" data-hf-id="hf-fd1u" id="b17-logo" class="clip" src="assets/footage/R17.4.mp4" data-start="4.9000" data-duration="1.1000" data-media-start="0" data-track-index="2" muted playsinline style="--hf-color-grading-blur: 0"></video>

      <!-- ===== v03 captions (notes 11, 16, 17): lockups like ref 1, every word a hard cut on its frame. Over the Trailer 1
           opening the lockups sit low (ink centre y 820: Lucia's face fills the upper band, as the v02 low line did):
           "And [GTA 6?]" / "It opens with [Lucia] already caught."; over the chase cuts one centred line "So who's chasing who";
           on the cut to black the keyword "now?" alone, starred (pop + blur-in on its frame), low (ink centre y 960, 170 px)
           so it stays clear of the logo's bottom tips at 115%; at the final hit (beat 161) "now?" breaks apart with T10
           (#b17-key inside the keyword) while the X4 tears the logo, then the hard cut to black (beat 169). ===== -->
      <div id="b17-lk-1" class="clip rc-lk" data-start="0.2333" data-duration="1.1667" data-track-index="10" style="--rc-y: 820px; --rc-lk-c: 104.2px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 60px; line-height: 60px; height: 60px"><span class="rc-lw" data-rc-f="7">And</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -28.03px"><span class="rc-lw" data-rc-f="13">GTA</span> <span class="rc-lw" data-rc-f="20">6?</span></div></div></div>
      <div id="b17-lk-2" class="clip rc-lk" data-start="1.4000" data-duration="2.0333" data-track-index="10" style="--rc-y: 820px; --rc-lk-c: 135.35px; z-index: 40"><div class="rc-lk__box"><div class="rc-lk__row rc-lk__row--lead" style="font-size: 60px; line-height: 60px; height: 60px"><span class="rc-lw" data-rc-f="42">It</span> <span class="rc-lw" data-rc-f="45">opens</span> <span class="rc-lw" data-rc-f="54">with</span></div><div class="rc-lk__row rc-lk__row--key" style="font-size: 190px; line-height: 190px; height: 190px; margin-top: -23.05px"><span class="rc-lw" data-rc-f="60">Lucia</span></div><div class="rc-lk__row rc-lk__row--tail" style="font-size: 60px; line-height: 60px; height: 60px; margin-top: -19.97px"><span class="rc-lw" data-rc-f="68">already</span> <span class="rc-lw" data-rc-f="80">caught.</span></div></div></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, M = RCK.motifs, X = RCK.transitions;
      const F = (n) => n / 30;
      // Word onsets on this composition's clock (v05 words.json comp_t, s): GTA 0.438, now? 4.490, end of "now?" 4.895
      const W = { GTA: 0.438, now: 4.490, nowEnd: 4.895 };
      const kNow = T.frame(W.now);                 // local 135 = beat 129: hard cut to black, "now?" (siren flicker: TODO kit)
      const kLogo = T.frame(W.nowEnd);             // local 147 = beat 141: end of "now?": the GTA VI logo slam (TODO kit logoSlam)
      const kChase = 98;                           // local 98 = beat 92: first chase cut (Tesseract), after "caught."
      const kOff = 42, kFace = 60;                 // local cuts: window -> officer (beat 36, "It"), officer -> facing (beat 54, "Lucia")

      // ---- captions (TODO kit v05: tiers, pink -> white entry, [DEPTH] key-word copies between #b17-plates and #b17-cuts)
      T.lockupsWire(tl);

      // ---- L2 bars slide in over the first 8 f (easeOutCubic), gone with the cut to the chase shots (full frame) ----
      tl.fromTo(['#b17-bar-t', '#b17-bar-b'], { scaleY: 0 }, { scaleY: 1, duration: 8 / 30, ease: 'power2.out', immediateRender: true }, 6 / 30);

      // ---- camera: plates and cut-outs move together (same tweens on both wrappers). Window shot: held-shot push
      //      100 -> 104% (easeInOutSine) to the cut on "It"; then the doc's slow push 100 -> 110% (easeInOutSine) across
      //      "It opens with Lucia already caught." (officer + facing shots, local 42-98) ----
      const CAMS = ['#b17-plates', '#b17-cuts'];
      gsap.set(CAMS, { scale: 1, transformOrigin: '960px 540px' });
      tl.fromTo(CAMS, { scale: 1 }, { scale: 1.04, duration: kOff / 30, ease: 'sine.inOut', immediateRender: false }, 0);
      tl.fromTo(CAMS, { scale: 1 }, { scale: 1.10, duration: (kChase - kOff) / 30, ease: 'sine.inOut', immediateRender: false }, kOff / 30);

      // ---- M1: five stars (40 px, row centred on x 1700, y 80) pop in on "GTA" (3f each, 3f apart, easeOutQuart), then
      //      blink (6f on / 6f off, hard) over the Trailer 1 opening until the first chase cut ----
      const starsIn = M.starsPopIn(tl, "#b17-stars", W.GTA);
      M.starsBlink(tl, "#b17-stars", starsIn, { until: F(kChase) });

      // ---- the GTA VI logo (R17.4 end card) from the end of "now?" (beat 141) to the cut to B18 (beat 168) and the tail
      //      handle. TODO(kit v05): RCK logoSlam, identical to B1 (150/160 -> 94 -> 100% over 6 f, white flash, flash-star,
      //      shake). v04's push 100 -> 115%, X4 tear and T10 break at beat 161 are gone (the logo holds 27 f, then a hard cut).
      tl.set({}, {}, F(180));
      window.__timelines["b17-loop"] = tl;
    </script>
