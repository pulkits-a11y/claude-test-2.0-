    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      /* Lane C push-in wrapper (plan rule 7: every held shot pushes in 100% -> 104%). It sits INSIDE each
         958 px half, so the L11 frame itself (halves x 0-958 / 962-1920, 4 px divider) never moves or scales:
         B5, B6 and B11 keep identical split-screen framing (plan p.25 "same frame size and position", QA 7).
         The video is not a direct child of .rc-l11__half here, so the kit's half > video fill rule is repeated. */
      .lc-push { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .lc-push > video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--rc-pos, 50% 50%); }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const S = RCK.screens, M = RCK.motifs, X = RCK.transitions;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: In 6, it, 9, you 20, play 25, a 32, police 34, officer 43, chasing 56, criminals. 67.

      // Plan rule 7 push-in, one continuous move across the whole L11 shot B5 f0 .. B6 f61 (the X2 cut), defined on the
      // edit clock: 100% at B5 local 0 (edit 640) -> 104% at B6 local 67 (edit 795) = 155 frames. B5 covers local 0..100.
      const PUSH_SPAN_F = 155;
      S.push(tl, '#b05-split .lc-push', 0, { until: f(100), from: 1, to: 1 + 0.04 * 100 / PUSH_SPAN_F });

      // M2: "you" label hard-cuts in on "you" (local 20), shaft + head drawn by local 28 (8f, ease out).
      M.arrowDraw(tl, '#b05-arrow', f(20), { from: [800, 290], to: [545, 520], bend: 0.16, seed: 7, label: 'you' });

      // X9 on "police" (local 34): red 34-35, blue 36-37, gone on 38.
      X.sirenWash(tl, '#b05-x9', f(34));

      window.__timelines["b05-copgame"] = tl;
    </script>
