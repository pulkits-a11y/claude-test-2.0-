    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions, C = RCK.cam, FX = RCK.fx;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: So 6, the 9, people 13, above 22, the 31, team 35, keep 41, trying 48, to 58,
      // shut 62, it 68, down. 72 (voice ends 84).

      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));

      // ---- A-C (the office card inserts, 0-41): one slow push 100 -> 104%, easeInOutSine, shared by the three cards (each
      //      card's .fx-card__cam plays its segment of the same curve: scale(L) = 1 + 0.04 * sine.inOut(L / 41)). ----
      const ABC = 41, P0 = 0.04, sc = (n) => 1 + P0 * SIN(n / ABC);
      const segPush = (el, a, b, origin) => C.push(tl, el, f(a), { until: f(b), from: sc(a), to: sc(b), ease: seg(a / ABC, b / ABC), origin });
      segPush('#b07-cardA .fx-card__cam', 0, 22);
      segPush('#b07-cardB .fx-card__cam', 22, 35);
      segPush('#b07-cardC .fx-card__cam', 35, 41);

      // ---- v05 (doc 28.0): the yellow hand-drawn arrow on "above" (22), drawn over 8f (shaft 22-28, head 28-30, kit
      //      annotate: stroke trim, power2.out, marker texture, slight jitter), pointing up at the man at the back of the
      //      office on card B (his head ~ (545, 489) on screen); held to the cut on "team" (35). ----
      FX.annotate(tl, '#b07-ann', f(22), { type: 'arrow', from: [418, 868], to: [536, 548], frames: 8, seed: 8 });

      // ---- the article, ONE shot (v05, doc 29.5 "Push in 100%->118% across the shot"): push about the frame centre on the
      //      EDIT clock shared with b08-break, from the cut on "keep" (41) to "breaks" (b08 local 39 = this local 129), 88f,
      //      easeInOutSine; this composition plays 41-102 (segment of the curve), b08 plays the rest. ----
      const ART0 = 41, ART_LEN = 88, ART_S = 1.18, pEnd = (102 - ART0) / ART_LEN;
      C.push(tl, '#b07-artCam', f(ART0), { until: f(102), from: 1, to: 1 + (ART_S - 1) * SIN(pEnd), ease: seg(0, pEnd) });

      // ---- the framing: the headline until 57, then the whip-pan (doc ~30.0 "cut or whip-pan to the body copy") over 4f,
      //      easeInOutQuart (57 headline, 58 3%, 59 halfway, 60 97%, 61 the body), to the article column. Motion blur =
      //      per-frame values (hard steps, like the kit's X6): 0 / 9 / 21 / 9 / 0 layout px, on the page image through its
      //      media-treatment blur control (footage is never CSS-filtered) and on the DOM layers (strokes, spotlight) by CSS. ----
      const FD = { x: -26.5412, y: 0, scale: 1.1294118 }, FE = { x: -68.5714, y: -2144.9143, scale: 1.3714286 };
      gsap.set('#b07-page', Object.assign({ transformOrigin: '0 0', force3D: false }, FD));
      tl.fromTo('#b07-page', FD, Object.assign({ duration: 4 / 30, ease: 'power3.inOut', force3D: false, immediateRender: false }, FE), f(57));
      const step = (el, from, to, k) => tl.fromTo(el, from, Object.assign({ duration: 0.5 / 30, ease: 'steps(1)', immediateRender: false }, to), (k - 0.75) / 30);
      const WHIP = [[58, 9], [59, 21], [60, 9], [61, 0]], domBlur = '#b07-hlgroup, #b07-dimD svg, #b07-dimE svg';
      const art = document.getElementById('b07-art');
      art.style.setProperty('--hf-color-grading-blur', '0');
      let prevPx = 0;
      WHIP.forEach(([k, px]) => {
        step(art, { '--hf-color-grading-blur': X.blurValue(prevPx) }, { '--hf-color-grading-blur': X.blurValue(px) }, k);
        step(domBlur, { filter: prevPx ? 'blur(' + prevPx + 'px)' : 'none' }, { filter: px ? 'blur(' + px + 'px)' : 'none' }, k);   // 0 px = no filter at all
        prevPx = px;
      });

      // ---- v05 pink highlighter sweeps (kit RCK.fx.highlight: #FF2E7E, wipe left -> right over 8f, power2.out, no page
      //      push): the headline on 49 (doc 29.6), "It was almost canned." on 61 (doc ~30.0, the body's first frame), "The
      //      publisher, BMG Interactive, wanted to can it" on 82 (after "down." 72: the event before b08's "Then," 97). ----
      FX.highlight(tl, '#b07-hl0', f(49));
      FX.highlight(tl, '#b07-hl1', f(61));
      FX.highlight(tl, '#b07-hl2', f(82));

      // ---- v05 caption lockups (every .rc-lk above): plain words appear on their spoken frame; the starred keys "above" (22)
      //      and "shut" (62) pop + blur in (kit v05 pop, white) ----
      T.lockupsWire(tl);

      window.__timelines["b07-shutdown"] = tl;
    </script>
