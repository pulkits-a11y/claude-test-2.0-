    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const T = RCK.type, X = RCK.transitions, C = RCK.cam;
      const f = (n) => n / 30;                         // composition-local frame -> seconds (local = beat frame + 6)

      // Word frames (local) from words.json: So 6, the 9, people 13, above 22, the 31, team 35, keep 41, trying 48, to 58,
      // shut 62, it 68, down. 72 (voice ends 84).

      // ---- office B-roll, fast cuts with eased zooms (rule D: alternate pushes and zoom-outs) ----
      C.push(tl, '#b07-camA', f(0), { until: f(22), from: 1, to: 1.08 });
      C.zoomOut(tl, '#b07-camB', f(22), { until: f(31), from: 1.12, to: 1 });
      C.push(tl, '#b07-camC', f(31), { until: f(41), from: 1, to: 1.08 });

      // ---- D: the cut to the headline on "keep" (red hit 1): punch-in that settles, 112 -> 100% over 10f, easeOutExpo,
      //      about the headline centre ----
      C.punchIn(tl, '#b07-camD', f(41), { from: 1.12, to: 1, frames: 10, origin: '960px 190.3px' });

      // ---- E: the article push, ONE eased move on the EDIT clock shared with b08-break: from the cut on "to" (B7 local 58 =
      //      edit 897) to "breaks" (B8 local 39 = edit 968), 71f, easeInOutSine: scale 100 -> 118% about the sentence centre
      //      (frame px 1053.3, 613.0 in the base framing) + drift (-93.3, -53.0) px, so the sentence ends centred at (960, 560).
      //      This composition plays its first 44 frames (to local 102) on the same curve (segment of the ease, not restarted);
      //      b08-break plays the rest. The page never leaves the article column (checked: page x 50-1450, y 1564-2351.5). ----
      const SIN = gsap.parseEase('sine.inOut');
      const seg = (a, b) => (p) => (SIN(a + p * (b - a)) - SIN(a)) / (SIN(b) - SIN(a));
      const E_LEN = 71, E_S = 1.18, E_DX = -93.257, E_DY = -53.029, pEnd = SIN(44 / E_LEN);
      C.push(tl, '#b07-camE', f(58), { until: f(102), from: 1, to: 1 + (E_S - 1) * pEnd, ease: seg(0, 44 / E_LEN), origin: '1053.257px 613.029px' });
      gsap.set('#b07-driftE', { x: 0, y: 0, force3D: false });
      tl.fromTo('#b07-driftE', { x: 0, y: 0 }, { x: E_DX * pEnd, y: E_DY * pEnd, duration: 44 / 30, ease: seg(0, 44 / E_LEN), force3D: false, immediateRender: false }, f(58));

      // ---- highlighter (kit T9: left -> right swipe over 8f, easeOutQuart), each one starting on the word before the hit, so
      //      it is 94% across on the hit frame: swipe 1 on "to" (58) lands on "shut" (62); swipe 2 on "it" (68) on "down." (72) ----
      T.highlight(tl, '#b07-hl1', f(58));
      T.highlight(tl, '#b07-hl2', f(68));

      // ---- red hits on "keep" (41), "shut" (62), "down." (72): the kit X3 flash curve on a siren-red multiply layer:
      //      C-3 0 | C-2 11% | C-1 44% | C 100% (easeInQuad) | C+1 73% | C+2 51% | C+3 33% | C+4 18% | C+5 8% | C+6 2% | C+7 0
      //      (easeOutQuad over 7 frames = out over ~6f). Peaks = the S06 hit peaks (cues.json stamp1-3 = beat 35, 56, 66). ----
      X.flash(tl, '#b07-red1', f(41), { ramp: 2, hold: 1, fade: 6 });
      X.flash(tl, '#b07-red2', f(62), { ramp: 2, hold: 1, fade: 6 });
      X.flash(tl, '#b07-red3', f(72), { ramp: 2, hold: 1, fade: 6 });

      // ---- T1 word pops (every .rc-cap above): each word on its onset frame, max 2 words on screen ----
      T.captionPops(tl);

      window.__timelines["b07-shutdown"] = tl;
    </script>
