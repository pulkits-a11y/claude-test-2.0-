<!doctype html>
<!--
  Retail Pop-Up MG — Raw Canvas / Nike reel, VO beat at 0:30.
  "Nike pulled out of stores like DSW and Dillard's, and sent less to Foot Locker."

  One shot: three miniature storefronts pop up through a studio floor, the camera
  pulls back, a swoosh appears above them and dissolves away.
  The 3D scene is assets/scene.js (three.js, vendored); every frame is render(t),
  driven by the linear GSAP clock below, so any frame renders on its own.
-->
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    { "id": "ground", "type": "color", "role": "style", "label": "Background", "default": "#111111" },
    { "id": "accent", "type": "color", "role": "style", "label": "Swoosh accent", "default": "#c4f0b4" },
    { "id": "ink", "type": "color", "role": "style", "label": "Sign ink (light)", "default": "#eeeeea" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/lib/three.module.js" } }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111111;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground, #111111);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6.5"
      data-width="1920"
      data-height="1080"
    >
      <canvas
        id="stage"
        class="clip"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
        data-track-kind="graphics"
        width="1920"
        height="1080"
      ></canvas>
    </div>

    <script>
      (function () {
        var html = document.documentElement;
        var defaults = {};
        try {
          JSON.parse(html.getAttribute("data-composition-variables") || "[]").forEach(function (v) {
            defaults[v.id] = v.default;
          });
        } catch (error) {
          /* malformed declaration: scene.js falls back to its own defaults */
        }
        var scoped =
          (window.__hyperframes &&
            window.__hyperframes.getVariables &&
            window.__hyperframes.getVariables()) ||
          {};
        var vars = Object.assign({}, defaults, window.__hfVariables || {}, scoped);
        var root = document.getElementById("root");
        root.style.setProperty("--ground", vars.ground || "#111111");

        var duration = parseFloat(root.dataset.duration) || 6.5;
        var clock = { t: 0 };
        var mg = {
          vars: vars,
          width: parseInt(root.dataset.width, 10) || 1920,
          height: parseInt(root.dataset.height, 10) || 1080,
          duration: duration,
          clock: clock,
          render: null,
        };
        window.__mg = mg;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["retail-popup"] = new Promise(function (resolve, reject) {
          mg.ready = resolve;
          mg.fail = reject;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: duration,
          duration: duration,
          ease: "none",
          onUpdate: function () {
            if (mg.render) mg.render(clock.t);
          },
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
    <script type="module" src="assets/scene.js"></script>
  </body>
</html>
